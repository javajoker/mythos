<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：泰室之山＝三受水分水嶺（伊水西南/洛西/役水汜水東北入河）——不依太室少室同名（借名標記）。</text>
<text x="1090" y="276" font-size="10" fill="#666">腿程1,056 vs 自記1,184（variant）；里程層累——中原鏈腿程普遍超實距2-4×（F-0008），範圍以水系拓扑</text>
<text x="1090" y="291" font-size="10" fill="#666">為主。</text>
<text x="1090" y="310" font-size="10" fill="#666">雙神群：冢級人面三首 vs 餘山豕身人面。</text>
<text x="1090" y="344.0" font-size="14" font-weight="bold" fill="#333">19 站 → 現實候選（審核中）</text>
<text x="1090" y="366" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 休輿之山</tspan>　→ 鞏義—偃師西·帝臺之棋禱百神</text>
<text x="1090" y="387" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 鼓鍾之山</tspan>　→ 偃師方向·帝臺觴百神</text>
<text x="1090" y="408" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 姑媱之山</tspan>　→ 孟津—偃師·帝女化䔄草</text>
<text x="1090" y="430" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 苦山</tspan>　→ 洛陽東·冠名山·冢級</text>
<text x="1090" y="451" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 堵山</tspan>　→ 洛陽—鞏義·神天愚居之</text>
<text x="1090" y="472" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 放皋之山</tspan>　→ 鞏義—登封·明水→伊</text>
<text x="1090" y="493" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 大𩇵之山</tspan>　→ 登封西·狂水→伊</text>
<text x="1090" y="514" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 半石之山</tspan>　→ 登封西·雙源分水（伊/洛）</text>
<text x="1090" y="536" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 少室之山</tspan>　→ 嵩山少室方向·休水→洛（借名）</text>
<text x="1090" y="557" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 泰室之山</tspan>　→ 嵩山太室方向·拓撲錨（借名）</text>
<text x="1090" y="578" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 講山</tspan>　→ 嵩山西北·帝屋禦凶</text>
<text x="1090" y="599" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 嬰梁之山</tspan>　→ 鞏義南·蒼玉錞于玄石</text>
<text x="1090" y="620" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 浮戲之山</tspan>　→ 汜水河方向·汜水→河</text>
<text x="1090" y="642" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 少陘之山</tspan>　→ 滎陽—鄭州西·器難之水→役</text>
<text x="1090" y="663" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 太山</tspan>　→ 鄭州方向·雙源同注役</text>
<text x="1090" y="684" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 末山</tspan>　→ 鄭州方向·末水→役</text>
<text x="1090" y="705" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 役山</tspan>　→ 鄭州東北·役水→河</text>
<text x="1090" y="726" font-size="11" fill="#7b241c"><tspan font-weight="bold">18 敏山</tspan>　→ 中牟方向·㻬琈之玉東端</text>
<text x="1090" y="748" font-size="11" fill="#7b241c"><tspan font-weight="bold">19 大騩之山</tspan>　→ 新鄭具茨山方向（借名）</text>
<text x="60" y="590" font-size="11" fill="#666">推理說明：自休輿之山（帝臺之棋禱百神）東行——帝臺雙中心（休輿棋石/鼓鍾觴百神）→姑媱帝女化草→苦山（冠名冢級）→伊/洛雙受水（明水/狂水/來需→伊；合水/休水→洛；半石雙源分水）→泰室拓撲錨→</text>
<text x="60" y="606" font-size="11" fill="#666">北折講山/嬰梁→東翼汜水→河、器難/太水/承水/末水→役→河（多水匯流）→終點大騩。</text>
<text x="60" y="628" font-size="11" fill="#666">腿程 1,056 里≈407 km（0.385）vs 自記 1,184 里（+12%）；層累集中西段長腿（3–5×），東段密站接近實距（0.7–0.9×）。凡十九山＝19站閉合；三冢＋十六神＝19閉合。所有對應為競爭假說，時</text>
<text x="60" y="644" font-size="11" fill="#666">代窗口 4000–1000 BCE。</text>
</svg>