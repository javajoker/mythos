<text x="1090" y="258" font-size="10" fill="#666">東一「食水出焉」與東二「北臨食水」共享食水類名——首經在次二經之東（發起人裁定：邏輯方向符合）。</text>
<text x="1090" y="276" font-size="10" fill="#666">東二里程自記 vs 腿程偏差最大（大平原迂迴記 variant）；東三水行島鏈里程與 F-0008 陸行層累分開記。</text>
<text x="1090" y="295" font-size="10" fill="#666">全部四鏈經緯度已核對（避免張冠李戴）：東一 33–45°N/70.8°W；東二 32–54.5°N/112–113.7°W；東三 1</text>
<text x="1090" y="310" font-size="10" fill="#666">0–29.4°N/83–86.5°W；東四 26.3–30.2°N/85.9–89°W。</text>
<text x="1090" y="344.0" font-size="14" font-weight="bold" fill="#333">子經鏈 → 現實區域（審核中）</text>
<text x="1090" y="366" font-size="11" fill="#1e8449">東一·樕𧑤鏈（12 站）→ 阿巴拉契亞山系（緬因卡塔丁→佐治亞；食水＝聖勞倫斯河；人身龍首＋犬牲魚…</text>
<text x="1090" y="387" font-size="11" fill="#27ae60">東二·空桑鏈（17 站）→ 落基山東麓→大平原→墨西哥灣（犰狳主讀＝負鼠·裝死；食水＝北薩斯喀徹溫河…</text>
<text x="1090" y="408" font-size="11" fill="#196f3d">東三·尸胡鏈（9 站）→ 加勒比—中美島鏈（佛州海峽→巴哈馬→牙買加→哥斯達黎加；蠵龜✓；鱣鮪→大…</text>
<text x="1090" y="430" font-size="11" fill="#52be80"><tspan font-weight="bold">東四·北號鏈</tspan>（8 站）→ 灣北岸短鏈（路易斯安那—佛州西北；蜚/當康；食水＝灣岸東向河）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：《東山經》四鏈覆蓋美洲——東一自樕𧑤之山（緬因卡塔丁）沿阿巴拉契亞南行十二站至竹山（佐治亞），食水＝聖勞倫斯河（東北注大西洋）；東二自空桑之山（加拿大落基山東麓</text>
<text x="60" y="702" font-size="11" fill="#666">）沿東麓—大平原南行十七站至䃌山（墨西哥灣岸），食水＝北薩斯喀徹溫河、黃水＝密蘇里河；東三自尸胡之山（佛州海峽）水行島鏈九站——巴哈馬→古巴東—伊斯帕尼奧拉→牙買加→尼加</text>
<text x="60" y="718" font-size="11" fill="#666">拉瓜—哥斯達黎加（無皋之山）；東四為灣北岸短鏈八站（北號之山→太山）。</text>
<text x="60" y="740" font-size="11" fill="#666">概要圖站位＝各子經算術網格（層累已記於各經 variant）；食水＝類名共名（F-0011），共享水體 vs 同名異水待裁。所有對應為競爭假說，時代窗口 4000–1000 BCE；物種讀法按古漢語</text>
<text x="60" y="756" font-size="11" fill="#666">通用詞義（犰狳＝負鼠主讀；獸身人面＝造像/泛化）。</text>
</svg>