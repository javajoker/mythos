<text x="1362" y="468" font-size="9.5" fill="#2e86c1">西胡·白玉山 → 白玉山＝天山方向候選（F-0007）</text>
<text x="1362" y="485" font-size="9.5" fill="#c0392b">蒼梧 → 白玉山西南；舜葬借名雙假說</text>
<text x="1362" y="502" font-size="9.5" fill="#c0392b">昆侖山 → 「在西胡西」＝阿特拉斯方向候選；與昆侖虛分…</text>
<text x="1362" y="520" font-size="9.5" fill="#c0392b">鴈門之山 → 復用北三（借名）；實位圖外東北</text>
<text x="1362" y="538" font-size="9.5" fill="#c0392b">高柳 → 在代北（借名警示）</text>
<text x="1362" y="555" font-size="9.5" fill="#c0392b">大澤 → 方百里群鳥所生；在鴈門北</text>
<text x="1362" y="572" font-size="9.5" fill="#c0392b">疏屬之山 → 在開題西北；貳負危刑罰山</text>
<text x="1362" y="590" font-size="9.5" fill="#c0392b">開題 → 海內南跨卷方位樁</text>
<text x="1362" y="608" font-size="9.5" fill="#c0392b">氐國 → 海內南跨卷方位樁</text>
<text x="1362" y="625" font-size="9.5" fill="#c0392b">后稷之葬 → 氐國西；山水環之（借名）</text>
<text x="1362" y="642" font-size="9.5" fill="#c0392b">流黃酆氏 → 后稷葬西；有塗四方中有山</text>
