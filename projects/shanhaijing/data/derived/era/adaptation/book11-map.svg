<text x="1090" y="236" font-size="10" fill="#666">本卷為區域調查非里程鏈：實點＝復用西三/北三山經節點；虛框＝方向性待定錨（非定位）。</text>
<text x="1090" y="254" font-size="10" fill="#666">借名警示：大夏、月支、鴈門、高柳、代、蒼梧、后稷、「禹所導」積石——後世地名/傳說不反證本文地理。</text>
<text x="1090" y="273" font-size="10" fill="#666">異文（009 東胡/夷人、010 貊國/漢水/燕、011 孟鳥）帶戰國—漢注文色彩，單列待審。</text>
<text x="1090" y="292" font-size="10" fill="#666">昆侖虛（帝之下都）與西三昆侖之丘＝吉薩：合併/競爭雙假說並存（F-0007 核心），本層不裁決。</text>
<text x="1090" y="326.0" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="348" font-size="9.5" fill="#8e44ad">鍾山 → 復用西三＝南黎凡特丘陵</text>
<text x="1090" y="366" font-size="9.5" fill="#8e44ad">昆侖之虛 → 帝之下都＝吉薩（虛/丘競合）</text>
<text x="1090" y="383" font-size="9.5" fill="#8e44ad">流沙 → 復用西三＝蓋塔拉東緣沙沼</text>
<text x="1090" y="400" font-size="9.5" fill="#8e44ad">玉山·西王母 → 復用西三玉山＝錫瓦綠洲</text>
<text x="1090" y="418" font-size="9.5" fill="#8e44ad">積石山 → 復用西三＝卡蘭西奧古河道</text>
<text x="1090" y="436" font-size="9.5" fill="#8e44ad">章莪·畢方 → 復用西三＝錫爾特盆地東緣</text>
<text x="1090" y="453" font-size="9.5" fill="#8e44ad">三危·三青鳥 → 復用西三＝哈魯傑火山原</text>
<text x="1090" y="470" font-size="9.5" fill="#2471a3">赤水 → 復用西三＝紅海</text>
<text x="1090" y="488" font-size="9.5" fill="#2471a3">河水 → 復用西三＝尼羅河</text>
<text x="1090" y="506" font-size="9.5" fill="#2471a3">洋水 → 復用西三＝法雍支汊</text>
<text x="1090" y="523" font-size="9.5" fill="#2471a3">黑水 → 復用西三＝西部沙漠古河道</text>
<text x="1090" y="540" font-size="9.5" fill="#c0392b">弱水 → 吉薩環淵 vs 西四弱水雙假說</text>
<text x="1090" y="558" font-size="9.5" fill="#c0392b">青水 → 昆侖西南隅水；法雍南緣候選</text>
<text x="1090" y="576" font-size="9.5" fill="#c0392b">渤海 → 同名異實；地中海灣方向候選</text>
<text x="1090" y="593" font-size="9.5" fill="#2e86c1">南海 → 赤水所注＝阿拉伯海方向</text>
<text x="1090" y="610" font-size="9.5" fill="#2e86c1">厭火國 → 跨卷引用（海外南）；南海之東</text>
<text x="1090" y="628" font-size="9.5" fill="#2e86c1">羽民國 → 跨卷引用（海外南）；黑水入海之南</text>
<text x="1090" y="646" font-size="9.5" fill="#c0392b">黑水之山 → 流沙西南入海處山體（句讀兩可）</text>
<text x="1362" y="348" font-size="9.5" fill="#c0392b">昆侖南淵 → 昆侖南側深淵（三百仞誇飾）</text>
<text x="1362" y="366" font-size="9.5" fill="#c0392b">蛇巫之山 → 一曰龜山；操柸人東向立</text>
<text x="1362" y="383" font-size="9.5" fill="#c0392b">埻端·璽蓉 → 流沙中國，在昆侖虛東南</text>
<text x="1362" y="400" font-size="9.5" fill="#2e86c1">大夏 → 流沙外；巴克特里亞方向（借名）</text>
<text x="1362" y="418" font-size="9.5" fill="#2e86c1">月支 → 流沙外；河西—中亞方向（借名）</text>
<text x="1362" y="436" font-size="9.5" fill="#c0392b">豎沙·居繇 → 流沙外諸國，地望未明</text>
<text x="1362" y="453" font-size="9.5" fill="#2e86c1">西胡·白玉山 → 白玉山＝天山方向候選（F-0007）</text>
<text x="1362" y="470" font-size="9.5" fill="#c0392b">蒼梧 → 白玉山西南；舜葬借名雙假說</text>
<text x="1362" y="488" font-size="9.5" fill="#c0392b">昆侖山 → 西胡西；與昆侖虛競合雙假說</text>
<text x="1362" y="506" font-size="9.5" fill="#c0392b">鴈門之山 → 復用北三（借名）；實位圖外東北</text>
<text x="1362" y="523" font-size="9.5" fill="#c0392b">高柳 → 在代北（借名警示）</text>
<text x="1362" y="540" font-size="9.5" fill="#c0392b">大澤 → 方百里群鳥所生；在鴈門北</text>
<text x="1362" y="558" font-size="9.5" fill="#c0392b">疏屬之山 → 在開題西北；貳負危刑罰山</text>
