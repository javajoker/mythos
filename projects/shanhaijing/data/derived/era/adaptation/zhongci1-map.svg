<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：甘棗之山——鏈在大河東側並行（共水西注河/渠豬之水南注河/勞水西注潏水）。</text>
<text x="1090" y="276" font-size="10" fill="#666">自記6,670 vs 腿程937＝全書最大里程層累（7.1×）——分部自記注水（F-0008）；範圍以拓撲為主。</text>
<text x="1090" y="295" font-size="10" fill="#666">霍山/陰山/歷兒等名稱＝借名標記；天嬰（龍骨狀物）與朏朏（馴養解憂）風物待考。</text>
<text x="1090" y="314" font-size="10" fill="#666">窗口經度跨度放寬至6°（109.5–115.5E）——避免內置400km比例尺注記溢出圖例面板（renderer既有行為，未改</text>
<text x="1090" y="328" font-size="10" fill="#666">代碼）。</text>
<text x="1090" y="362.5" font-size="14" font-weight="bold" fill="#333">15 站 → 現實候選（審核中）</text>
<text x="1090" y="384" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 甘棗之山</tspan>　→ 運城—中條山西段（起點錨）</text>
<text x="1090" y="406" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 歷兒之山</tspan>　→ 中條山方向·冢也太牢</text>
<text x="1090" y="427" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 渠豬之山</tspan>　→ 中條山方向·南注河</text>
<text x="1090" y="448" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 蔥聾之山</tspan>　→ 中條山方向·三色堊土</text>
<text x="1090" y="469" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 涹山</tspan>　→ 中條山方向·赤銅鐵</text>
<text x="1090" y="490" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 脫扈之山</tspan>　→ 中條山方向·植楮</text>
<text x="1090" y="512" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 金星之山</tspan>　→ 中條山方向·天嬰龍骨狀</text>
<text x="1090" y="533" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 泰威之山</tspan>　→ 中條山方向·梟谷鐵</text>
<text x="1090" y="554" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 橿谷之山</tspan>　→ 中條山方向·赤銅</text>
<text x="1090" y="575" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 吳林之山</tspan>　→ 中條山東段·葌草</text>
<text x="1090" y="597" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 牛首之山</tspan>　→ 北折點·勞水西注潏水</text>
<text x="1090" y="618" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 霍山</tspan>　→ 霍州方向·朏朏馴養（借名）</text>
<text x="1090" y="639" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 合谷之山</tspan>　→ 臨汾方向·薝棘</text>
<text x="1090" y="660" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 陰山</tspan>　→ 臨汾—長治方向·少水（借名）</text>
<text x="1090" y="681" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 鼓鐙之山</tspan>　→ 長治—太行南段（東北400里跳段）</text>
<text x="60" y="590" font-size="11" fill="#666">推理說明：自甘棗之山（運城—中條山西段，共水西注河＝拓撲錨）沿中條山方向東行 10 站（380里；三色堊土、赤銅×2、鐵谷、天嬰龍骨狀物）→牛首之山北折（勞水西注潏水＝運城盆地水系候選）→北行</text>
<text x="60" y="606" font-size="11" fill="#666"> 3 站（霍州—臨汾方向；朏朏馴養解憂）→東北 400 里跳段至鼓鐙之山（長治—太行南段方向，赤銅第三記）。</text>
<text x="60" y="628" font-size="11" fill="#666">腿程 937 里≈361 km（0.385）；自記 6,670 里＝層累 7.1×（全書最大，F-0008 分部自記注水 variant）——網格按原始腿程展開，範圍判定以水係拓撲為主。所有對應為競爭假說，時代窗口 4000–10</text>
<text x="60" y="644" font-size="11" fill="#666">00 BCE。</text>
