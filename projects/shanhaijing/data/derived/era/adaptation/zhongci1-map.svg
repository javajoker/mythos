<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：甘棗之山——鏈在大河東側並行（共水西注河/渠豬之水南注河/勞水西注潏水）。</text>
<text x="1090" y="276" font-size="10" fill="#666">自記6,670 vs 腿程937＝全書最大里程層累（7.1×）——分部自記注水（F-0008）；範圍以拓撲為主。</text>
<text x="1090" y="295" font-size="10" fill="#666">霍山/陰山/歷兒等名稱＝借名標記；天嬰（龍骨狀物）與朏朏（馴養解憂）風物待考。</text>
<text x="1090" y="314" font-size="10" fill="#666">窗口經度跨度 6°（109.5–115.5°E）；比例尺已改為自適應（50 km 段），不再溢出。</text>
<text x="1090" y="348.0" font-size="14" font-weight="bold" fill="#333">15 站 → 現實候選（審核中）</text>
<text x="1090" y="370" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 甘棗之山</tspan>　→ 運城—中條山西段（起點錨）｜⛰中條山·西段</text>
<text x="1090" y="391" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 歷兒之山</tspan>　→ 中條山方向·冢也太牢｜⛰中條山·五老峰</text>
<text x="1090" y="412" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 渠豬之山</tspan>　→ 中條山方向·南注河｜⛰中條山·南麓芮城段</text>
<text x="1090" y="434" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 蔥聾之山</tspan>　→ 中條山方向·三色堊土｜⛰中條山·聞喜—夏縣段</text>
<text x="1090" y="455" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 涹山</tspan>　→ 中條山方向·赤銅鐵｜⛰中條山·垣曲銅礦峪山嶺</text>
<text x="1090" y="476" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 脫扈之山</tspan>　→ 中條山方向·植楮｜⛰中條山·聞喜東段</text>
<text x="1090" y="497" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 金星之山</tspan>　→ 中條山方向·天嬰龍骨狀｜⛰中條山·翼城—沁水段</text>
<text x="1090" y="518" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 泰威之山</tspan>　→ 中條山方向·梟谷鐵｜⛰中條山東段·翼城山嶺</text>
<text x="1090" y="540" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 橿谷之山</tspan>　→ 中條山方向·赤銅｜⛰中條山·垣曲東段</text>
<text x="1090" y="561" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 吳林之山</tspan>　→ 中條山東段·葌草｜⛰中條山東段·沁水—陽城山嶺</text>
<text x="1090" y="582" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 牛首之山</tspan>　→ 北折點·勞水西注潏水｜⛰太岳山·南段</text>
<text x="1090" y="603" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 霍山</tspan>　→ 霍州方向·朏朏馴養（借名）｜⛰太岳山·霍山</text>
<text x="1090" y="624" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 合谷之山</tspan>　→ 臨汾方向·薝棘｜⛰太岳山·北段靈石山嶺</text>
<text x="1090" y="646" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 陰山</tspan>　→ 臨汾—長治方向·少水（借名）｜⛰太岳山北段—沁源山嶺</text>
<text x="1090" y="667" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 鼓鐙之山</tspan>　→ 長治—太行南段（東北400里跳段）｜⛰太行山·南段</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自甘棗之山（運城—中條山西段，共水西注河＝拓撲錨）沿中條山方向東行 10 站（380里；三色堊土、赤銅×2、鐵谷、天嬰龍骨狀物）→牛首之山北折（勞水西注潏水＝運城盆地水</text>
<text x="60" y="702" font-size="11" fill="#666">系候選）→北行 3 站（霍州—臨汾方向；朏朏馴養解憂）→東北 400 里跳段至鼓鐙之山（長治—太行南段方向，赤銅第三記）。</text>
<text x="60" y="724" font-size="11" fill="#666">腿程 937 里≈361 km（0.385）；自記 6,670 里＝層累 7.1×（全書最大，F-0008 分部自記注水 variant）——網格按原始腿程展開，範圍判定以水係拓撲為主。所有對應為競爭假說，時</text>
<text x="60" y="740" font-size="11" fill="#666">代窗口 4000–1000 BCE。</text>
