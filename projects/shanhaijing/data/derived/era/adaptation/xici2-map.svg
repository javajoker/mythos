<text x="1124" y="254" font-size="11" fill="#444">現代地點參照點</text>
<text x="1090" y="280" font-size="10" fill="#666">決定性證據＝南亞亞熱帶生物群：鸚鵡（3站）、孔雀候選（5站）、犀牛三見（5/12/13站）、原雞（7站）、葉</text>
<text x="1090" y="294" font-size="10" fill="#666">猴（9站）、沼鹿（16站）、竹棕檀楠樟。犀牛西界止於印度河——物種鎖定最西位置。</text>
<text x="1090" y="313" font-size="10" fill="#666">借名警示：河/渭/涇/苕/楚與中國水名同名，後世借名方向。赤水＝印度河候選（同名異水待裁）。伊朗—兩河空</text>
<text x="1090" y="328" font-size="10" fill="#666">檔（72.5°E→38.4°E）由卷六至十八框架地理承擔（F-0007）。</text>
<text x="1090" y="358.0" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="380" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 鈐山</tspan>　→ 錫金—不丹東緣（東端）</text>
<text x="1090" y="401" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 㤗冒之山</tspan>　→ 不丹東·白蛇</text>
<text x="1090" y="422" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 數歷之山</tspan>　→ 不丹東—錫金·鸚鵡·白珠</text>
<text x="1090" y="444" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 高山</tspan>　→ 錫金·棕竹·磬石</text>
<text x="1090" y="465" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 女牀之山</tspan>　→ 尼泊爾東·孔雀候選＋犀牛</text>
<text x="1090" y="486" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 龍首之山</tspan>　→ 尼泊爾東·苕水</text>
<text x="1090" y="507" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 鹿臺之山</tspan>　→ 尼泊爾中東·原雞人面化</text>
<text x="1090" y="528" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 鳥危之山</tspan>　→ 尼泊爾中·西注赤水（轉向一）</text>
<text x="1090" y="550" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 小次之山</tspan>　→ 尼中西·葉猴</text>
<text x="1090" y="571" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 大次之山</tspan>　→ 尼泊爾西·羚羊</text>
<text x="1090" y="592" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 薰吳之山</tspan>　→ 尼西緣·金玉</text>
<text x="1090" y="613" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 厎陽之山</tspan>　→ 庫馬盎·楠樟＋犀牛</text>
<text x="1090" y="634" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 眾獸之山</tspan>　→ 庫馬盎西·犀牛三見</text>
<text x="1090" y="656" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 皇人之山</tspan>　→ 喜馬偕爾·皇水西注赤水（轉向二）</text>
<text x="1090" y="677" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 中皇之山</tspan>　→ 喜馬偕爾西·蕙棠</text>
<text x="1090" y="698" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 西皇之山</tspan>　→ 旁遮普東緣·沼鹿</text>
<text x="1090" y="719" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 萊山</tspan>　→ 印度河中游—哈拉帕心臟帶（終點）</text>
<text x="60" y="600" font-size="11" fill="#666">推理說明：自鈐山（錫金—不丹東緣）沿喜馬拉雅南麓/特萊帶西行——尼泊爾（孔雀候選·犀牛·葉猴·楠樟）、庫馬盎—喜馬偕爾（皇水西注赤水＝印度河），至萊山（印度河中游—哈拉帕心臟帶；犀牛西界止</text>
<text x="60" y="616" font-size="11" fill="#666">於印度河，物種鎖定最西位置）。</text>
<text x="60" y="638" font-size="11" fill="#666">腿程合計 4,570 里≈1,759 km（0.385；原文自記 4,140 里，+10.4% 差異待校）。所有對應為競爭假說，時代窗口 4000–1000 BCE；犀牛/沼鹿/葉猴分布後期收縮，退出不作否決。</text>
