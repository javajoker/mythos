<text x="1124" y="254" font-size="11" fill="#444">現代地點參照點</text>
<text x="1090" y="280" font-size="10" fill="#666">決定性證據＝南亞亞熱帶生物群：鸚鵡（3站）、鸞鳥＝孔雀候選（5站）、犀牛三見（5/12/13站）、原雞（7站</text>
<text x="1090" y="294" font-size="10" fill="#666">）、葉猴（9站）、沼鹿（16站）、竹棕檀楠樟。鸚鵡不越喜馬拉雅北側——鏈條必在山南麓。</text>
<text x="1090" y="313" font-size="10" fill="#666">借名警示：河/渭/涇/苕/楚與中國水名同名，一律為後世借名方向，不得反證。赤水＝印度河候選（與西三經赤</text>
<text x="1090" y="328" font-size="10" fill="#666">水＝紅海同名異水，待裁）。</text>
<text x="1090" y="358.0" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="380" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 鈐山</tspan>　→ 喜馬拉雅東段南麓（起點錨）</text>
<text x="1090" y="401" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 㤗冒之山</tspan>　→ 東段南麓·白蛇</text>
<text x="1090" y="422" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 數歷之山</tspan>　→ 不丹東·鸚鵡·白珠</text>
<text x="1090" y="444" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 高山</tspan>　→ 不丹東·棕竹·磬石</text>
<text x="1090" y="465" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 女牀之山</tspan>　→ 不丹—阿薩姆·孔雀候選＋犀牛</text>
<text x="1090" y="486" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 龍首之山</tspan>　→ 不丹中·苕水</text>
<text x="1090" y="507" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 鹿臺之山</tspan>　→ 不丹西·原雞人面化</text>
<text x="1090" y="528" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 鳥危之山</tspan>　→ 錫金—尼東·西注赤水（轉向一）</text>
<text x="1090" y="550" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 小次之山</tspan>　→ 尼泊爾東·葉猴</text>
<text x="1090" y="571" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 大次之山</tspan>　→ 尼泊爾東中·羚羊</text>
<text x="1090" y="592" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 薰吳之山</tspan>　→ 尼泊爾中·金玉</text>
<text x="1090" y="613" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 厎陽之山</tspan>　→ 尼中西·楠樟＋犀牛</text>
<text x="1090" y="634" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 眾獸之山</tspan>　→ 尼泊爾西·犀牛三見</text>
<text x="1090" y="656" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 皇人之山</tspan>　→ 庫馬盎·皇水西注赤水（轉向二）</text>
<text x="1090" y="677" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 中皇之山</tspan>　→ 喜馬偕爾·蕙棠</text>
<text x="1090" y="698" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 西皇之山</tspan>　→ 喜馬偕爾—旁遮普·沼鹿</text>
<text x="1090" y="719" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 萊山</tspan>　→ 印度河上游分水嶺（終點）·羅羅</text>
<text x="60" y="600" font-size="11" fill="#666">推理說明：自鈐山（阿魯納恰爾東緣）沿喜馬拉雅南麓/特萊帶西行——不丹（鸚鵡·孔雀候選·犀牛）、錫金—尼泊爾（水系轉向、葉猴、楠樟）、庫馬盎—喜馬偕爾（皇水西注赤水），至萊山（印度河上游分水</text>
<text x="60" y="616" font-size="11" fill="#666">嶺方向）。</text>
<text x="60" y="638" font-size="11" fill="#666">腿程合計 4,570 里≈1,759 km（0.385；原文自記 4,140 里，+10.4% 差異待校）。所有對應為競爭假說，時代窗口 4000–1000 BCE；犀牛/沼鹿/葉猴分布後期收縮，退出不作否決。</text>
