<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：岷山（江水東流方向＝大江源區）＋全鏈溪流南注江——不依岷山/崍山/岐山同名（借名標記）。</text>
<text x="1090" y="276" font-size="10" fill="#666">與西山首經v2東端（成都平原西緣102.9°E）傳播鄰接——錨點鏈東延。</text>
<text x="1090" y="295" font-size="10" fill="#666">三星堆評估：鏈南緣同域文明（窗口內 1600-1100 BCE）——報告專節。</text>
<text x="1090" y="314" font-size="10" fill="#666">注意：原始腿程展開的鏈條東端超出宜昌方向（里程層累 variant）——窗口已放寬以容納原始展開；擬合範圍</text>
<text x="1090" y="328" font-size="10" fill="#666">以拓撲為準（宜昌方向終點）。</text>
<text x="1090" y="362.5" font-size="14" font-weight="bold" fill="#333">16 站 → 現實候選（審核中）</text>
<text x="1090" y="384" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 女几之山</tspan>　→ 岷山北麓（起點）</text>
<text x="1090" y="406" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 岷山</tspan>　→ 岷江上游方向（大江源區）</text>
<text x="1090" y="427" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 崍山</tspan>　→ 邛崍山方向</text>
<text x="1090" y="448" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 崌山</tspan>　→ 成都平原西北緣</text>
<text x="1090" y="469" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 高梁之山</tspan>　→ 成都平原北緣</text>
<text x="1090" y="490" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 蛇山</tspan>　→ 龍泉山方向</text>
<text x="1090" y="512" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 鬲山</tspan>　→ 沱江方向（蒲𪈘之水注江）</text>
<text x="1090" y="533" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 隅陽之山</tspan>　→ 嘉陵江—涪江方向</text>
<text x="1090" y="554" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 岐山</tspan>　→ 川中方向（借名）</text>
<text x="1090" y="575" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 勾檷之山</tspan>　→ 川中—川東方向（冢）</text>
<text x="1090" y="597" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 風雨之山</tspan>　→ 川東—重慶方向（麈豹虎白鷮）</text>
<text x="1090" y="618" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 玉山</tspan>　→ 重慶方向</text>
<text x="1090" y="639" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 熊山</tspan>　→ 重慶—三峽方向（帝也·璆冕舞）</text>
<text x="1090" y="660" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 騩山</tspan>　→ 三峽方向（冢；借名）</text>
<text x="1090" y="681" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 葛山</tspan>　→ 三峽方向</text>
<text x="1090" y="703" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 賈超之山</tspan>　→ 宜昌方向（終點）</text>
<text x="60" y="596" font-size="11" fill="#666">推理說明：自女几之山（岷山北麓）起，岷山（大江源區）→崍山→成都平原北緣（三星堆走廊南緣）→川中—重慶（風雨之山·宣余之水多蛇）→三峽（熊山帝也·璆冕舞）→賈超之山（宜昌方</text>
<text x="60" y="612" font-size="11" fill="#666">向）終點。</text>
<text x="60" y="634" font-size="11" fill="#666">腿程 3,650 里≈1,405 km（0.385；自記 3,500 里，+4% variant）。所有對應為競爭假說，時代窗口 4000–1000 BCE。</text>
