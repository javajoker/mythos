<text x="1090" y="236" font-size="10" fill="#666">假說A（本位）：南山經以南調查——中南半島—南洋群島族群弧；赤水復用南二＝紅河方向。</text>
<text x="1090" y="254" font-size="10" fill="#666">假說B（F-0007）：畢方·青水·壽華復用西三吉薩體系；昆侖虛經 ADJ-002 裁決＝撒哈拉之眼（理查特構造），</text>
<text x="1090" y="269" font-size="10" fill="#666">已移出吉薩簇。</text>
<text x="1090" y="288" font-size="10" fill="#666">帝堯/帝嚳/文王葬地＝借名警示；羿殺鑿齒·二八神·祝融＝神話層。</text>
<text x="1090" y="306" font-size="10" fill="#666">全部映射 proposed_pending_review。</text>
<text x="1090" y="340.5" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="362" font-size="11" fill="#0e7c66">畢方鳥 → 復用西三·章莪之山（錫爾特東緣）</text>
<text x="1090" y="384" font-size="11" fill="#0e7c66">昆侖虛 → ADJ-002＝理查特構造（撒哈拉之眼）主候選；吉薩合併否決</text>
<text x="1090" y="405" font-size="11" fill="#8e44ad">青水 → 昆侖虛西南隅水（ADJ-002 隨理查特西移）</text>
<text x="1090" y="426" font-size="11" fill="#8e44ad">壽華之野 → 昆侖虛（理查特）以東原野方向（羿殺鑿齒＝神話層）</text>
<text x="1090" y="447" font-size="11" fill="#0e7c66">赤水·三株樹 → 復用南二赤水＝紅河方向（共名F-0011）</text>
<text x="1090" y="468" font-size="11" fill="#8e44ad">結匈國 → 西南陬起點族群（方向性）</text>
<text x="1090" y="490" font-size="11" fill="#8e44ad">南山 → 待定錨·結匈東南（與西一南山共名）</text>
<text x="1090" y="511" font-size="11" fill="#8e44ad">比翼鳥 → 新增風物鳥（南山東）</text>
<text x="1090" y="532" font-size="11" fill="#8e44ad">羽民國 → 羽飾族群（南島方向同域候選）</text>
<text x="1090" y="553" font-size="11" fill="#8e44ad">二八神 → 司夜神格群（神話層）</text>
<text x="1090" y="574" font-size="11" fill="#8e44ad">讙頭國 → 漁撈族群（讙朱＝借名警示）</text>
<text x="1090" y="596" font-size="11" fill="#8e44ad">厭火國 → 火風物族群（火山帶方向候選）</text>
<text x="1090" y="617" font-size="11" fill="#8e44ad">三苗國 → 赤水東族群（三苗史名借名警示）</text>
<text x="1090" y="638" font-size="11" fill="#8e44ad">臷國 → 善射族群</text>
<text x="1090" y="659" font-size="11" fill="#8e44ad">貫匈國 → 胸飾穿孔習俗族群</text>
<text x="1090" y="681" font-size="11" fill="#8e44ad">交脛國 → 腿部風俗族群</text>
<text x="1090" y="702" font-size="11" fill="#8e44ad">不死民 → 長壽傳聞族群（黑膚）</text>
<text x="1090" y="723" font-size="11" fill="#8e44ad">反舌國 → 語俗族群（反/岐/支舌異文）</text>
<text x="1090" y="744" font-size="11" fill="#8e44ad">三首國 → 多首賦形族群</text>
<text x="1090" y="765" font-size="11" fill="#8e44ad">周饒國 → 短身冠帶族群（焦僥借名警示）</text>
<text x="1090" y="787" font-size="11" fill="#8e44ad">長臂國 → 島嶼漁民（東南陬端點）</text>
