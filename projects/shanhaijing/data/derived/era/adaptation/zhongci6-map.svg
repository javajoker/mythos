<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：平逢之山（南望伊洛＋東望穀城）＋穀水/洛河雙受水——不依穀城/澗水同名（借名標記）。</text>
<text x="1090" y="276" font-size="10" fill="#666">人魚＝大鯢（傅山/陽華两見）；旋龜＝鳥首鼈尾龜類神話；鳴石＝聲學礦物。</text>
<text x="1090" y="295" font-size="10" fill="#666">「嶽在其中，以六月祭之，如諸嶽之祠法」——岳祭記錄。</text>
<text x="1090" y="329.5" font-size="14" font-weight="bold" fill="#333">14 站 → 現實候選（審核中）</text>
<text x="1090" y="352" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 平逢之山</tspan>　→ 洛陽盆地西緣·蜂蜜之廬（起點錨）</text>
<text x="1090" y="373" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 縞羝之山</tspan>　→ 洛陽西·金玉（系名山）</text>
<text x="1090" y="394" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 廆山</tspan>　→ 洛陽西·雙源分水（南洛北穀）</text>
<text x="1090" y="415" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 瞻諸之山</tspan>　→ 洛陽西·雙源分水</text>
<text x="1090" y="436" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 婁涿之山</tspan>　→ 宜陽方向·雙源（茈石文石）</text>
<text x="1090" y="457" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 白石之山</tspan>　→ 宜陽方向·雙源（水玉/櫨丹）</text>
<text x="1090" y="479" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 榖山</tspan>　→ 新安方向·榖桑（蠶桑）</text>
<text x="1090" y="500" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 密山</tspan>　→ 宜陽—洛寧·旋龜</text>
<text x="1090" y="521" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 長石之山</tspan>　→ 洛寧方向·鳴石（聲學礦物）</text>
<text x="1090" y="542" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 傅山</tspan>　→ 盧氏方向·穀水源頭＋人魚</text>
<text x="1090" y="564" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 橐山</tspan>　→ 靈寶東·北注河（轉換點）</text>
<text x="1090" y="585" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 常烝之山</tspan>　→ 靈寶方向·雙源北注河</text>
<text x="1090" y="606" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 夸父之山</tspan>　→ 靈寶—潼關·桃林多馬（借名）</text>
<text x="1090" y="627" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 陽華之山</tspan>　→ 豫陝界—潼關·雙源終點（人魚/銅）</text>
<text x="60" y="590" font-size="11" fill="#666">推理說明：自平逢之山（洛陽盆地西緣；南望伊洛＋東望穀城——拓撲錨，不依穀城同名）沿穀水/洛河分水嶺西行——廆/瞻諸/婁涿/白石四站雙源（南洛北穀）→傅山穀水源頭（東流注洛）→橐山以西受水體轉</text>
<text x="60" y="606" font-size="11" fill="#666">黃河→陽華之山雙源終點（豫陝界—潼關方向）。</text>
<text x="60" y="628" font-size="11" fill="#666">腿程 802 里≈309 km（0.385）vs 自記 790 里（層累 variant）；實距參照約 210 km——層累倍數≈1.47×。人魚＝大鯢兩見；鳴石＝聲學礦物；「嶽在其中」六月岳祭。所有對應為競爭假說，時代窗口</text>
<text x="60" y="644" font-size="11" fill="#666"> 4000–1000 BCE。</text>
