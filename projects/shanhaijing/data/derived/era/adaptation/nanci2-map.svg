<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：柜山「英水西南流注于赤水」＝滇東西南向大河（不依名稱；紅河/紅水河對立待裁——RT-N8）。</text>
<text x="1090" y="276" font-size="10" fill="#666">里程：自記 7,200＝腿程 7,210（+0.1%）；0.385 檔≈2,776 km vs 滇東—閩東實距約 2,000 km——層累</text>
<text x="1090" y="291" font-size="10" fill="#666">約 1.4×（F-0008 帶內）。</text>
<text x="1090" y="310" font-size="10" fill="#666">南島同域：東段閩台—東海島鏈＝大坌坑文化（5000–4000 BP，窗口內）——漆吳「日次」島鏈端點與南島擴</text>
<text x="1090" y="324" font-size="10" fill="#666">散起點方向相容——候選級。</text>
<text x="1090" y="342" font-size="10" fill="#666">神群皆龍身鳥首（與南一鳥身龍首鏡像對仗）；祠：璧瘞＋稌米。</text>
<text x="1090" y="377.0" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="399" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 柜山</tspan>　→ 滇東（起點錨；赤水＝西南向大河，紅河/紅水河待裁——RT-N8）｜⛰雲貴高原·滇東</text>
<text x="1090" y="420" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 長右之山</tspan>　→ 滇東南（長右四耳·大水兆）｜⛰雲貴高原·滇東南</text>
<text x="1090" y="441" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 堯光之山</tspan>　→ 桂西北（猾褢穴居冬蟄）｜⛰雲貴高原東緣—桂西北</text>
<text x="1090" y="463" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 羽山</tspan>　→ 桂西—桂中（多雨蝮虫；借名）｜⛰桂西—桂中山地</text>
<text x="1090" y="484" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 瞿父之山</tspan>　→ 桂中（金玉）｜⛰桂中山地</text>
<text x="1090" y="505" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 句餘之山</tspan>　→ 桂中—桂東（金玉）｜⛰桂中—桂東山嶺</text>
<text x="1090" y="526" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 浮玉之山</tspan>　→ 桂東北—湘南（北望具區；彘＝虎）｜⛰南嶺西段</text>
<text x="1090" y="547" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 成山</tspan>　→ 粵北—湘南（四方而三壇！）｜⛰南嶺中段（騎田嶺方向）</text>
<text x="1090" y="569" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 會稽之山</tspan>　→ 粵北—贛南（四方；借名）｜⛰南嶺·中段</text>
<text x="1090" y="590" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 夷山</tspan>　→ 贛南—閩西（湨水南注列塗）｜⛰南嶺東段—贛南</text>
<text x="1090" y="611" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 僕勾之山</tspan>　→ 閩西（無鳥獸無水）｜⛰閩西山嶺（武夷西麓）</text>
<text x="1090" y="632" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 咸陰之山</tspan>　→ 閩西—閩中（無草木無水）｜⛰武夷山·西麓</text>
<text x="1090" y="653" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 洵山</tspan>　→ 閩中（䍺無口獸；芘蠃）｜⛰武夷山·中段</text>
<text x="1090" y="675" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 虖勺之山</tspan>　→ 閩中—閩東（滂水東注海✓）｜⛰武夷山·東段</text>
<text x="1090" y="696" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 區吳之山</tspan>　→ 閩東沿海（鹿水注滂水；借名）｜⛰閩東沿海丘陵</text>
<text x="1090" y="717" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 鹿吳之山</tspan>　→ 浙南—閩東（蠱雕食人）｜⛰浙南—閩東沿海丘陵</text>
<text x="1090" y="738" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 漆吳之山</tspan>　→ 東海島鏈（日次·終點）｜⛰東海島鏈（舟山—琉球方向）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自柜山（滇東，英水西南注赤水＝西南向大河待裁——RT-N8；鴸放士記錄）東南下高原（長右·大水兆）——桂西北（堯光·猾褢穴居冬蟄）→桂西—桂中（羽山·多雨蝮虫）→桂東北</text>
<text x="60" y="702" font-size="11" fill="#666">—湘南（浮玉·北望具區·彘＝虎食人）→南嶺中段（成山·四方三壇；會稽·四方借名）→贛南—閩西（夷山·僕勾·咸陰）→武夷（洵山·䍺無口獸）→閩江方向（虖勺·滂水東注海）→閩東—浙南</text>
<text x="60" y="718" font-size="11" fill="#666">沿海（區吳·鹿吳·蠱雕食人）→漆吳之山（東海島鏈終點：處于東海·是惟日次）。</text>
<text x="60" y="740" font-size="11" fill="#666">腿程 7,210 里≈2,776 km（0.385）≈自記 7,200（+0.1%）；網格東端越出陸域記 variant。所有對應為競爭假說，時代窗口 4000–1000 BCE；後世同名（會稽/具區等）不作反證；赤水</text>
<text x="60" y="756" font-size="11" fill="#666">/英水共名標記（F-0011 規則）。</text>
