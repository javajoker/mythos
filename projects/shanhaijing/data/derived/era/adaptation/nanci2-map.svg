<text x="1090" y="258" font-size="10" fill="#666">起點錨：柜山＝羅霄山脈中段——「英水西南流注于赤水」，赤水＝西南向紅色水體（ADJ-005 性狀類名），湘</text>
<text x="1090" y="272" font-size="10" fill="#666">南丹霞紅層水系方向；紅河舊讀已撤（RT-N8）。</text>
<text x="1090" y="291" font-size="10" fill="#666">硬錨簇（名物密度證據，非借名豁免）：浮玉「北望具區」＝天目山北望太湖；苕水＝苕溪北注太湖；會稽＝紹興</text>
<text x="1090" y="306" font-size="10" fill="#666">會稽山——具區＝太湖有《爾雅》《周禮》先秦成文證據（F-0015 已裁決）。</text>
<text x="1090" y="324" font-size="10" fill="#666">水系硬錨：滂水東流注海＝甌江（源出洞宮山）；鹿水南注＝楠溪江——三溪匯滂拓撲逐項吻合。</text>
<text x="1090" y="342" font-size="10" fill="#666">里程：腿程 7,210 里＝自記 7,200（+0.1%）；層累 1.5–2× 下有效實距約 1,400–1,850 km，終點落琉球</text>
<text x="1090" y="357" font-size="10" fill="#666">方向（舟山對立待裁）；原始網格＝否定工具（G-3）。</text>
<text x="1090" y="391.5" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="414" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 柜山</tspan>　→ 羅霄山中段（起點錨；赤水＝西南向紅色水體）｜⛰羅霄山脈</text>
<text x="1090" y="435" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 長右之山</tspan>　→ 贛南山地（長右四耳→南方獼猴；大水兆）｜⛰雩山方向</text>
<text x="1090" y="456" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 堯光之山</tspan>　→ 贛東—武夷西麓（猾褢穴居冬蟄→熊）｜⛰武夷山脈西麓</text>
<text x="1090" y="477" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 羽山</tspan>　→ 武夷山中段（多雨蝮虫；借名）｜⛰武夷山脈中段</text>
<text x="1090" y="498" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 瞿父之山</tspan>　→ 贛東北（金玉→德興金屬帶弱證）｜⛰懷玉山方向</text>
<text x="1090" y="520" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 句餘之山</tspan>　→ 皖浙贛邊界（金玉）｜⛰白際山—昱嶺方向</text>
<text x="1090" y="541" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 浮玉之山</tspan>　→ 天目山★（北望具區＝太湖；苕水＝苕溪；彘＝華南虎）｜⛰天目山</text>
<text x="1090" y="562" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 成山</tspan>　→ 杭州灣北岸—良渚方向（四方三壇＝方形台地待裁）｜⛰良渚方向</text>
<text x="1090" y="583" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 會稽之山</tspan>　→ 紹興★（會稽＝先秦專名；勺水南注）｜⛰紹興會稽山</text>
<text x="1090" y="604" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 夷山</tspan>　→ 四明山方向（湨水南注列塗＝象山港方向）｜⛰四明山</text>
<text x="1090" y="626" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 僕勾之山</tspan>　→ 天台山方向（無鳥獸無水）｜⛰天台山</text>
<text x="1090" y="647" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 咸陰之山</tspan>　→ 括蒼山方向（無草木無水）｜⛰括蒼山</text>
<text x="1090" y="668" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 洵山</tspan>　→ 洞宮山北段（䍺無口獸；洵水注閼之澤）｜⛰洞宮山北段</text>
<text x="1090" y="689" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 虖勺之山</tspan>　→ 甌江源區★（滂水東注海＝甌江）｜⛰洞宮山—百山祖</text>
<text x="1090" y="710" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 區吳之山</tspan>　→ 甌江北岸（鹿水＝楠溪江南注甌江 ✓）｜⛰括蒼山南段</text>
<text x="1090" y="732" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 鹿吳之山</tspan>　→ 雁蕩山方向（澤更之水注滂水；蠱雕→大型猛禽）｜⛰雁蕩山</text>
<text x="1090" y="753" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 漆吳之山</tspan>　→ 東海島鏈終點（日次；舟山—琉球待裁）｜⛰琉球方向</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自柜山（羅霄山脈中段；英水西南注赤水＝西南向紅色水體·ADJ-005；鴸放士記錄）東南入贛南（長右·大水兆）→贛東—武夷（堯光·猾褢穴居冬蟄→熊；羽山·多雨蝮虫）→贛東北</text>
<text x="60" y="702" font-size="11" fill="#666">—皖浙贛邊界（瞿父·句餘·金玉）→浮玉之山＝天目山（北望具區＝太湖；苕水＝苕溪北注；彘＝華南虎）→成山（四方三壇——良渚方向台地待裁）→會稽之山＝紹興（先秦專名）→四明—天</text>
<text x="60" y="718" font-size="11" fill="#666">台—括蒼（夷山·僕勾·咸陰）→洞宮山（洵山·䍺無口獸）→虖勺（滂水＝甌江東注海）→甌江北岸—雁蕩（區吳·鹿水＝楠溪江；鹿吳·蠱雕）→漆吳之山（東海島鏈終點：處于東海·是惟日次；</text>
<text x="60" y="734" font-size="11" fill="#666">舟山—琉球待裁）。</text>
