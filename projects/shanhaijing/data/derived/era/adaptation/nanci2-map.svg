<text x="1090" y="258" font-size="10" fill="#666">嚴格走向重校準（adapt-nanci2-3）：東南450→東×15；腿1–13 零違背；腿14–17（虖勺/區吳/鹿吳/漆吳</text>
<text x="1090" y="272" font-size="10" fill="#666">）＝舟山以東島嶼 NE 向排列，經文正東與島鏈走向偏差 37°–63°——校勘存疑登記（不移站不附會）。</text>
<text x="1090" y="291" font-size="10" fill="#666">走廊：幕阜山—九宮山（柜山·英水西南注赤水＝紅層水系）→九嶺山餘脈（長右·大水兆）→贛東崗地（堯光·猾</text>
<text x="1090" y="306" font-size="10" fill="#666">褢＝熊冬眠）→信江河谷北山（羽山·多雨蝮蛇）→懷玉山西麓（瞿父·德興銅礦帶硬合）→皖南山地（句餘）→</text>
<text x="1090" y="320" font-size="10" fill="#666">天目山（浮玉·北望太湖 ✓）→良渚（成山·四方三壇人工台地）→紹興方向（會稽）→寧波—甬江口（夷山·湨</text>
<text x="1090" y="334" font-size="10" fill="#666">水注列塗海灣）→舟山本島（僕勾·無鳥獸無水）→普陀—朱家尖（咸陰·無草木無水）→蝦峙—桃花（洵山·芘蠃</text>
<text x="1090" y="349" font-size="10" fill="#666">＝螺蚌）→中街山—浪崗—海礁（虖勺/區吳/鹿吳·基岩島礁）→海礁—嵊山最東端（漆吳·處于東海·日出觀測點</text>
<text x="1090" y="364" font-size="10" fill="#666">）。</text>
<text x="1090" y="382" font-size="10" fill="#666">里程：自記 7,200＝腿程 7,210（+0.1% 自洽）；實測比 ≈0.2–0.3（壓縮登記；島鏈段里數膨脹 5–10× </text>
<text x="1090" y="396" font-size="10" fill="#666">另記）。修訂：滂水＝甌江硬錨降 rival（走向不可達）；漆吳舟山—琉球待裁收束為舟山最東端主讀（琉球對</text>
<text x="1090" y="411" font-size="10" fill="#666">立存冊）。</text>
<text x="1090" y="445.5" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="468" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 柜山</tspan>　→ 英水西南流注赤水｜⛰九宮山—幕阜山北段（湘鄂贛界）</text>
<text x="1090" y="489" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 長右之山</tspan>　→ 無草木多水｜⛰修水—武寧—靖安 九嶺山—幕阜山餘脈</text>
<text x="1090" y="510" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 堯光之山</tspan>　→ 陽玉陰金｜⛰南昌東—進賢—東鄉崗地（撫河流域）</text>
<text x="1090" y="531" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 羽山</tspan>　→ 下多水上多雨、多蝮虫｜⛰鷹潭北—貴溪—弋陽 信江河谷北山—武夷山北麓</text>
<text x="1090" y="552" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 瞿父之山</tspan>　→ **無草木多金玉＝德興銅礦帶｜⛰德興—樂平 懷玉山西麓</text>
<text x="1090" y="574" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 句餘之山</tspan>　→ 無草木多金玉｜⛰寧國—績溪—歙縣 皖南山地</text>
<text x="1090" y="595" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 浮玉之山</tspan>　→ **F-0015 維持：北望具區＝北望太湖｜⛰天目山（浙西臨安）</text>
<text x="1090" y="616" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 成山</tspan>　→ **四方而三壇＝方形三級台地——良渚莫角山式人工台地候選｜⛰良渚—餘杭（杭州灣北岸）</text>
<text x="1090" y="637" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 會稽之山</tspan>　→ 拓撲支撐維持｜⛰浙東丘陵—紹興方向</text>
<text x="1090" y="658" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 夷山</tspan>　→ 無草木多沙石｜⛰寧波—鎮海 招寶山—甬江口</text>
<text x="1090" y="680" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 僕勾之山</tspan>　→ **上多金玉、下多草木、無鳥獸、無水——島嶼硬合｜⛰舟山本島</text>
<text x="1090" y="701" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 咸陰之山</tspan>　→ **無草木無水——小島硬合**｜⛰普陀山—朱家尖</text>
<text x="1090" y="722" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 洵山</tspan>　→ 陽金陰玉｜⛰蝦峙—桃花島東緣</text>
<text x="1090" y="743" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 虖勺之山</tspan>　→ 梓枏荊杞｜⛰中街山列島</text>
<text x="1090" y="764" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 區吳之山</tspan>　→ **無草木多沙石——基岩島礁硬合**｜⛰浪崗山列島</text>
<text x="1090" y="786" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 鹿吳之山</tspan>　→ 上無草木多金石｜⛰海礁—嵊山方向</text>
<text x="1090" y="807" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 漆吳之山</tspan>　→ **「處于東海」＝舟山群島最東端硬合｜⛰海礁—嵊山最東端（終點）</text>
<text x="60" y="686" font-size="11" fill="#666">嚴格走向重校準（adapt-nanci2-3）：自柜山（幕阜山—九宮山）東南腿→九嶺山餘脈（長右），轉正東緩爬升：贛東崗地→信江河谷→懷玉山（德興銅礦）→皖南山地→天目山（浮玉·北望具</text>
