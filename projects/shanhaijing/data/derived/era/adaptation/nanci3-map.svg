<text x="1090" y="258" font-size="10" fill="#666">起點弱錨：天虞之山＝桂西—滇東南喀斯特（其下多水不可上），維持；可信度 low。</text>
<text x="1090" y="276" font-size="10" fill="#666">走廊：嶺南—中南半島東緣沿海（18–23°N 起，末端延伸至約 10°N）；F-0014 已裁決南北分工，與南二江南</text>
<text x="1090" y="291" font-size="10" fill="#666">走廊分離 >2°；與南一長山內陸山鏈分工（山鏈 vs 沿海）。</text>
<text x="1090" y="310" font-size="10" fill="#666">水系全鏈南—東南注海（北部灣→南海）✓；犀兕象＝非定位性證據；條風＝南海冬季東北季風。</text>
<text x="1090" y="328" font-size="10" fill="#666">里程：自記 6,530 vs 腿程 5,730（−12%）；腿程≈2,206 km vs 走廊實距約 1,800 km≈1.2×（舊嶺北讀</text>
<text x="1090" y="342" font-size="10" fill="#666">法 1.8×）。文本 12 腿「東」與走廊走向系統性不合，記 conflict。</text>
<text x="1090" y="377.0" font-size="14" font-weight="bold" fill="#333">13 站 → 現實候選（審核中）</text>
<text x="1090" y="399" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 天虞之山</tspan>　→ 桂西—滇東南喀斯特峰叢（起點弱錨·多水不可上）</text>
<text x="1090" y="420" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 禱過之山</tspan>　→ 十萬大山（★犀兕象三連·非定位性；泿水南注北部灣）</text>
<text x="1090" y="441" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 丹穴之山</tspan>　→ 下龍—拜子龍灣海岸山（★鳳皇首出；丹水注北部灣）</text>
<text x="1090" y="463" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 發爽之山</tspan>　→ 清化岑山—馬江下游（白猿；汎水注北部灣）</text>
<text x="1090" y="484" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 旄山之尾</tspan>　→ 河靜鴻嶺（育遺谷·凱風＝南風風口）</text>
<text x="1090" y="505" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 非山之首</tspan>　→ 峰牙—己榜喀斯特（地表無水·蝮虫）</text>
<text x="1090" y="526" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 陽夾之山</tspan>　→ 順化白馬山—潟湖帶（無草木多水）</text>
<text x="1090" y="547" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 灌湘之山</tspan>　→ 峴港海雲嶺—五行山（多木無草·怪鳥無獸）</text>
<text x="1090" y="569" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 雞山</tspan>　→ 廣義沿海山地（黑水南注南海·丹雘）</text>
<text x="1090" y="590" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 令丘之山</tspan>　→ 平定歸仁沿海（多火＝unknown；條風＝東北季風）</text>
<text x="1090" y="611" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 侖者之山</tspan>　→ 慶和芽莊—萬寧灣（白䓘·血玉工藝）</text>
<text x="1090" y="632" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 禺槀之山</tspan>　→ 寧順主山—平順沿海（怪獸大蛇）</text>
<text x="1090" y="653" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 南禺之山</tspan>　→ 巴地—頭頓山（湧水穴·佐水東南注海·鳳皇鵷鶵）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自天虞之山（桂西—滇東南喀斯特，多水不可上）南壓入海——禱過之山（十萬大山；犀兕象三連·非定位性＋泿水南注北部灣）→丹穴之山（下龍—拜子龍灣海岸山；鳳皇首出·五德</text>
<text x="60" y="702" font-size="11" fill="#666">文；丹水注渤海＝北部灣，借名）→發爽（清化岑山；白猿＝長臂猿；汎水＝馬江注北部灣）→旄山之尾（河靜鴻嶺；育遺谷凱風＝南風風口；旄山之首佚失）→非山之首（峰牙—己榜喀斯特，</text>
<text x="60" y="718" font-size="11" fill="#666">地表無水）→陽夾（順化白馬山—潟湖帶）→灌湘（峴港海雲嶺—五行山）→雞山（廣義沿海；黑水南注南海）→令丘（平定歸仁；多火＝unknown；中谷條風＝冬季東北季風）→侖者（慶和芽</text>
<text x="60" y="734" font-size="11" fill="#666">莊；白䓘血玉工藝）→禺槀（寧順—平順；大蛇）→南禺之山（巴地—頭頓山；季節湧水穴＋佐水東南注海＋鳳皇鵷鶵群棲——沿海終點）。</text>
<text x="60" y="756" font-size="11" fill="#666">腿程 5,730 里≈2,206 km（0.385）vs 自記 6,530 里（−12% variant）；沿海走廊實距約 1,800 km——層累約 1.2×（舊讀法 1.8×，目標帶 1.0–1.3× 內）；凡十四山 vs 13 站</text>
<text x="60" y="772" font-size="11" fill="#666">（旄山之首佚失，補回則升至約 1.3×）。文本逐腿「東」與走廊走向（東南—南—西南）系統性不合，12 腿全部記 conflict 不硬掰；算術網格＝否定工具（G-3）。所有對應為競爭假說，</text>
<text x="60" y="788" font-size="11" fill="#666">時代窗口 4000–1000 BCE；渤海/丹水借名、黑水共名（F-0011 規則）不作反證。全新世海平面高於今 1–3 m，沿海站位按當時海岸線評估。</text>
</svg>