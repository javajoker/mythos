<text x="1090" y="236" font-size="10" fill="#666">時代窗口 4000–1000 BCE；全部映射 proposed_pending_review。</text>
<text x="1090" y="254" font-size="10" fill="#666">借名警示：匈奴·犬戎·東胡·貊·燕·代·高柳·四帝臺帝名皆為後世名稱層疊加，不作定位依據。2026-10-28 對齊</text>
<text x="1090" y="269" font-size="10" fill="#666"> book11/13：東胡/貊國/燕/漢水/孟鳥/匈奴簇方向性落點一律撤銷，僅存文本相对方位（該簇在 book11 為異</text>
<text x="1090" y="284" font-size="10" fill="#666">文、本卷為正文——正文身份不改變名稱層年代）。</text>
<text x="1090" y="302" font-size="10" fill="#666">昆侖虛＝復用西三昆侖之丘（吉薩 ANC-01），與『海內自有西北聖山』競爭假說並存（與卷11 F-0007 處理一</text>
<text x="1090" y="316" font-size="10" fill="#666">致）。</text>
<text x="1090" y="335" font-size="10" fill="#666">大澤＝貝加爾湖方向候選：群鳥所生所解（繁殖＋換羽）＋方百里＋在鴈門北三重相容；名稱不同於北二『北海』</text>
<text x="1090" y="350" font-size="10" fill="#666">（＝貝加爾湖，medium_high），保留獨立待錨。</text>
<text x="1090" y="368" font-size="10" fill="#666">漢水（貊國條）與山經漢水體系方位不相容，記 conflict（訛文/錯簡雙假說）。</text>
<text x="1090" y="386" font-size="10" fill="#666">清本共 27 條目；傳世本卷首西王母/三青鳥與卷末蓋國/鉅燕/朝鮮/列陽不在本清本之內（版本說明見分析文檔</text>
<text x="1090" y="401" font-size="10" fill="#666">）。</text>
<text x="1090" y="435.5" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="458" font-size="9.5" fill="#6c3483">昆侖虛 → 復用西三昆侖之丘＝吉薩；競爭/合併雙假說</text>
<text x="1090" y="475" font-size="9.5" fill="#b7950b">河·河原 → 復用北一『實惟河原』大河源區</text>
<text x="1090" y="492" font-size="9.5" fill="#b7950b">鴈門山 → 復用北三鴈門之山（借名標記）</text>
<text x="1090" y="510" font-size="9.5" fill="#a0653a">匈奴 → 名稱層戰國—漢·落點撤銷（對齊 book11/13）·僅…</text>
<text x="1090" y="528" font-size="9.5" fill="#a0653a">開題之國 → 西北</text>
<text x="1090" y="545" font-size="9.5" fill="#a0653a">列人之國 → 西北</text>
<text x="1090" y="562" font-size="9.5" fill="#a0653a">犬封國 → 犬戎別名層·蒙古高原東緣方向</text>
<text x="1090" y="580" font-size="9.5" fill="#a0653a">鬼國 → 一目·貳負尸北·西伯利亞南緣方向</text>
<text x="1090" y="598" font-size="9.5" fill="#a0653a">林氏國 → 騶吾·西北集群</text>
<text x="1090" y="615" font-size="9.5" fill="#a0653a">代 → 借名警示·晉北—冀西北</text>
<text x="1090" y="632" font-size="9.5" fill="#a0653a">燕 → 名稱層西周初以降·落點撤銷·僅存文本方位（近貊）</text>
<text x="1090" y="650" font-size="9.5" fill="#a0653a">東胡 → 名稱層戰國·落點撤銷（原西拉木倫方向）·僅存文…</text>
<text x="1362" y="458" font-size="9.5" fill="#a0653a">夷人 → 依附東胡·落點隨撤·僅存文本序列</text>
<text x="1362" y="475" font-size="9.5" fill="#a0653a">貊國 → 晚層注文混入候選·落點撤銷（漢水存疑）</text>
<text x="1362" y="492" font-size="9.5" fill="#8e44ad">四帝臺 → 堯嚳丹朱舜臺·借名警示·昆侖東北</text>
<text x="1362" y="510" font-size="9.5" fill="#8e44ad">氾林 → 昆侖虛南·方三百里</text>
<text x="1362" y="528" font-size="9.5" fill="#c0392b">疏屬之山 → 梏危之山·開題西北</text>
<text x="1362" y="545" font-size="9.5" fill="#c0392b">陽汙之山 → 河出其中·陽紆互證方向（L2）</text>
<text x="1362" y="562" font-size="9.5" fill="#c0392b">淩門之山 → 河出其中·龍門峽谷方向（L2）</text>
<text x="1362" y="580" font-size="9.5" fill="#c0392b">從極之淵 → 冰夷（河伯）所都·大河深淵</text>
<text x="1362" y="598" font-size="9.5" fill="#c0392b">大澤 → 群鳥所生所解·貝加爾湖方向</text>
<text x="1362" y="615" font-size="9.5" fill="#c0392b">高柳 → 借名警示·晉北方向</text>
<text x="1362" y="632" font-size="9.5" fill="#c0392b">孟鳥 → 貊國東北（文本方位·貊國落點已撤）</text>
<text x="60" y="686" font-size="11" fill="#666">本圖為卷12海內北經補丁圖：清本 27 條目地理提及全覆蓋（mappings 49 行：復用 3／待定錨 24／新增實體 22，人文風物實體不上圖）；pending_anchor 僅示方向，坐標為方向性邊緣</text>
<text x="60" y="702" font-size="11" fill="#666">位，不得反讀為定點。</text>
<text x="60" y="724" font-size="11" fill="#666">歷史演變優先：不以今果為因——匈奴/東胡/燕/代/高柳/犬戎等後世名稱僅作名稱層標記；內容層以候鳥物候（鴈—大澤—孟鳥）與北方大河敘事（河原—從極之淵—陽汙/淩門）為骨架。</text>
