<text x="1124" y="188" font-size="11" fill="#444">北山經北一/北二鏈（淺灰參照）</text>
<text x="1090" y="214" font-size="10" fill="#666">本卷＝區域調查（非里程鏈）：方位幅＝北山經之外以北。條目內序自西向東（各條「在其東」），與題署「自東</text>
<text x="1090" y="228" font-size="10" fill="#666">北陬至西北陬」相反——已知文本問題，存疑不裁。</text>
<text x="1090" y="247" font-size="10" fill="#666">conflict 雙假說並存：鍾山（vs 西三鍾山）／鄧林·夸父國（vs 中六夸父之山·桃林母题）／跂踵國（vs 東三</text>
<text x="1090" y="262" font-size="10" fill="#666">跂踵之山）。已裁決（2026-10-27）：禹所積石之山 F-0017＝晚層編纂不作定位（河湟晚層存冊）；章尾山 F-</text>
<text x="1090" y="276" font-size="10" fill="#666">0018＝泰梅爾方向，與本卷鍾山同母題互記。</text>
<text x="1090" y="294" font-size="10" fill="#666">借名警示：務隅之山「帝顓頊葬于陽·九嬪葬于陰」＝帝系敘事後置附會，不反證山位。</text>
<text x="1090" y="313" font-size="10" fill="#666">「在昆侖之北」（共工臺條）＝跨卷參照西三昆侖之丘（吉薩，窗外西南），自身不作本地錨。</text>
<text x="1090" y="332" font-size="10" fill="#666">族群鏈（無啓→一目→柔利→深目→無腸→聶耳→夸父→拘癭→跂踵）＝極北—西伯利亞風物記錄，點位為方向性</text>
<text x="1090" y="346" font-size="10" fill="#666">示意。</text>
<text x="1090" y="364" font-size="10" fill="#666">北三鏈（大澤復用源）網格東延至遠東（138–170°E），未疊加以免與本卷族群鏈視覺混淆；大澤以綠點單獨標</text>
<text x="1090" y="379" font-size="10" fill="#666">出。</text>
<text x="1090" y="413.5" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="436" font-size="9.5" fill="#8e44ad">無啓之國 → 承長股東·族群鏈首站</text>
<text x="1090" y="453" font-size="9.5" fill="#d35400">鍾山（燭陰） → 極晝極夜母题·與西三鍾山同名 conflict…</text>
<text x="1090" y="470" font-size="9.5" fill="#8e44ad">一目國 → 中西伯利亞方向族群</text>
<text x="1090" y="488" font-size="9.5" fill="#8e44ad">柔利國 → 一手一足反厀·留利別本</text>
<text x="1090" y="506" font-size="9.5" fill="#d35400">共工之臺 → 在昆侖之北柔利東·四方臺蛇飾</text>
<text x="1090" y="523" font-size="9.5" fill="#8e44ad">深目國 → 深目舉一手·共工臺東</text>
<text x="1090" y="540" font-size="9.5" fill="#8e44ad">無腸國 → 長而無腸·飲食轉寫</text>
<text x="1090" y="558" font-size="9.5" fill="#8e44ad">聶耳國 → 縣居海水中·掌水域奇物</text>
<text x="1090" y="576" font-size="9.5" fill="#8e44ad">夸父國（博父） → 母题復用中六夸父之山·conflict</text>
<text x="1090" y="593" font-size="9.5" fill="#d35400">鄧林（二樹木） → 鄧林=桃林音轉 vs 在地二樹木·雙讀</text>
<text x="1090" y="610" font-size="9.5" fill="#8e44ad">拘癭國 → 一手把癭·癭/纓兩讀</text>
<text x="1090" y="628" font-size="9.5" fill="#d35400">尋木 → 千里巨木·生河上西北</text>
<text x="1090" y="646" font-size="9.5" fill="#8e44ad">跂踵國 → 兩足皆支·與東三跂踵山同名 conflict</text>
<text x="1362" y="436" font-size="9.5" fill="#8e44ad">歐絲之野 → 女子跪樹歐絲·桑蠶母题</text>
<text x="1362" y="453" font-size="9.5" fill="#8e44ad">三桑 → 三桑無枝百仞</text>
<text x="1362" y="470" font-size="9.5" fill="#8e44ad">范林 → 方三百里·洲環其下</text>
<text x="1362" y="488" font-size="9.5" fill="#8e44ad">平丘 → 兩山夾谷雙丘·百果所生</text>
<text x="1362" y="506" font-size="9.5" fill="#d35400">務隅之山 → 顓頊葬＝借名警示·無方位語</text>
<text x="1362" y="523" font-size="9.5" fill="#2e7d32">北海（貝加爾） → 復用北二北海·四獸動物群</text>
<text x="1362" y="540" font-size="9.5" fill="#2e7d32">河·豫西段 → 夸父飲河·復用中六河系</text>
<text x="1362" y="558" font-size="9.5" fill="#d35400">渭·關中方向 → 夸父飲渭·渭河候選待定錨</text>
<text x="1362" y="576" font-size="9.5" fill="#2e7d32">大澤 → 夸父北飲大澤·復用北三（低置信）</text>
<text x="1362" y="593" font-size="9.5" fill="#2e7d32">夸父之山·桃林（中六錨） → 豫西崤山·夸父/鄧林母题錨</text>
<text x="1362" y="610" font-size="9.5" fill="#d35400">禹所積石之山 → F-0017 已裁決（2026-10-27）：晚層編…</text>
