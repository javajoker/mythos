<text x="1090" y="258" font-size="10" fill="#666">嚴格走向重校準（adapt-dongci2-4）：經文 南600→西南400→南×15，全鏈 SSW 緩漂隨海岸線——16 腿方</text>
<text x="1090" y="272" font-size="10" fill="#666">位零違背；舊版「沿主脈西南行（山脈走向即東北—西南）」以山勢代經文走向＝違規表述，剔除；舊 fit 南段</text>
<text x="1090" y="287" font-size="10" fill="#666">落海作廢。</text>
<text x="1090" y="306" font-size="10" fill="#666">走廊：紐約州中部（芬格湖群西緣·四望格局）→賓州→西弗吉尼亞（水行＝俄亥俄河系航行）→田納西河谷（犰</text>
<text x="1090" y="320" font-size="10" fill="#666">狳北界）→喬治亞海岸平原→佛羅里達半島（泉水碧潭·大沼澤地）→礁島群（終點·南臨佛州海峽）。</text>
<text x="1090" y="338" font-size="10" fill="#666">物種硬合：軨軨＝美洲野牛（林野牛）；犰狳＝本獸（窗口期北界，名稱偶合不作證）；鵹鶘＝林鴴類樹棲；絜鉤</text>
<text x="1090" y="353" font-size="10" fill="#666">＝負鼠（善登木）。里程：文本 6,640 里自洽 vs 實距 ≈2,027 km→實測比≈0.31（壓縮登記）。</text>
<text x="1090" y="387.5" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="410" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 空桑之山</tspan>　→ 北臨食水＝聖勞倫斯河｜⛰紐約州中部—芬格湖群西緣（阿勒格尼高原北緣）</text>
<text x="1090" y="431" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 曹夕之山</tspan>　→ 下多穀而無水｜⛰賓夕法尼亞中—薩斯奎哈納河谷</text>
<text x="1090" y="452" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 嶧皋之山</tspan>　→ 上多金玉下多白堊｜⛰賓州西南—西弗吉尼亞北（阿勒格尼山）</text>
<text x="1090" y="473" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 葛山之尾</tspan>　→ 水行500＋流沙300＝河流航行＋河谷沙洲｜⛰西弗吉尼亞—俄亥俄河匯流方向</text>
<text x="1090" y="494" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 葛山之首</tspan>　→ 尾→首同脈兩端｜⛰弗吉尼亞西南—田納西河谷上游</text>
<text x="1090" y="516" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 餘峩之山</tspan>　→ 梓枏荊𦬊｜⛰田納西東—藍嶺西麓</text>
<text x="1090" y="537" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 杜父之山</tspan>　→ 無草木多水｜⛰北卡—田納西界 藍嶺南段</text>
<text x="1090" y="558" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 耿山</tspan>　→ 無草木多水碧多大蛇｜⛰南卡羅來納山麓</text>
<text x="1090" y="579" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 盧其之山</tspan>　→ 多沙石｜⛰南卡—喬治亞界 皮埃蒙特</text>
<text x="1090" y="600" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 姑射之山</tspan>　→ 無草木多水｜⛰喬治亞海岸平原（薩凡納方向）</text>
<text x="1090" y="622" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 北姑射之山</tspan>　→ 水行300＋流沙100＝近岸航行＋河口沙洲—障壁島｜⛰喬治亞海岸（不倫瑞克方向）</text>
<text x="1090" y="643" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 南姑射之山</tspan>　→ 無草木多水｜⛰佛羅里達東北（傑克遜維爾方向）</text>
<text x="1090" y="664" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 碧山</tspan>　→ 無草木多大蛇多碧水玉｜⛰佛羅里達中（奧卡拉—代托納方向）</text>
<text x="1090" y="685" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 緱氏之山</tspan>　→ 無草木多金玉｜⛰佛羅里達中南（奧蘭多—奧基喬比方向）</text>
<text x="1090" y="706" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 姑逢之山</tspan>　→ 無草木多金玉｜⛰佛羅里達南（大沼澤地北緣）</text>
