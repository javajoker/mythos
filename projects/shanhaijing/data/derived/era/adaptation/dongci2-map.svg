<text x="1090" y="258" font-size="10" fill="#666">T-RT20 重配（2026-10-27）：起點空桑之山＝紐約州—賓州方向——「北臨食水」＝聖勞倫斯河（河在錨北 15</text>
<text x="1090" y="272" font-size="10" fill="#666">0–200 km，寬讀成立；與東一同實例）、「西望湣澤」＝安大略湖方向；R4 三項硬矛盾（北臨食水／終點錯位</text>
<text x="1090" y="287" font-size="10" fill="#666">／嶧皋水系）隨舊落基—大平原走廊消解——「暫停交付」解除；舊讀法降 rejected_rival 存冊。</text>
<text x="1090" y="306" font-size="10" fill="#666">里程：自記 6,640 里＝腿程（0%）；三檔並列：0.35≈2,324 km／0.385≈2,556 km／0.42≈2,789 km vs </text>
<text x="1090" y="320" font-size="10" fill="#666">河谷曲路實距約 2,000–2,200 km——層累約 1.2–1.3×（放大方向，與 F-0008 相容）。網格＝否定工具（</text>
<text x="1090" y="334" font-size="10" fill="#666">G-3）：純南直線網格與河谷曲路走廊的偏差記 variant，鏈位為走廊擬合（fit_coords 僅繪圖）。</text>
<text x="1090" y="353" font-size="10" fill="#666">風物互證：軨軨「如牛虎文」→美洲野牛（林野牛方向）；犰狳（余峩）→本獸——鏈南段落於窗口期犰狳北界（</text>
<text x="1090" y="368" font-size="10" fill="#666">德克薩斯—灣岸北緣）；絜鉤「如鳧而鼠尾、善登木」→負鼠（樹棲 ✓）；蜃珧＝淡水大蚌（東坡水系）。</text>
<text x="1090" y="386" font-size="10" fill="#666">觀察者：密西西比河谷 Poverty Point（~1700 BCE）/Adena 文化窗口期在場 ✓；窗口期海平面 +1–3 m，</text>
<text x="1090" y="400" font-size="10" fill="#666">灣岸線更偏北。</text>
<text x="1090" y="419" font-size="10" fill="#666">祠牲「毛用一雞祈」按推論性裁決 (a) 不作定位證據（雙向）；借名標記：空桑/澧水/姑射/犰狳名。</text>
<text x="1090" y="453.5" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="476" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 空桑之山</tspan>　→ 紐約州（食水＝聖勞倫斯河；湣澤＝安大略湖）｜⛰阿勒格尼高原北緣</text>
<text x="1090" y="497" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 曹夕之山</tspan>　→ 多穀無水多鳥獸｜⛰阿巴拉契亞·西麓賓州段</text>
<text x="1090" y="518" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 嶧皋之山</tspan>　→ 蜃珧＝淡水大蚌（東坡水系）｜⛰阿勒格尼山南段</text>
<text x="1090" y="539" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 葛山之尾</tspan>　→ 水行＝俄亥俄河系航行；流沙＝沙洲｜⛰西南尾端</text>
<text x="1090" y="560" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 葛山之首</tspan>　→ 珠蟞魚六足有珠（未解）｜⛰田納西河谷上游</text>
<text x="1090" y="582" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 餘峩之山</tspan>　→ ★犰狳＝本獸（灣岸北緣分佈帶）｜⛰田納西河谷</text>
<text x="1090" y="603" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 杜父之山</tspan>　→ 無草木多水｜⛰密西西比河谷（阿拉巴馬）</text>
<text x="1090" y="624" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 耿山</tspan>　→ 水碧大蛇；朱獳｜⛰密西西比河谷（密州）</text>
<text x="1090" y="645" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 盧其之山</tspan>　→ 沙水南注涔水；鵹鶘土功兆｜⛰密西西比河谷</text>
<text x="1090" y="666" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 姑射之山</tspan>　→ 借名標記｜⛰密西西比河谷南段</text>
<text x="1090" y="688" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 北姑射之山</tspan>　→ 水行＋流沙＝河口沙洲｜⛰路易斯安那—灣岸北緣</text>
<text x="1090" y="709" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 南姑射之山</tspan>　→ 多水（三角洲沼澤）｜⛰路易斯安那灣岸</text>
<text x="1090" y="730" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 碧山</tspan>　→ 大蛇＋碧水玉｜⛰路易斯安那—德州灣岸</text>
<text x="1090" y="751" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 緱氏之山</tspan>　→ 原水注沙澤（灣岸潟湖）｜⛰德州灣岸東段</text>
<text x="1090" y="772" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 姑逢之山</tspan>　→ 獙獙旱兆｜⛰德州灣岸中段</text>
<text x="1090" y="794" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 鳧麗之山</tspan>　→ 蠪姪九首九尾｜⛰德州灣岸南段</text>
<text x="1090" y="815" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 䃌山</tspan>　→ 南臨䃌水＝墨西哥灣✓；絜鉤＝負鼠｜⛰德州灣岸（終點）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自空桑之山（紐約州中部，北臨食水＝聖勞倫斯河、西望湣澤＝安大略湖方向）沿阿巴拉契亞西麓南行——賓州（曹夕）→西南折向（嶧皋·蜃珧淡水大蚌）→水行俄亥俄河系＋流沙</text>
<text x="60" y="702" font-size="11" fill="#666">沙洲（葛山之尾）→田納西河谷（葛山之首·珠蟞魚）→餘峩（犰狳本獸——灣岸北緣分佈帶）→密西西比河谷（杜父/耿山/盧其·鵹鶘土功兆）→路易斯安那（姑射三站·河口沙洲）→德克薩斯</text>
<text x="60" y="718" font-size="11" fill="#666">灣岸（碧山/緱氏/姑逢/鳧麗）→䃌山（終點：南臨墨西哥灣＋東望潟湖；絜鉤＝負鼠；狡客人群）。</text>
