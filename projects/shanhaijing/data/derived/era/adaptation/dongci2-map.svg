<text x="1090" y="258" font-size="10" fill="#666">生物錨：犰狳（九帶犰狳）4000–1000 BCE 分佈在墨西哥灣南—中美；「見人則眠」＝裝死防禦行為 corrobo</text>
<text x="1090" y="272" font-size="10" fill="#666">rate；十九世紀北擴不作反證。</text>
<text x="1090" y="291" font-size="10" fill="#666">里程：自記 6,640 里＝腿程合計（0% 偏差——全書唯一零層累長鏈）；0.385 檔≈2,556 km vs 灣岸弧線實</text>
<text x="1090" y="306" font-size="10" fill="#666">距約 2,800–3,000 km——同量級。</text>
<text x="1090" y="324" font-size="10" fill="#666">瑪雅同域候選：姑射—碧山段＝瑪雅前古典期心臟帶（2000 BCE 起，窗口內）；文本無城邑記錄，文化斷層保持</text>
<text x="1090" y="338" font-size="10" fill="#666">未知。</text>
<text x="1090" y="357" font-size="10" fill="#666">神群皆獸身人面載觡（戴角）；祠：雞祈＋璧瘞。食水與東一共名待裁。</text>
<text x="1090" y="391.5" font-size="14" font-weight="bold" fill="#333">17 站 → 現實候選（審核中）</text>
<text x="1090" y="414" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 空桑之山</tspan>　→ 德州灣岸（起點；四望水澤）｜⛰灣岸平原·德克薩斯東南</text>
<text x="1090" y="435" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 曹夕之山</tspan>　→ 塔毛利帕斯北段（多穀無水）｜⛰塔毛利帕斯·灣岸北段台地</text>
<text x="1090" y="456" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 嶧皋之山</tspan>　→ 塔毛利帕斯（蜃珧＝灣岸貝類）｜⛰東馬德雷山脈·東麓</text>
<text x="1090" y="477" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 葛山之尾</tspan>　→ 水行＋流沙複合段（脈尾）｜⛰東馬德雷山脈·南段尾端</text>
<text x="1090" y="498" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 葛山之首</tspan>　→ 礁湖帶；珠蟞魚「有珠」｜⛰東馬德雷山脈·南段</text>
<text x="1090" y="520" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 餘峩之山</tspan>　→ ★犰狳＝美洲獨有（生物錨）｜⛰東馬德雷山脈·南麓</text>
<text x="1090" y="541" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 杜父之山</tspan>　→ 無草木多水｜⛰特萬特佩克地峽·北緣</text>
<text x="1090" y="562" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 耿山</tspan>　→ 水碧大蛇；朱獳恐慌兆｜⛰特萬特佩克地峽</text>
<text x="1090" y="583" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 盧其之山</tspan>　→ 鵹鶘土功兆｜⛰恰帕斯·馬德雷山脈</text>
<text x="1090" y="604" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 姑射之山</tspan>　→ 借名標記｜⛰恰帕斯·馬德雷山脈（危地馬拉段）</text>
<text x="1090" y="626" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 北姑射之山</tspan>　→ 水行＋流沙｜⛰中美科迪勒拉·危地馬拉—薩爾瓦多段</text>
<text x="1090" y="647" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 南姑射之山</tspan>　→ 多水｜⛰中美科迪勒拉·薩爾瓦多—洪都拉斯段</text>
<text x="1090" y="668" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 碧山</tspan>　→ 碧＋水玉（玉石帶弱證）｜⛰中美科迪勒拉·洪都拉斯段</text>
<text x="1090" y="689" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 緱氏之山</tspan>　→ 原水注沙澤（加勒比側）｜⛰中美科迪勒拉·尼加拉瓜段</text>
<text x="1090" y="710" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 姑逢之山</tspan>　→ 獙獙旱兆｜⛰中美科迪勒拉·哥斯達黎加段</text>
<text x="1090" y="732" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 鳧麗之山</tspan>　→ 蠪姪九首九尾｜⛰巴拿馬地峽山嶺</text>
<text x="1090" y="753" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 䃌山</tspan>　→ 南臨䃌水東望湖澤；狡客（終點）｜⛰達連地峽山嶺</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自空桑之山（德州灣岸，四望水澤）沿墨西哥灣西緣南行——塔毛利帕斯（嶧皋·蜃珧貝類）→水行流沙複合段（葛山之尾）→礁湖帶（葛山之首·珠蟞魚有珠）→★餘峩之山（犰狳生</text>
<text x="60" y="702" font-size="11" fill="#666">物錨）→特萬特佩克地峽（杜父/耿山）→恰帕斯（盧其·土功兆）→危地馬拉—洪都拉斯（姑射三站＋碧山——瑪雅心臟帶同域）→尼加拉瓜（緱氏）→哥斯達黎加（姑逢）→巴拿馬（鳧麗·蠪</text>
<text x="60" y="718" font-size="11" fill="#666">姪）→䃌山（達連地峽終點；狡客人群記錄）。</text>
<text x="60" y="740" font-size="11" fill="#666">腿程 6,640 里≈2,556 km（0.385）＝自記（0% 偏差）；網格直線南行、擬合取灣岸—中美山弧（弧線東偏記 variant）。所有對應為競爭假說，時代窗口 4000–1000 BCE；後世同名（澧</text>
<text x="60" y="756" font-size="11" fill="#666">水/姑射/空桑）不作反證。</text>
