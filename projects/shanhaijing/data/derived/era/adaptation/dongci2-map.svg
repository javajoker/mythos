<text x="1090" y="749" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 䃌山</tspan>　→ **南臨䃌水＝佛羅里達海峽｜⛰佛羅里達礁島群（基韋斯特方向，終點）</text>
<text x="60" y="686" font-size="11" fill="#666">嚴格走向重校準（adapt-dongci2-4）：自空桑之山（紐約州中部芬格湖群西緣——北臨食水＝聖勞倫斯河、西望湣澤＝安大略湖）正南緩漂西南：賓州阿勒格尼高原（曹夕·多穀無水）→西南</text>
<text x="60" y="702" font-size="11" fill="#666">腿→阿勒格尼山（嶧皋·白堊·蜃珧淡水大蚌·東坡水系入大西洋 ✓）→水行俄亥俄河系（葛山之尾·砥礪）→田納西河谷上游（葛山之首·珠蟞魚未解）→藍嶺西麓（餘峩·犰狳窗口期北界）→南</text>
<text x="60" y="718" font-size="11" fill="#666">卡山麓（耿山·水碧大蛇）→喬治亞皮埃蒙特（盧其·鵹鶘林鴴·土功兆）→海岸平原（姑射·多水）→近岸航行＋障壁島流沙（北姑射）→佛州東北（南姑射）→佛州泉水帶（碧山·碧水玉）→奧</text>
<text x="60" y="734" font-size="11" fill="#666">基喬比方向（緱氏·原水注沙澤潟湖）→大沼澤地（姑逢·獙獙旱兆）→佛州南端（鳧麗·蠪姪神話層）→礁島群（䃌山·南臨䃌水＝佛州海峽·絜鉤＝負鼠·狡客人群）。</text>
