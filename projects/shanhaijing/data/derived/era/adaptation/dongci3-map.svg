<text x="1090" y="258" font-size="10" fill="#666">終點錨（T-RT21，2026-10-27）：無皋之山＝巴拿馬地峽東端—達連——「南望幼海」＝巴拿馬灣（太平洋）✓</text>
<text x="1090" y="272" font-size="10" fill="#666">（R10 消解；幼海＝小海/灣謙稱）、「東望榑木」＝加勒比日出方向 ✓；置信恢復一級。</text>
<text x="1090" y="291" font-size="10" fill="#666">站 2–4 重配（T-RT21）：岐山＝古巴東·馬埃斯特臘、諸鉤＝伊斯帕尼奧拉·中科迪勒拉、中父＝波多黎各方向</text>
<text x="1090" y="306" font-size="10" fill="#666">——觀察者在場（古巴/伊斯帕尼奧拉 archaic 期 ~4000–3000 BCE；波多黎各 ~3000 BCE 起 ✓）；巴哈馬</text>
<text x="1090" y="320" font-size="10" fill="#666">舊站位撤銷維持（觀察者缺席硬否決——存冊 rejected_rival）；status 自 rejected 改回 proposed_pen</text>
<text x="1090" y="334" font-size="10" fill="#666">ding_review，置信上限 low_medium。</text>
<text x="1090" y="353" font-size="10" fill="#666">連帶調整：胡射＝小安的列斯北段（「東水行千里」與島弧幾何合 ✓）；孟子＝小安的列斯南段—特立尼達（麋</text>
<text x="1090" y="368" font-size="10" fill="#666">鹿泛化消解——特立尼達為大陸島有原生鹿科；鱣鮪→大海鰱＝奧里諾科洄游 ✓）；跂踵（牙買加）鏈序回跳記</text>
<text x="1090" y="382" font-size="10" fill="#666"> variant——水行腿為水路拓扑順序。</text>
<text x="1090" y="400" font-size="10" fill="#666">全鏈水行＝海上島鏈跳躍（水路里數）；自記 6,900 vs 腿程 6,600（-4.3% variant）。網格＝否定工具（G</text>
<text x="1090" y="415" font-size="10" fill="#666">-3）；鏈位為走廊擬合（fit_coords 僅繪圖）。</text>
<text x="1090" y="434" font-size="10" fill="#666">神群人身羊角；祠牡羊＋黍按推論性裁決 (a) 不作定位證據（雙向）。</text>
<text x="1090" y="468.0" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="490" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 尸胡之山</tspan>　→ 水行起點；北望𦍲山｜⛰佛州海峽—巴哈馬北端方向</text>
<text x="1090" y="511" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 岐山</tspan>　→ ★重配：古巴東·馬埃斯特臘（觀察者✓；虎→美洲豹）</text>
<text x="1090" y="532" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 諸鉤之山</tspan>　→ ★重配：伊斯帕尼奧拉·中科迪勒拉（廣員百里大島）</text>
<text x="1090" y="554" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 中父之山</tspan>　→ ★重配：波多黎各方向（多沙海岸段）</text>
<text x="1090" y="575" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 胡射之山</tspan>　→ 東水行千里（東向跳島✓）｜⛰小安的列斯北段</text>
<text x="1090" y="596" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 孟子之山</tspan>　→ 鱣鮪→大海鰱（奧里諾科洄游）｜⛰小安的列斯南—特立尼達</text>
<text x="1090" y="617" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 跂踵之山</tspan>　→ 深澤皆湧＋蠵龜｜⛰牙買加島（鏈序回跳記 variant）</text>
<text x="1090" y="638" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 踇隅之山</tspan>　→ 金玉赭＋植被恢復（島鏈轉陸）｜⛰尼加拉瓜—哥斯達黎加</text>
<text x="1090" y="660" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 無皋之山</tspan>　→ 南望幼海＝巴拿馬灣✓；東望榑木｜⛰達連（終點錨）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自尸胡之山（佛州海峽方向，北望𦍲山）水行南下——岐山（古巴東·馬埃斯特臘；觀察者 ✓）→諸鉤（伊斯帕尼奧拉·中科迪勒拉；廣員百里大島）→中父（波多黎各方向；多沙）</text>
<text x="60" y="702" font-size="11" fill="#666">→東水行千里跳島（胡射·小安的列斯北段）→孟子（小安的列斯南段—特立尼達：碧陽鱣鮪→大海鰱、麋鹿泛化成立）→跂踵（牙買加：深澤湧泉＋蠵龜；鏈序回跳 variant）→踇隅（尼加拉</text>
<text x="60" y="718" font-size="11" fill="#666">瓜—哥斯達黎加；金玉赭轉陸）→無皋之山（達連終點：南望幼海＝巴拿馬灣、東望榑木＝加勒比日出）。</text>
