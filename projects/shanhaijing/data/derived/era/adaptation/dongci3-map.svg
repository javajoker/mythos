<text x="1090" y="258" font-size="10" fill="#666">嚴格走向重校準（adapt-dongci3-4）：全鏈水行＝海上島鏈/沿岸航行——南水行×3（佛州南→古巴中南→牙</text>
<text x="1090" y="272" font-size="10" fill="#666">買加→巴拿馬北岸）→東水行千里（→聖瑪爾塔內華達，世界最高海岸山）→南水行×4（→馬格達萊納河谷→烏</text>
<text x="1090" y="287" font-size="10" fill="#666">拉巴—達連北→喬科→太平洋岸南）。8 腿方位零違背；中父腿實距 996 km vs 700 里＝1.42× 膨脹（水行</text>
<text x="1090" y="302" font-size="10" fill="#666">長腿快行登記）。</text>
<text x="1090" y="320" font-size="10" fill="#666">物種/資源硬合：虎＝美洲豹（古巴化石記錄，存疑級）；寐魚＝近海魚群；麋鹿泛化＝馬格達萊納河谷原生鹿科</text>
<text x="1090" y="334" font-size="10" fill="#666">；蠵龜＝達連濕地棱皮龜產地；大蛇＝森蚺/黃水蚺；金玉赭＝喬科金鉑礦帶；鱣鮪＝馬格達萊納河大魚。</text>
<text x="1090" y="353" font-size="10" fill="#666">T-RT21 站位重排（走向硬約束）：舊 伊斯帕尼奧拉/波多黎各/小安的列斯/特立尼達/牙買加回跳/尼加拉瓜/達</text>
<text x="1090" y="368" font-size="10" fill="#666">連 站位全部降 rejected_rival 存冊（走向違背）；F-0019（東山經主體＝美洲）維持；R8 觀察者缺席否決</text>
<text x="1090" y="382" font-size="10" fill="#666">維持於巴哈馬（本路線不經巴哈馬）。</text>
<text x="1090" y="416.5" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="438" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 尸胡之山</tspan>　→ 北望𦍲山｜⛰佛羅里達南端—邁阿密方向（水行起點）</text>
<text x="1090" y="460" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 岐山</tspan>　→ 南水行800｜⛰古巴中南部—西恩富戈斯方向</text>
<text x="1090" y="481" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 諸鉤之山</tspan>　→ 南水行700｜⛰牙買加</text>
<text x="1090" y="502" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 中父之山</tspan>　→ 南水行700｜⛰巴拿馬北岸—聖布拉斯方向</text>
<text x="1090" y="523" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 胡射之山</tspan>　→ **東水行千里｜⛰聖瑪爾塔內華達山脈（哥倫比亞北岸）</text>
<text x="1090" y="544" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 孟子之山</tspan>　→ 南水行700｜⛰馬格達萊納河口—下游河谷（哥倫比亞）</text>
<text x="1090" y="566" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 跂踵之山</tspan>　→ 南水行500＋流沙500｜⛰烏拉巴灣—達連北岸</text>
<text x="1090" y="587" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 踇隅之山</tspan>　→ 南水行900｜⛰喬科—哥倫比亞太平洋岸</text>
<text x="1090" y="608" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 無皋之山</tspan>　→ 南水行500＋流沙300｜⛰哥倫比亞太平洋岸南—布埃納文圖拉方向（終點）</text>
<text x="60" y="686" font-size="11" fill="#666">嚴格走向重校準（adapt-dongci3-4）：全鏈水行＝海上航行記錄。自尸胡之山（佛羅里達南端——北望𦍲山）南水行：古巴中南部（岐山·桃李·虎＝美洲豹）→牙買加（諸鉤·廣員百里島嶼·寐</text>
