<text x="1090" y="258" font-size="10" fill="#666">終點錨：無皋之山「南望幼海＝加勒比（南）＋東望榑木＝日出」＝哥斯達黎加加勒比岸；反向展開。確認範圍：</text>
<text x="1090" y="272" font-size="10" fill="#666">加勒比—中美島鏈（25°N→10°N / 65–95°W）。</text>
<text x="1090" y="291" font-size="10" fill="#666">全鏈水行（8 腿水行＋1 腿東向）——水路里數與山徑不同尺度，里程僅作拓扑順序證據；自記 6,900 vs 腿程</text>
<text x="1090" y="306" font-size="10" fill="#666"> 6,600（-4.3% variant）；起點網格 29.4°N 略越北界（水行層累，variant）。</text>
<text x="1090" y="324" font-size="10" fill="#666">鱣鮪→大海鰱泛化（加勒比無鱘魚；本義為對立候選）；蠵龜＝加勒比海龜 ✓。</text>
<text x="1090" y="342" font-size="10" fill="#666">神群人身羊角；祠牡羊＋黍；「見則風雨水為敗」＝風暴災異（颶風走廊相容，弱證）。</text>
<text x="1090" y="377.0" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="399" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 尸胡之山</tspan>　→ 水行起點；北望𦍲山｜⛰巴哈馬北—佛州海峽島嶼</text>
<text x="1090" y="420" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 岐山</tspan>　→ 桃李＋虎（美洲豹泛化；借名）｜⛰巴哈馬群島·北段</text>
<text x="1090" y="441" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 諸鉤之山</tspan>　→ 廣員百里大島；寐魚｜⛰巴哈馬群島·中段</text>
<text x="1090" y="463" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 中父之山</tspan>　→ 多沙沙島｜⛰巴哈馬南—古巴北岸</text>
<text x="1090" y="484" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 胡射之山</tspan>　→ 東水行千里（東向跳島）｜⛰古巴東—伊斯帕尼奧拉島</text>
<text x="1090" y="505" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 孟子之山</tspan>　→ 鱣鮪→大海鰱泛化（加勒比無鱘魚）｜⛰伊斯帕尼奧拉島</text>
<text x="1090" y="526" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 跂踵之山</tspan>　→ 深澤皆湧＋蠵龜（加勒比海龜✓）｜⛰牙買加島（藍山方向）</text>
<text x="1090" y="547" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 踇隅之山</tspan>　→ 金玉赭＋植被恢復（島鏈轉陸）｜⛰尼加拉瓜—哥斯達黎加山嶺</text>
<text x="1090" y="569" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 無皋之山</tspan>　→ 南望幼海（南加勒比）＋東望榑木（終點錨）｜⛰哥斯達黎加加勒比岸山嶺</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自尸胡之山（佛州海峽—巴哈馬北端，北望𦍲山）水行南下——巴哈馬（岐山·桃李虎泛化）→諸鉤（廣員百里大島）→中父（多沙）→東水行千里跳島（胡射）→伊斯帕尼奧拉（孟</text>
<text x="60" y="702" font-size="11" fill="#666">子·碧陽——鱣鮪→大海鰱泛化）→牙買加（跂踵·深澤湧泉＋蠵龜＋複合流沙段）→尼加拉瓜—哥斯達黎加（踇隅·金玉赭轉陸）→無皋之山（哥斯達黎加加勒比岸終點：南望幼海＝加勒比、東</text>
<text x="60" y="718" font-size="11" fill="#666">望榑木＝日出符號）。</text>
