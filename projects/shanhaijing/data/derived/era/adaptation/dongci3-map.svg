<text x="1090" y="258" font-size="10" fill="#666">終點錨：無皋之山「南望幼海＋東望榑木」＝南望加勒比海＋東望日出——中美東岸位置自證；反向展開。</text>
<text x="1090" y="276" font-size="10" fill="#666">全鏈水行（8 腿水行＋1 腿東向）——水路里數與山徑不同尺度，里程僅作拓扑順序證據；自記 6,900 vs 腿程</text>
<text x="1090" y="291" font-size="10" fill="#666"> 6,600（-4.3% variant）。</text>
<text x="1090" y="310" font-size="10" fill="#666">蠵龜（跂踵）＝加勒比海龜＋鱣鮪（孟子）＝島嶼大河洄游魚——海洋性風物雙證。</text>
<text x="1090" y="328" font-size="10" fill="#666">神群人身羊角；祠牡羊＋黍；「見則風雨水為敗」＝風暴災異（颶風走廊相容，弱證）。</text>
<text x="1090" y="362.5" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="384" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 尸胡之山</tspan>　→ 水行起點；北望𦍲山｜⛰外灘群島北段</text>
<text x="1090" y="406" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 岐山</tspan>　→ 桃李＋虎（泛化；借名）｜⛰佛羅里達半島</text>
<text x="1090" y="427" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 諸鉤之山</tspan>　→ 廣員百里大島；寐魚｜⛰巴哈馬群島</text>
<text x="1090" y="448" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 中父之山</tspan>　→ 多沙沙島｜⛰巴哈馬南—古巴北岸</text>
<text x="1090" y="469" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 胡射之山</tspan>　→ 東水行千里（東向跳島）｜⛰伊斯帕尼奧拉島</text>
<text x="1090" y="490" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 孟子之山</tspan>　→ 碧陽水多鱣鮪（洄游大河島）｜⛰古巴—伊斯帕尼奧拉山島</text>
<text x="1090" y="512" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 跂踵之山</tspan>　→ 深澤皆湧＋蠵龜（加勒比海龜✓）｜⛰古巴島（馬埃斯特拉方向）</text>
<text x="1090" y="533" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 踇隅之山</tspan>　→ 金玉赭＋植被恢復（島鏈轉陸）｜⛰尤卡坦台地</text>
<text x="1090" y="554" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 無皋之山</tspan>　→ 南望幼海＋東望榑木（終點錨）｜⛰伯利茲—尤卡坦東岸</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自尸胡之山（美國東南外灘，北望𦍲山）水行南下——佛羅里達（岐山·桃李虎泛化）→巴哈馬沙島（諸鉤·廣員百里）→中父（多沙）→東水行千里跳島（胡射）→古巴—伊斯帕尼奧</text>
<text x="60" y="702" font-size="11" fill="#666">拉（孟子·碧陽鱣鮪洄游大河）→古巴大島（跂踵·深澤湧泉＋蠵龜＋複合流沙段）→尤卡坦北岸（踇隅·金玉赭轉陸）→無皋之山（伯利茲終點：南望幼海＝加勒比、東望榑木＝日出符號）。</text>
<text x="60" y="724" font-size="11" fill="#666">腿程 6,600 里≈2,541 km（0.385）vs 自記 6,900 里（-4.3% variant）；水行為水路里數，里程僅作拓扑順序證據。所有對應為競爭假說，時代窗口 4000–1000 BCE；瑪雅同域候選（</text>
<text x="60" y="740" font-size="11" fill="#666">踇隅/無皋段，前古典期東緣）——文化斷層保持未知。</text>
</svg>