<text x="1090" y="258" font-size="10" fill="#666">南一「凡十山」佚一站、南三「凡十四山」佚旄山之首——variant 已記，缺站加深而非解釋里程問題（RT-N7</text>
<text x="1090" y="272" font-size="10" fill="#666">）；三鏈帶符號並列：南一 −0.75×／南二 +1.5–2×／南三 +1.2×。</text>
<text x="1090" y="291" font-size="10" fill="#666">F-0014（南北分工）已裁決：南二北移江南走廊（26–30°N）、南三南壓沿海（18–23°N），走廊分離 >2°；F</text>
<text x="1090" y="306" font-size="10" fill="#666">-0015 具區＝太湖成立（《爾雅》《周禮》先秦專名），江南讀法升主框架。</text>
<text x="1090" y="324" font-size="10" fill="#666">南島文明方向同域候選級：班清（中南半島）/嶺南百越在窗口內；大坌坑（閩台）引用已收束——鏈是否過台灣</text>
<text x="1090" y="338" font-size="10" fill="#666">未決（RT-N6）。南半球/澳洲由風物否決（無有袋類描述）。</text>
<text x="1090" y="373.0" font-size="14" font-weight="bold" fill="#333">子經鏈 → 現實區域（審核中）</text>
<text x="1090" y="395" font-size="11" fill="#2e86c1">南一·招搖鏈（9 站）→ 中南半島（若開山→撣邦高原→長山山脈；肉桂＋長臂猿科泛化（白耳對應勉強—…</text>
<text x="1090" y="416" font-size="11" fill="#2874a6">南二·柜山鏈（17 站）→ 江南走廊：羅霄山→贛南→武夷山→天目山（浮玉·北望具區＝太湖）→會稽→浙…</text>
<text x="1090" y="437" font-size="11" fill="#5dade2">南三·天虞鏈（13 站）→ 嶺南—中南半島東緣沿海：十萬大山→下龍灣→越南海岸山帶→頭頓方向（佐水…</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：《南山經》三鏈——南一自招搖之山（若開山脈）東行九站穿撣邦高原至箕尾之山（長山山脈，「其尾踆于東海」降 variant——RT-N7）；南二自柜山（羅霄山脈中段）東行十七站</text>
<text x="60" y="702" font-size="11" fill="#666">——贛南→武夷山→天目山（浮玉·北望具區＝太湖）→會稽（紹興）→浙東山地→漆吳之山（東海島鏈端點候選，「是惟日次」）；南三自天虞之山（桂西—滇東南）南壓沿海十三站——十萬</text>
<text x="60" y="718" font-size="11" fill="#666">大山→下龍灣→越南海岸山帶（令丘「多火」列 unknown——RT-N5）→南禺之山（頭頓方向，佐水東南流注于海）。</text>
<text x="60" y="740" font-size="11" fill="#666">概要圖站位＝各子經算術網格（網格＝否定工具，G-3；層累已記於各經 variant）；赤水類名註冊（F-0011）：南二赤水＝湘南紅層水系方向，與西三赤水＝紅海候選分屬不同子經類名。所有</text>
<text x="60" y="756" font-size="11" fill="#666">對應為競爭假說，時代窗口 4000–1000 BCE。</text>
</svg>