<text x="1090" y="258" font-size="10" fill="#666">南一「凡十山」佚一站、南三「凡十四山」佚旄山之首——variant 已記；里程自記 vs 腿程見各經適配檔。</text>
<text x="1090" y="276" font-size="10" fill="#666">邊界裁定（v1.4）：長臂猿生物群鎖定東南亞；南二拓扑（赤水/具區/東海島鏈）與南三（雷州火山窗口期 vs </text>
<text x="1090" y="291" font-size="10" fill="#666">德干死火山）否決印度讀法。</text>
<text x="1090" y="310" font-size="10" fill="#666">南島文明方向同域候選級：班清（中南半島）/大坌坑（閩台）/嶺南百越均在窗口內 ✓。</text>
<text x="1090" y="344.0" font-size="14" font-weight="bold" fill="#333">子經鏈 → 現實區域（審核中）</text>
<text x="1090" y="366" font-size="11" fill="#2e86c1"><tspan font-weight="bold">南一·招搖鏈</tspan>（9 站）→ 中南半島（若開山→撣邦高原→長山山脈；肉桂＋白耳長臂猿＋赤鱬儒艮；青丘九尾狐）</text>
<text x="1090" y="387" font-size="11" fill="#2874a6"><tspan font-weight="bold">南二·柜山鏈</tspan>（17 站）→ 滇東→南嶺→武夷山→東海島鏈（赤水＝紅河方向拓扑錨；漆吳日次＝島鏈端點·大坌坑同域）</text>
<text x="1090" y="408" font-size="11" fill="#5dade2"><tspan font-weight="bold">南三·天虞鏈</tspan>（13 站）→ 嶺南山系（桂西—滇東南→嶺南丘陵→雷州—瓊北火山候選→閩粵沿海；犀兕象熱帶動物群＋鳳皇五德文）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：《南山經》三鏈——南一自招搖之山（若開山脈）東行九站穿撣邦高原至箕尾之山（長山山脈，其尾踆于東海）；南二自柜山（滇東）東北行十七站——南嶺→武夷山→漆吳之山（東</text>
<text x="60" y="702" font-size="11" fill="#666">海島鏈端點，「處於東海，望丘山，其光載出載入，是惟日次」）；南三自天虞之山（桂西—滇東南）東行十三站——嶺南丘陵（犀兕象＋鳳皇五德文）→令丘之山（多火＝雷州—瓊北火山群候</text>
<text x="60" y="718" font-size="11" fill="#666">選）→南禺之山（閩粵沿海，佐水出焉而東南流注于海）。</text>
<text x="60" y="740" font-size="11" fill="#666">概要圖站位＝各子經算術網格（東向層累已記於各經 variant）；赤水類名註冊（F-0011）：南二赤水＝紅河方向，與西三赤水＝紅海候選分屬不同子經類名。所有對應為競爭假說，時代窗口 </text>
<text x="60" y="756" font-size="11" fill="#666">4000–1000 BCE。</text>
</svg>