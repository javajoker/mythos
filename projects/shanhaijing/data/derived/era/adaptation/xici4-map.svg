<text x="1090" y="335" font-size="10" fill="#666">弱水四見（勞山/海內西經/大荒西經/海內南經）→ 類名說：弱水＝消失/不任舟楫之水的性狀類名，待裁。</text>
<text x="1090" y="365.5" font-size="14" font-weight="bold" fill="#333">19 站 → 現實候選（審核中）</text>
<text x="1090" y="388" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 陰山</tspan>　→ 紹拉河谷下游台地</text>
<text x="1090" y="409" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 勞山</tspan>　→ 紹拉河東丘陵·弱水</text>
<text x="1090" y="430" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 罷父之山</tspan>　→ 河間台地</text>
<text x="1090" y="451" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 申山</tspan>　→ 山前帶·區水東注河</text>
<text x="1090" y="472" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 鳥山</tspan>　→ 桑楮山·陰鐵陽玉</text>
<text x="1090" y="493" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 上申之山</tspan>　→ 礫石山·白鹿·胡兀鷲</text>
<text x="1090" y="515" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 諸次之山</tspan>　→ 密林蛇山</text>
<text x="1090" y="536" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 號山</tspan>　→ 藥草漆樹山</text>
<text x="1090" y="557" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 盂山</tspan>　→ 鐵銅礦山·白色動物群</text>
<text x="1090" y="578" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 白於之山</tspan>　→ 雪松林山·雙源分水</text>
<text x="1090" y="600" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 申首之山</tspan>　→ 雪峯·伏流（冬夏有雪）</text>
<text x="1090" y="621" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 涇谷之山</tspan>　→ 高原谷山</text>
<text x="1090" y="642" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 剛山</tspan>　→ 山精人面獸身</text>
<text x="1090" y="663" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 剛山之尾</tspan>　→ 山脈尾端·洛水北注</text>
<text x="1090" y="684" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 英鞮之山</tspan>　→ 漆木林·鳥獸盡白</text>
<text x="1090" y="706" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 中曲之山</tspan>　→ 駮＝白大羚羊（一角）</text>
<text x="1090" y="727" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 邽山</tspan>　→ 窮奇·濛水南注洋水</text>
<text x="1090" y="748" font-size="11" fill="#7b241c"><tspan font-weight="bold">18 鳥鼠同穴之山</tspan>　→ 主脊集水嶺（雙向分水）</text>
<text x="1090" y="769" font-size="11" fill="#7b241c"><tspan font-weight="bold">19 崦嵫之山</tspan>　→ 大西洋岸日落山（終點錨）</text>
<text x="60" y="620" font-size="11" fill="#666">推理說明：自陰山（紹拉河谷下游）正北七站跨撒哈拉阿特拉斯山前帶（西洛東河分水脊線），於白於之山轉西，經申首雪峯（冬夏有雪）、中阿特拉斯，抵高阿特拉斯主脊集水嶺（鳥鼠同穴：渭水東流、</text>
<text x="60" y="636" font-size="11" fill="#666">濫水西流），西南至崦嵫之山（日落山）——苕水西流注于海＝蘇斯河入大西洋。</text>
<text x="60" y="658" font-size="11" fill="#666">腿程合計 3,205 里≈1,234 km（0.385；原文自記 3,680 里，差異記錄待校）。淨位移擬合約 97%。所有對應為競爭假說，時代窗口 4000–1000 BCE；內流水系已衰退、白色相動物群已退出，現代無水</text>
<text x="60" y="674" font-size="11" fill="#666">不作否決。</text>
