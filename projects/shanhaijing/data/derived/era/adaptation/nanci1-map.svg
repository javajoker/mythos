<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：招搖之山「臨於西海」＝若開濱海山脈＋麗𪊨之水西流注海——西麓雙重自證。</text>
<text x="1090" y="276" font-size="10" fill="#666">里程：自記 2,950 vs 腿程 2,700（+9%）；「凡十山」vs 9 站有文——佚一站 variant。</text>
<text x="1090" y="295" font-size="10" fill="#666">南一雙修（2026-10-27）：里值主檔 0.42——腿程≈1,134 km vs 鏈實距≈1,100 km → ≈1:1，−0.75× </text>
<text x="1090" y="310" font-size="10" fill="#666">縮水反例結案（RT-N3；F-0008 不動）。</text>
<text x="1090" y="328" font-size="10" fill="#666">箕尾＝長山中段—海雲嶺段（17–18°N）：尾踆東海復活成立（長山餘脈入南海 ✓；海侵期海岸更貼長山）。青</text>
<text x="1090" y="342" font-size="10" fill="#666">丘＝長山北段東麓近海；即翼之澤＝北部灣潟湖—淺海；赤鱬＝儒艮復活（北部灣歷史分布，合浦遺存）——RT-</text>
<text x="1090" y="357" font-size="10" fill="#666">N4 消解。</text>
<text x="1090" y="376" font-size="10" fill="#666">末兩站為 fit_coords 語義位（直線算術網格 vs 山弧，G-3 記錄）；置信度上限 medium（待 T-RT05 遮蔽</text>
<text x="1090" y="390" font-size="10" fill="#666">）。</text>
<text x="1090" y="408" font-size="10" fill="#666">神群皆鳥身龍首；祠：璋玉瘞＋稌米＋璧＋白菅席——稻作儀式風物。</text>
<text x="1090" y="427" font-size="10" fill="#666">文明同域：中南半島山地（班清文化方向，約 2000 BCE 起，窗口內）——候選級；文化斷層保持未知。</text>
<text x="1090" y="461.5" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="484" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 招搖之山</tspan>　→ 若開北段（起點錨；臨西海）｜⛰若開山脈·北段</text>
<text x="1090" y="505" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 堂庭之山</tspan>　→ 緬中方向（棪木＋白猿）｜⛰若開山脈·南段—緬中山地</text>
<text x="1090" y="526" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 猨翼之山</tspan>　→ 撣邦西緣（五怪並記·瘴癘叢林）｜⛰撣邦高原西緣</text>
<text x="1090" y="547" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 杻陽之山</tspan>　→ 撣邦（陽赤金陰白金；鹿蜀·旋龜）｜⛰撣邦高原</text>
<text x="1090" y="568" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 柢山</tspan>　→ 撣邦東緣（鯥·冬死夏生）｜⛰撣邦高原東緣</text>
<text x="1090" y="590" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 亶爰之山</tspan>　→ 泰北方向（類·自為牝牡）｜⛰泰北—撣邦東段</text>
<text x="1090" y="611" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 基山</tspan>　→ 泰北—老撾（猼訑·𪁺𩿧）｜⛰泰北—老撾北段</text>
<text x="1090" y="632" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 青丘之山</tspan>　→ 長山北段東麓近海（九尾狐·赤鱬＝儒艮 ✓）｜⛰長山北段東麓（近海）</text>
<text x="1090" y="653" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 箕尾之山</tspan>　→ 長山中段—海雲嶺段（尾踆東海＝餘脈入南海 ✓ 終點）｜⛰長山山脈·中段</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自招搖之山（若開山脈北段，臨孟加拉灣——肉桂＋白耳狌狌長臂猿科）東行——緬中（堂庭·白猿）→撣邦西緣（猨翼·五怪瘴癘叢林）→撣邦（杻陽·赤金白金分帶·鹿蜀·旋龜）→</text>
<text x="60" y="702" font-size="11" fill="#666">撣邦東緣（柢山·鯥冬死夏生）→泰北（亶爰·類自為牝牡）→泰北—老撾（基山·猼訑𪁺𩿧）→長山北段東麓近海（青丘·九尾狐·赤鱬＝儒艮——北部灣歷史分布）→箕尾之山（長山中段—海雲</text>
<text x="60" y="718" font-size="11" fill="#666">嶺段終點：尾踆東海＝長山餘脈入南海 ✓，雙修成立）。末兩站為 fit_coords 語義位（直線算術網格 vs 山弧——G-3 記錄）。</text>
<text x="60" y="740" font-size="11" fill="#666">南一雙修（2026-10-27）：里值主檔 0.42——腿程 2,700 里≈1,134 km vs 若開—長山中段（海雲嶺段）實距≈1,100 km → ≈1:1，−0.75× 縮水反例結案（RT-N3；F-0008 不動）；</text>
<text x="60" y="756" font-size="11" fill="#666">自記 2,950 vs 腿程 2,700（+9% variant）。即翼之澤＝北部灣潟湖—淺海（海侵期更大）；赤鱬＝儒艮復活（RT-N4 消解）。所有對應為競爭假說，時代窗口 4000–1000 BCE；箕尾借名</text>
<text x="60" y="772" font-size="11" fill="#666">、英水共名（F-0011 規則）。</text>
