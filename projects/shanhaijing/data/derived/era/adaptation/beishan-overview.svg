<text x="60" y="686" font-size="11" fill="#666">推理說明：《北山經》三鏈——北一自單狐之山（青海南部—阿尼瑪卿北麓）純北向：青海東北→甘肅—寧夏→河套→烏海（橐駝＝雙峰駝）→陰山—大青山→蠻漢山→烏蘭察布→錫林郭勒→渾</text>
<text x="60" y="702" font-size="11" fill="#666">善達克→赤峰→杭愛山北麓（敦薨·河原＋赤鮭旄牛·拓撲錨）→後杭愛→庫蘇古爾→圖瓦（隄山·生食不火人群終點）；北二自管涔之山（晉北呂梁，河之東＋枕汾）北行穿陰山—戈壁至敦題之</text>
<text x="60" y="718" font-size="11" fill="#666">山（錞于北海＝貝加爾湖南岸）；北三自歸山（中條山南段·運城鹽池錨）沿太行山鏈北上至蔚縣（橐駝＋陸水複合腿），北水行跨戈壁——帝都之山（貝加爾湖奧爾洪島）→錞于毋逢之山（楚</text>
<text x="60" y="734" font-size="11" fill="#666">科奇方向終點）。</text>
