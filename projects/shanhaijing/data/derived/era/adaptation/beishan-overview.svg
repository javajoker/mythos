<line x1="1090" y1="184" x2="1116" y2="184" stroke="#2f7fbf" stroke-width="2.5"/>
<text x="1124" y="188" font-size="11" fill="#444">現代河流/海岸參照</text>
<rect x="1098" y="201" width="8" height="8" fill="#cfe0e8"/>
<text x="1124" y="210" font-size="11" fill="#444">湖澤（北海/泰澤）</text>
<rect x="1098" y="223" width="8" height="8" fill="#34495e"/>
<text x="1124" y="232" font-size="11" fill="#444">現代地點參照點</text>
<text x="1090" y="258" font-size="10" fill="#666">三鏈分工：北一＝河源—高原生業鏈（生食不火人群）；北二＝晉北—陰山—戈壁—貝加爾氣候錨鏈（冬夏有雪三</text>
<text x="1090" y="272" font-size="10" fill="#666">見）；北三＝中原山系—極北躍程鏈（運城鹽池單站錨＋奧爾洪島＋楚科奇終點）。</text>
<text x="1090" y="291" font-size="10" fill="#666">河＝黃河中游（晉陝峽谷穩定段；下游改道不否決不鎖定——發起人 2026-10-24 補充規則）。</text>
<text x="1090" y="310" font-size="10" fill="#666">白令海峽＝延伸對立候選（無物種級錨）；北三末段為極北躍程壓縮段（variant）。</text>
<text x="1090" y="344.0" font-size="14" font-weight="bold" fill="#333">子經鏈 → 現實區域（審核中）</text>
<text x="1090" y="366" font-size="11" fill="#a07d1e"><tspan font-weight="bold">北一·單狐鏈</tspan>（25 站）→ 青海南部→杭愛山→圖瓦（敦薨之山＝色楞格/鄂爾渾河源錨；生食不火生業錨）</text>
<text x="1090" y="387" font-size="11" fill="#b7950b"><tspan font-weight="bold">北二·管涔鏈</tspan>（16 站）→ 晉北呂梁→陰山→戈壁→貝加爾湖南岸（敦題之山「錞于北海」終點錨；冬夏有雪三見）</text>
<text x="1090" y="408" font-size="11" fill="#7d6608"><tspan font-weight="bold">北三·太行鏈</tspan>（47 站）→ 山西高原—太行鏈→貝加爾奧爾洪島（帝都湖心島錨）→楚科奇方向（錞于毋逢終點：雞號寒風·西望幽都）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：《北山經》三鏈——北一自單狐之山（青海南部—阿尼瑪卿北麓）純北向：青海東北→甘肅—寧夏→河套→烏海（橐駝＝雙峰駝）→陰山—大青山→蠻漢山→烏蘭察布→錫林郭勒→渾</text>
<text x="60" y="702" font-size="11" fill="#666">善達克→赤峰→杭愛山北麓（敦薨·河原＋赤鮭旄牛·拓撲錨）→後杭愛→庫蘇古爾→圖瓦（隄山·生食不火人群終點）；北二自管涔之山（晉北呂梁，河之東＋枕汾）北行穿陰山—戈壁至敦題之</text>
<text x="60" y="718" font-size="11" fill="#666">山（錞于北海＝貝加爾湖南岸）；北三自歸山（中條山南段·運城鹽池錨）沿太行山鏈北上至蔚縣（橐駝＋陸水複合腿），北水行跨戈壁——帝都之山（貝加爾湖奧爾洪島）→錞于毋逢之山（楚</text>
<text x="60" y="734" font-size="11" fill="#666">科奇方向終點）。</text>
<text x="60" y="756" font-size="11" fill="#666">北一/北二站位＝算術網格（層累約 1.0–1.34×，帶內）；北三＝語義擬合站位（算術起點後置 138.5°E variant）。所有對應為競爭假說，時代窗口 4000–1000 BCE；後世同名（管涔/汾</text>
<text x="60" y="772" font-size="11" fill="#666">/太行/雁門等）借名標記不作反證；泰澤類名分段（北三-008＝大陸澤方向／北一+北三-046＝貝加爾湖）。</text>
