<text x="1090" y="280" font-size="10" fill="#666">T-RT05 遮蔽重判（2026-10-28）：blind_pack 三段遮蔽包（剔除經卷名/鏈首/卷末里程）由獨立評審在無項</text>
<text x="1090" y="294" font-size="10" fill="#666">目先驗下定位——三段分別判為華山—少華山（太華「削成而四方」形態指認力極強）→秦嶺主脊（大時渭/漢分</text>
<text x="1090" y="309" font-size="10" fill="#666">水嶺＝唯一解）→漢水源（嶓塚）→甘南—青海湖（翠山旄牛麢麝高寒動物群；騩山錞于西海＝青海湖最優解）。</text>
<text x="1090" y="324" font-size="10" fill="#666">三段與 v1 走廊全符：v1 回擺執行（項目負責人批准）；v2（川西—藏東借名純化）被遮蔽實驗否決，降 reje</text>
<text x="1090" y="338" font-size="10" fill="#666">cted_rival 存冊不刪。</text>
<text x="1090" y="356" font-size="10" fill="#666">水系結構不是借名：七溪北注渭＋大時「北渭南漢」分水＋嶓塚「漢水出焉東南注沔」（沔＝漢水上游別稱）＋淒</text>
<text x="1090" y="371" font-size="10" fill="#666">水西流注湖——流向拓撲同構無法用借名解釋。</text>
<text x="1090" y="390" font-size="10" fill="#666">置信度：五錨站（太華/大時/嶓塚/翠山/騩山）medium_high（遮蔽一致解封）；其餘 medium 上限。</text>
<text x="1090" y="408" font-size="10" fill="#666">里程：自記 2,957 里 vs 腿程 3,045 里（+3.0%）；華山→青海湖實距約 800–950 km vs 三檔 1,035／1,</text>
<text x="1090" y="422" font-size="10" fill="#666">138／1,242 km（+9%～+55%，全檔放大——層累在放大方向 ✓）。網格＝否定工具（G-3）：站點為走廊實配</text>
<text x="1090" y="437" font-size="10" fill="#666">位（fit_coords 僅繪圖），算術鏈位見 xici1-station-grid.jsonl。</text>
<text x="1090" y="471.5" font-size="14" font-weight="bold" fill="#333">19 站 → 現實候選（審核中）</text>
<text x="1090" y="494" font-size="9.5" fill="#7b241c"> 1 錢來之山 → 崤山東段（鏈起點）｜⛰崤山·東段</text>
<text x="1090" y="511" font-size="9.5" fill="#7b241c"> 2 松果之山 → 華山東麓·濩水注渭</text>
<text x="1090" y="528" font-size="9.5" fill="#7b241c"> 3 太華之山 → ★錨＝華山·削成而四方（盲評高置信）</text>
<text x="1090" y="546" font-size="9.5" fill="#7b241c"> 4 小華之山 → 少華山·太/小華成對｜⛰少華山</text>
<text x="1090" y="564" font-size="9.5" fill="#7b241c"> 5 符禺之山 → 秦嶺北麓·陽銅陰鐵</text>
<text x="1090" y="581" font-size="9.5" fill="#7b241c"> 6 石脆之山 → 秦嶺北麓·流赭獸醫民俗</text>
<text x="1090" y="598" font-size="9.5" fill="#7b241c"> 7 英山 → 藍田段·箭竹（熊貓食竹）</text>
<text x="1090" y="616" font-size="9.5" fill="#7b241c"> 8 竹山 → 雙源·人魚＝大鯢·豪豬｜⛰秦嶺北麓竹林山</text>
<text x="1090" y="634" font-size="9.5" fill="#7b241c"> 9 浮山 → 薰草（香草民俗）</text>
<text x="1090" y="651" font-size="9.5" fill="#7b241c">10 羭次之山 → 神山（羭山神也）·漆樹帶·金絲猴</text>
<text x="1362" y="494" font-size="9.5" fill="#7b241c">11 時山 → 裸山·水玉·逐水注渭</text>
<text x="1362" y="511" font-size="9.5" fill="#7b241c">12 南山 → 秦嶺主脊東段·丹水北注渭（≠丹江）·猛豹＝豹…</text>
<text x="1362" y="528" font-size="9.5" fill="#7b241c">13 大時之山 → ★錨＝太白山—鰲山段·渭/漢分水嶺（C5＋…</text>
<text x="1362" y="546" font-size="9.5" fill="#7b241c">14 嶓塚之山 → ★錨＝漢水源（西傾山—甘南）·沔＝漢水…</text>
<text x="1362" y="564" font-size="9.5" fill="#7b241c">15 天帝之山 → 甘南·杜衡（真實藥草）</text>
<text x="1362" y="581" font-size="9.5" fill="#7b241c">16 塗途之山 → 甘南—青海過渡·西南折點·毒鼠雙記</text>
<text x="1362" y="598" font-size="9.5" fill="#7b241c">17 黃山 → 青海東部紅層區·鸚鵡學舌·赤水＝紅層水系</text>
<text x="1362" y="616" font-size="9.5" fill="#7b241c">18 翠山 → ★錨＝青海湖以南·旄牛麢麝高寒動物群（盲評…</text>
<text x="1362" y="634" font-size="9.5" fill="#7b241c">19 騩山 → ★錨＝青海南山—日月山方向·錞于西海＝青海…</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自錢來之山（豫西—潼關方向）經華山（太華·削成而四方）、少華山（小華），沿秦嶺北麓—主脊西行——七溪北注渭河；大時之山＝渭/漢分水嶺（太白山—鰲山段）；嶓塚＝漢水</text>
