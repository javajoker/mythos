<text x="1090" y="302" font-size="10" fill="#666">借名警示：本經為後世中國地理命名的最大借名輸出端（太華/渭/洛/漢/沔/嶓塚/南山/黃山/西海）——後世借名</text>
<text x="1090" y="316" font-size="10" fill="#666">方向，不得以同名反證；映射僅依屬性＋里程。</text>
<text x="1090" y="335" font-size="10" fill="#666">生態鏈證據：箭竹（7/8/17/18站）→猛豹/熊羆＝熊貓候選（12/14站）→旄牛麝鹿（18站高原動物群）→騩山臨西</text>
<text x="1090" y="350" font-size="10" fill="#666">海——自關中向高原的生態梯度。</text>
<text x="1090" y="368" font-size="10" fill="#666">三星堆（成都平原31°N）不在本經鏈條上（全程≥33.5°N）——建議留待中山經適配校準（F-0006）。</text>
<text x="1090" y="398.5" font-size="14" font-weight="bold" fill="#333">19 站 → 現實候選（審核中）</text>
<text x="1090" y="420" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 錢來之山</tspan>　→ 豫西—潼關丘陵</text>
<text x="1090" y="442" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 松果之山</tspan>　→ 潼關西·濩水注渭</text>
<text x="1090" y="463" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 太華之山</tspan>　→ 華山（削成四方·錨）</text>
<text x="1090" y="484" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 小華之山</tspan>　→ 少華山方向·紅腹錦雞</text>
<text x="1090" y="505" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 符禺之山</tspan>　→ 秦嶺北麓·陽銅陰鐵</text>
<text x="1090" y="526" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 石脆之山</tspan>　→ 流赭（赭石獸醫）</text>
<text x="1090" y="548" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 英山</tspan>　→ 箭竹帶·䰷魚</text>
<text x="1090" y="569" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 竹山</tspan>　→ 雙源·人魚＝大鯢·毫彘＝豪豬</text>
<text x="1090" y="590" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 浮山</tspan>　→ 薰草（香草民俗）</text>
<text x="1090" y="611" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 羭次之山</tspan>　→ 神山·金絲猴候選</text>
<text x="1090" y="633" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 時山</tspan>　→ 裸山·水玉</text>
<text x="1090" y="654" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 南山</tspan>　→ 猛豹＝熊貓候選·丹砂</text>
<text x="1090" y="675" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 大時之山</tspan>　→ 主脊分水（北渭南漢）</text>
<text x="1090" y="696" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 嶓塚之山</tspan>　→ 漢水源·犀兕熊羆·白翰赤鷩</text>
<text x="1090" y="717" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 天帝之山</tspan>　→ 杜衡藥草</text>
<text x="1090" y="739" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 塗途之山</tspan>　→ 西南折點·桂木·礜石毒鼠</text>
<text x="1090" y="760" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 黃山</tspan>　→ 鸚鵡（人舌能言）·西注赤水</text>
<text x="1090" y="781" font-size="11" fill="#7b241c"><tspan font-weight="bold">18 翠山</tspan>　→ 犛牛＋麝鹿</text>
<text x="1090" y="802" font-size="11" fill="#7b241c"><tspan font-weight="bold">19 騩山</tspan>　→ 巴顏喀拉·錞于西海（終點）</text>
<text x="60" y="590" font-size="11" fill="#666">推理說明：自錢來之山（潼關方向）沿秦嶺北麓西行——北麓七溪北注渭；竹山雙源（北渭/東南洛）；大時之山主脊分水（北渭南漢）；嶓塚漢水源；塗途之山西南折入川西高原（水系轉西南）；經黃山（鸚</text>
<text x="60" y="606" font-size="11" fill="#666">鵡）、翠山（犛牛麝鹿）至騩山——錞于西海（黃河源湖區候選A／青海湖候選B）。</text>
<text x="60" y="628" font-size="11" fill="#666">腿程 3,045 里≈1,172 km（0.385；原文自記 2,957 里，+3.0%）。太華—騩山淨位移擬合約 95%。所有對應為競爭假說，時代窗口 4000–1000 BCE；犀牛溫暖期北界、竹林北界、大鯢均為後期退出記錄</text>
<text x="60" y="644" font-size="11" fill="#666">。</text>
</svg>