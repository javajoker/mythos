<text x="1124" y="276" font-size="11" fill="#444">現代地點參照點</text>
<text x="1090" y="302" font-size="10" fill="#666">錨點傳播鏈（發起人裁定）：開羅（吉薩）→西次三經→西次二經→本經；本經無獨立錨點。鏈位＝傳播鄰接（騩山</text>
<text x="1090" y="316" font-size="10" fill="#666">≈91°E 與鈐山 90°E 相鄰）＋屬性 corroborate（太華削成四方＝邛崍山系；騩山錞于西海＝納木錯）。</text>
<text x="1090" y="335" font-size="10" fill="#666">借名純化：華山/渭/洛/漢/沔/嶓塚/南山/黃山/西海全部同名脫鉤——文本地理實為川西—藏東，後世以文本名命</text>
<text x="1090" y="350" font-size="10" fill="#666">名陝西地理（因果倒置最純粹案例，不依名反證）。</text>
<text x="1090" y="368" font-size="10" fill="#666">時代文明：卡若文化（昌都，5000–4000BP，窗口內）與嶓塚之山鏈位同域；三星堆不納入本經（交中山經校準</text>
<text x="1090" y="382" font-size="10" fill="#666">）。</text>
<text x="1090" y="413.0" font-size="14" font-weight="bold" fill="#333">19 站 → 現實候選（審核中）</text>
<text x="1090" y="435" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 錢來之山</tspan>　→ 成都平原西緣（東端）</text>
<text x="1090" y="456" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 松果之山</tspan>　→ 龍門山·濩水注渭</text>
<text x="1090" y="477" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 太華之山</tspan>　→ 邛崍山系花崗岩峰群</text>
<text x="1090" y="499" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 小華之山</tspan>　→ 邛崍西段·紅腹錦雞</text>
<text x="1090" y="520" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 符禺之山</tspan>　→ 夾金山方向</text>
<text x="1090" y="541" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 石脆之山</tspan>　→ 大雪山東緣·流赭</text>
<text x="1090" y="562" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 英山</tspan>　→ 大雪山系·箭竹</text>
<text x="1090" y="583" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 竹山</tspan>　→ 雙源·人魚＝大鯢·豪豬</text>
<text x="1090" y="605" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 浮山</tspan>　→ 薰草（香草民俗）</text>
<text x="1090" y="626" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 羭次之山</tspan>　→ 神山·川金絲猴</text>
<text x="1090" y="647" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 時山</tspan>　→ 裸山·水玉</text>
<text x="1090" y="668" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 南山</tspan>　→ 橫斷山北段·猛豹＝熊貓候選</text>
<text x="1090" y="689" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 大時之山</tspan>　→ 黃河—長江分水嶺</text>
<text x="1090" y="711" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 嶓塚之山</tspan>　→ 昌都方向·卡若文化帶</text>
<text x="1090" y="732" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 天帝之山</tspan>　→ 藏東·杜衡</text>
<text x="1090" y="753" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 塗途之山</tspan>　→ 藏東南·西南折點</text>
<text x="1090" y="774" font-size="11" fill="#7b241c"><tspan font-weight="bold">17 黃山</tspan>　→ 林芝方向·鸚鵡</text>
<text x="1090" y="795" font-size="11" fill="#7b241c"><tspan font-weight="bold">18 翠山</tspan>　→ 藏東牧區·犛牛麝鹿</text>
<text x="1090" y="817" font-size="11" fill="#7b241c"><tspan font-weight="bold">19 騩山</tspan>　→ 念青唐古拉—納木錯東緣（終點）</text>
<text x="60" y="590" font-size="11" fill="#666">推理說明：自錢來之山（成都平原西緣）沿川西高原—橫斷山北段西行——七溪北注渭（黃河河曲方向）；大時之山黃河—長江分水（巴顏喀拉）；嶓塚漢水源（昌都·卡若文化帶）；塗途西南折入藏東南；經黃</text>
<text x="60" y="606" font-size="11" fill="#666">山（鸚鵡北緣）、翠山（犛牛麝鹿）至騩山——錞于西海（納木錯候選A／色林錯候選B）。</text>
<text x="60" y="628" font-size="11" fill="#666">腿程 3,045 里≈1,172 km（0.385；原文自記 2,957 里）。太華—騩山淨位移擬合約 94%；騩山鏈位與納木錯幾乎重合；騩山與鈐山（西次二經 v2 起點）相距約 140 km——兩經端點相鄰。所有對應為競</text>
<text x="60" y="644" font-size="11" fill="#666">爭假說，時代窗口 4000–1000 BCE。</text>
</svg>