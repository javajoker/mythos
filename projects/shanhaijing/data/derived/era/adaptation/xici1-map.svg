<text x="1090" y="258" font-size="10" fill="#666">嚴格走向重校準（adapt-xici1-5，2026-10-29）：西×17＋西南×1，18腿方位零違背（容差錐±22.5°）——</text>
<text x="1090" y="272" font-size="10" fill="#666">修正版B走廊與逐站裁量全部維持，僅中段鋸齒坐標拉直（大時回走廊正線；嶓塚—天帝—塗途—黃山—翠山改西</text>
<text x="1090" y="287" font-size="10" fill="#666">—西南單調）。</text>
<text x="1090" y="306" font-size="10" fill="#666">修正版 B（項目負責人裁決 2026-10-28）：v1/v3（華山—秦嶺—青海湖）否決——走向/距離不對；太華＝華</text>
<text x="1090" y="320" font-size="10" fill="#666">山屬因果倒置錨定；秦嶺已由中山經覆蓋。T-RT05 遮蔽重判已做，但發起人否決了盲評結論的走向（走向/距離</text>
<text x="1090" y="334" font-size="10" fill="#666">不符），實驗記錄存檔；v1/v3 讀法降 rejected_rival_T-RT05-reversed 存冊不刪。</text>
<text x="1090" y="353" font-size="10" fill="#666">禹貢簇（渭/漢水/沔/洛諸注記）＝層累覆寫——晚出層流變註記，不作定位證據（發起人：『山海經成書於夏商</text>
<text x="1090" y="368" font-size="10" fill="#666">，遠早於漢，今名不足取』）；嶓塚『漢水出焉東南流注于沔』如實記層累噪聲，不附會。太華＝橫斷山刃脊銳峰</text>
<text x="1090" y="382" font-size="10" fill="#666">（『削成而四方』＝刀削岩峰通用語義讀法，不定點）。</text>
<text x="1090" y="400" font-size="10" fill="#666">置信度上限 medium。里程：自記 2,957 里 vs 腿程 3,045 里（+3.0%）；腿程 1,066／1,172／1,279 km（</text>
<text x="1090" y="415" font-size="10" fill="#666">0.35/0.385/0.42 三檔）vs 錢來→納木錯位移 ≈1,010 km——+5%／+16%／+27%（全檔放大 ✓）；腿 16→</text>
<text x="1090" y="430" font-size="10" fill="#666">17／17→18／18→19（藏東南—藏北折段）比率 0.47／0.31／0.35 &lt;1——記 variant 不靜默。</text>
<text x="1090" y="448" font-size="10" fill="#666">卡若文化同域覆蓋保留（站 15 天帝之山＝藏東昌都方向）；翠山旄牛麢麝＝藏北高原邊緣動物群 ✓；椶枏（站</text>
