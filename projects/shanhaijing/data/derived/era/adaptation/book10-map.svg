<text x="1090" y="291" font-size="10" fill="#666">借名警示：甌/閩/桂林/番禺/鬱水/湘陵/湘水/蒼梧/舜葬/丹陽/氐/匈奴——後世坐實名一律不作反證（歷史演</text>
<text x="1090" y="306" font-size="10" fill="#666">變優先）。</text>
<text x="1090" y="324" font-size="10" fill="#666">conflict 雙假說：狌狌（南一長臂猿 vs 本卷猩猩母題）｜弱水（西四 WAT:SHJ-02-4-002 vs 本卷西南內流</text>
<text x="1090" y="338" font-size="10" fill="#666">）｜匈奴·開題·列人（本卷西北 vs 海內北錯簡）。</text>
<text x="1090" y="357" font-size="10" fill="#666">西向輻輳鏈：蒼梧（湘南借名錨）→狌狌→犀牛→窫窳/弱水→建木→氐人國，自湘南向緬孟—喜馬拉雅東段推進</text>
<text x="1090" y="372" font-size="10" fill="#666">——框架書遠方指向，不作里程裁決。</text>
<text x="1090" y="406.0" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="428" font-size="9.5" fill="#d68910">甌 → 浙南沿海島嶼方向（借名）</text>
<text x="1090" y="446" font-size="9.5" fill="#d68910">閩 → 閩江—福建沿海（借名；西北有山≈武夷方向）</text>
<text x="1090" y="463" font-size="9.5" fill="#c0392b">三天子鄣山 → 皖南—浙西方向（一曰在海中）</text>
<text x="1090" y="480" font-size="9.5" fill="#d68910">桂林八樹 → 桂中—桂東（借名）</text>
<text x="1090" y="498" font-size="9.5" fill="#d68910">番隅 → 珠三角方向（番禺借名）</text>
<text x="1090" y="516" font-size="9.5" fill="#d68910">鬱水 → 西江—鬱江方向（借名）</text>
<text x="1090" y="533" font-size="9.5" fill="#d68910">湘陵 → 湘桂交界（鬱水源；借名）</text>
<text x="1090" y="550" font-size="9.5" fill="#8e44ad">伯慮國 → 桂南—越北方向</text>
<text x="1090" y="568" font-size="9.5" fill="#8e44ad">離耳國 → 海南島（儋耳）方向</text>
<text x="1090" y="586" font-size="9.5" fill="#8e44ad">雕題國 → 雷州—海南（紋面俗）</text>
<text x="1090" y="603" font-size="9.5" fill="#8e44ad">北朐國 → 桂西—滇東南方向</text>
<text x="1090" y="620" font-size="9.5" fill="#8e44ad">梟陽國 → 滇東—桂西（北朐之西）</text>
<text x="1090" y="638" font-size="9.5" fill="#d68910">蒼梧之山·舜葬 → 湘南九嶷方向（借名警示）</text>
<text x="1090" y="656" font-size="9.5" fill="#1e8449">湘水·洞庭 → 復用中十二瀟湘之淵（WAT:SHJ-05-12-007#…</text>
<text x="1362" y="428" font-size="9.5" fill="#8e44ad">兕之地 → 湘南（舜葬東·湘水南）</text>
<text x="1362" y="446" font-size="9.5" fill="#8e44ad">巴·孟涂 → 川東—鄂西（神判風俗；巴借名）</text>
<text x="1362" y="463" font-size="9.5" fill="#c0392b">丹山 → 渝東—鄂西丹砂帶方向</text>
<text x="1362" y="480" font-size="9.5" fill="#8e44ad">氾林 → 狌狌東三百里（緬北—滇西林帶）</text>
<text x="1362" y="498" font-size="9.5" fill="#1e8449">狌狌之地 → 復用南一招搖之山（若開北段）</text>
<text x="1362" y="516" font-size="9.5" fill="#8e44ad">犀牛之地 → 狌狌西北（緬北—孟加拉東）</text>
<text x="1362" y="533" font-size="9.5" fill="#c0392b">窫窳·弱水 → 狌狌西（弱水 conflict 雙假說）</text>
<text x="1362" y="550" font-size="9.5" fill="#8e44ad">建木 → 窫窳西弱水上（神樹地標）</text>
<text x="1362" y="568" font-size="9.5" fill="#8e44ad">氐人國 → 建木西（恆河—布河下游方向）</text>
<text x="1362" y="586" font-size="9.5" fill="#8e44ad">巴蛇之地 → 犀牛西（孟加拉方向；食象蟒）</text>
<text x="1362" y="603" font-size="9.5" fill="#8e44ad">旄馬之地 → 巴蛇西北·高山南</text>
<text x="1362" y="620" font-size="9.5" fill="#1e8449">高山 → 復用西二高山（錫金·大吉嶺段）</text>
<text x="1362" y="638" font-size="9.5" fill="#c0392b">匈奴·開題·列人 → 方位存疑（或屬海內北錯簡）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：本卷為區域調查（非里程鏈）——沿海帶（甌居海中、閩在海中其西北有山、三天子鄣山在閩西海北）→嶺南帶（桂林八樹在番隅東；鬱水出湘陵南入海，其南四國：伯慮/離耳/雕題</text>
<text x="60" y="702" font-size="11" fill="#666">/北朐；梟陽在北朐西）→湘南錨（兕在舜葬東湘水南；蒼梧之山帝舜葬陽帝丹朱葬陰——借名警示）→西向輻輳鏈（氾林在狌狌東→狌狌在舜葬西→犀牛在狌狌西北→窫窳居弱水中在狌狌西→</text>
<text x="60" y="718" font-size="11" fill="#666">建木在窫窳西弱水上→氐人國在建木西；支鏈：巴蛇在犀牛西→旄馬在巴蛇西北高山南）；巴域支（孟涂司神于巴、血衣神判、居丹山西）。</text>
