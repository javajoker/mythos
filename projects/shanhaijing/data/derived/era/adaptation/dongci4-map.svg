<text x="1090" y="258" font-size="10" fill="#666">嚴格走向重校準（adapt-dongci4-2）：末二腿（子桐→剡山→太山）經文「又東北」——舊站位偏北/西北出錐</text>
<text x="1090" y="272" font-size="10" fill="#666">，重配佛州東岸—布里瓦德（剡山）→聖約翰斯河上游源流區（太山·鉤水北注勞水＝聖約翰斯河北流硬合）；8 </text>
<text x="1090" y="287" font-size="10" fill="#666">腿零違背。</text>
<text x="1090" y="306" font-size="10" fill="#666">T-RT21 新候選（2026-10-27）：全鏈＝佛羅里達半島——「臨于北海」＝墨西哥灣（自半島中軸視角灣在北—</text>
<text x="1090" y="320" font-size="10" fill="#666">西北，寬讀）；「食水出焉東北注海」＝聖約翰斯河（源出半島中東部、北流約 500 km 轉東北注大西洋 ✓）；</text>
<text x="1090" y="334" font-size="10" fill="#666">R5 舊主/對立候選（灣北岸／尤卡坦北岸）廢棄存冊。</text>
<text x="1090" y="353" font-size="10" fill="#666">食水同名異實（F-0022）：東一＝東二＝聖勞倫斯河（同實例）／東四＝聖約翰斯河——「食水」＝可漁食之水</text>
<text x="1090" y="368" font-size="10" fill="#666">類名，各實例各立。</text>
<text x="1090" y="386" font-size="10" fill="#666">里程：腿程 1,720 里＝自記（0%）；三檔：0.35≈602 km／0.385≈662 km／0.42≈722 km vs 半島縱深 ~7</text>
<text x="1090" y="400" font-size="10" fill="#666">00 km ≈1:1。網格＝否定工具（G-3）；末段網格出半島入大西洋記 variant，鏈位為走廊擬合（fit_coords</text>
<text x="1090" y="415" font-size="10" fill="#666"> 僅繪圖）。</text>
<text x="1090" y="434" font-size="10" fill="#666">水系拓扑：西坡西流（蒼體之水）、東坡東北注海（泚水）、北向匯湖（師水→皋澤＝奧基喬比湖）、西向入沼（</text>
<text x="1090" y="448" font-size="10" fill="#666">子桐之水→餘如之澤＝大沼澤地）、終點北流（鉤水→勞水＝聖約翰斯河中游）。</text>
<text x="1090" y="466" font-size="10" fill="#666">蜚（太山）＝災疫獸；當康（欽山）＝豐年吉兆；「食之不瘧」R1 反證留痕（詞義層交 textual-critic）；全</text>
<text x="1090" y="481" font-size="10" fill="#666">鏈置信 low/low_medium 上限（待 T-RT05 遮蔽）。</text>
<text x="1090" y="515.5" font-size="14" font-weight="bold" fill="#333">8 站 → 現實候選（審核中）</text>
<text x="1090" y="538" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 北號之山</tspan>　→ 臨北海＝墨西哥灣（北—西北）；食水＝聖約翰斯河｜⛰半島北部（奧卡拉方向）</text>
<text x="1090" y="559" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 旄山</tspan>　→ 蒼體之水西流（西坡排水✓）｜⛰半島中北部（高地湖區）</text>
<text x="1090" y="580" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 東始之山</tspan>　→ 𦬊樹汁如血；泚水東北注海｜⛰半島中部（湖區南段）</text>
<text x="1090" y="601" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 女烝之山</tspan>　→ 石膏水（礦物名直書）｜⛰半島中南部（奧基喬比方向）</text>
<text x="1090" y="622" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 欽山</tspan>　→ 師水北注皋澤＝奧基喬比湖；當康豐年兆｜⛰半島南部</text>
<text x="1090" y="644" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 子桐之山</tspan>　→ 子桐之水西注大沼澤地；䱻魚有光｜⛰半島東南岸</text>
<text x="1090" y="665" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 剡山</tspan>　→ 合窳食人（東岸折返腿）｜⛰佛州東岸（印第安河潟湖）</text>
<text x="1090" y="686" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 太山</tspan>　→ 蜚＝災疫獸；鉤水注勞水＝北流水系✓｜⛰聖約翰斯河中游（終點）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自北號之山（佛州半島北部—奧卡拉/蓋恩斯維爾方向；臨北海＝墨西哥灣、食水＝聖約翰斯河）沿半島中軸南行——中部高地湖區（旄山·西坡排水）→湖區南段（東始·𦬊樹汁如血</text>
<text x="60" y="702" font-size="11" fill="#666">＋泚水東北注海）→奧基喬比方向（女烝·石膏水）→奧基喬比湖南（欽山·師水北注皋澤＋當康豐年兆）→東南岸（子桐·西注大沼澤地·䱻魚有光）→東北折返東岸（剡山·合窳食人）→太山（</text>
<text x="60" y="718" font-size="11" fill="#666">聖約翰斯河中游方向終點：鉤水北注勞水·蜚災疫）。</text>
<text x="60" y="740" font-size="11" fill="#666">腿程 1,720 里≈662 km（0.385）＝自記（0%）；vs 半島縱深 ~700 km ≈1:1。東山經全書 46 山閉合（12+17+9+8）；自記 18,860 vs 腿程 18,460（+400 variant 待校）。v2＝202</text>
<text x="60" y="756" font-size="11" fill="#666">6-10-27 方案（T-RT21 佛羅里達重配版；舊灣北岸/尤卡坦候選廢棄存冊）。所有對應為競爭假說，時代窗口 4000–1000 BCE。</text>
