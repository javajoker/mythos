<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：樕𧑤之山「北臨乾昧」＋食水東北流注于海——大水域在北＋溪流東北入海＝阿巴拉契亞北端—緬因方向</text>
<text x="1090" y="272" font-size="10" fill="#666">；不依任何名稱。</text>
<text x="1090" y="291" font-size="10" fill="#666">里程：腿程 3,500 里 vs 自記 3,600 里（+2.9% variant，層累極輕）；全鏈純南向。</text>
<text x="1090" y="310" font-size="10" fill="#666">神群皆人身龍首；祠：毛用一犬祈、䎶用魚——犬牲＋魚祭＝濱海漁獵生業風物。</text>
<text x="1090" y="328" font-size="10" fill="#666">泰山/江/沔與中國山水同名——借名標記，不作證。</text>
<text x="1090" y="362.5" font-size="14" font-weight="bold" fill="#333">12 站 → 現實候選（審核中）</text>
<text x="1090" y="384" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 樕𧑤之山</tspan>　→ 緬因北部（起點錨；北臨乾昧）｜⛰阿巴拉契亞·卡塔丁山方向</text>
<text x="1090" y="406" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 藟山</tspan>　→ 緬因中部（湖水→食水；活師）｜⛰阿巴拉契亞·緬因段</text>
<text x="1090" y="427" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 栒狀之山</tspan>　→ 新罕布什爾方向（箴魚＝頜針魚）｜⛰阿巴拉契亞·白山段</text>
<text x="1090" y="448" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 勃亝之山</tspan>　→ 裸岩無水｜⛰阿巴拉契亞·佛蒙特綠山段</text>
<text x="1090" y="469" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 番條之山</tspan>　→ 多沙；減水北注海｜⛰阿巴拉契亞·新英格蘭南段</text>
<text x="1090" y="490" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 姑兒之山</tspan>　→ 漆桑柘（暖溫帶生業）｜⛰阿巴拉契亞·哈德遜高地段</text>
<text x="1090" y="512" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 高氏之山</tspan>　→ 玉＋箴石；諸繩之水注澤｜⛰阿巴拉契亞·賓州嶺谷段</text>
<text x="1090" y="533" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 嶽山</tspan>　→ 桑樗；濼水注澤｜⛰阿巴拉契亞·弗吉尼亞段</text>
<text x="1090" y="554" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 犲山</tspan>　→ 下多水；夸父形彘毛獸（大水兆）｜⛰阿巴拉契亞·西弗吉尼亞段</text>
<text x="1090" y="575" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 獨山</tspan>　→ 𧌁䗤（黃蛇魚翼有光·大旱兆）｜⛰阿巴拉契亞·藍嶺段</text>
<text x="1090" y="597" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 泰山</tspan>　→ 狪狪（豚形有珠）；環水注江（泰山/江＝借名標記）｜⛰阿巴拉契亞·大霧山段</text>
<text x="1090" y="618" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 竹山</tspan>　→ 錞于江；瑤碧；茈羸（終點）｜⛰阿巴拉契亞·南段（佐治亞—阿拉巴馬）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自樕𧑤之山（緬因北部，北臨乾昧＝聖勞倫斯灣方向大水域）沿阿巴拉契亞主脊南行——緬因（藟山湖水注食水）→新罕布什爾白山（栒狀·箴魚頜針魚河口）→裸岩段（勃亝）→新</text>
<text x="60" y="702" font-size="11" fill="#666">英格蘭南段多沙（番條）→哈德遜高地（姑兒·漆桑柘）→賓州嶺谷（高氏·箴石）→弗吉尼亞（嶽山）→西弗吉尼亞（犲山·大水兆獸）→藍嶺（獨山·𧌁䗤旱兆）→大霧山（泰山·狪狪）→竹山</text>
<text x="60" y="718" font-size="11" fill="#666">（錞于江·南端終點）。</text>
<text x="60" y="740" font-size="11" fill="#666">腿程 3,500 里≈1,348 km（0.385）vs 自記 3,600 里（+2.9% variant）；阿巴拉契亞主脊緬因—佐治亞實距約 1,800 km——原始腿程與脊線長度同量級（未及 F-0008 下限，記為輕層</text>
<text x="60" y="756" font-size="11" fill="#666">累＋走向簡化）。所有對應為競爭假說，時代窗口 4000–1000 BCE；後世同名（泰山/江/沔）不作反證。</text>
</svg>