<text x="1090" y="258" font-size="10" fill="#666">拓撲錨（2026-10-27 方案）：樕𧑤之山自緬因微調至阿迪朗達克—魁北克南緣——「北臨乾昧」＝聖勞倫斯水</text>
<text x="1090" y="272" font-size="10" fill="#666">系（鬆動自 200–350 km 收斂至 60–100 km）＋「食水東北流注于海」＝聖勞倫斯河（北美東部唯一東北注海</text>
<text x="1090" y="287" font-size="10" fill="#666">大河，源流區落於錨域）；冰後海侵已退（尚普蘭海 10000–9000 BP），窗口期河口比今寬深。R9 消解。</text>
<text x="1090" y="306" font-size="10" fill="#666">湖水＝五大湖—安大略湖出流（東注食水 ✓）——掛水→湖水→食水→海三級嵌套落實；食水置信恢復 medium_</text>
<text x="1090" y="320" font-size="10" fill="#666">high（R9 獨立降級消解，留痕；G-2 遮蔽重測仍待 T-RT05）。</text>
<text x="1090" y="338" font-size="10" fill="#666">里程：腿程 3,500 里 vs 自記 3,600 里（+2.9% variant）；全鏈純南向（阿巴拉契亞主脊實為西南斜行，</text>
<text x="1090" y="353" font-size="10" fill="#666">走向簡化記 variant）。網格＝否定工具（G-3）。</text>
<text x="1090" y="372" font-size="10" fill="#666">神群皆人身龍首；祠牲按推論性裁決 (a) 不作定位證據（雙向）。</text>
<text x="1090" y="390" font-size="10" fill="#666">食水註冊更新：東二＝同實例（兩鏈同處聖勞倫斯南側流域）；東四＝聖約翰斯河——同名異實，F-0022 顯式拆</text>
<text x="1090" y="404" font-size="10" fill="#666">分（「食水」＝可漁食之水類名）。</text>
<text x="1090" y="439.0" font-size="14" font-weight="bold" fill="#333">12 站 → 現實候選（審核中）</text>
<text x="1090" y="461" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 樕𧑤之山</tspan>　→ 阿迪朗達克（起點錨；食水＝聖勞倫斯河）｜⛰阿巴拉契亞·阿迪朗達克段</text>
<text x="1090" y="482" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 藟山</tspan>　→ 紐約州段（湖水＝五大湖—安大略湖出流注食水）｜⛰阿巴拉契亞·紐約州段</text>
<text x="1090" y="503" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 栒狀之山</tspan>　→ 哈德遜高地（掛水注湖水；箴魚＝頜針魚）｜⛰阿巴拉契亞·哈德遜高地段</text>
<text x="1090" y="525" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 勃亝之山</tspan>　→ 裸岩無水｜⛰阿巴拉契亞·賓州東部段</text>
<text x="1090" y="546" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 番條之山</tspan>　→ 多沙；減水北注海｜⛰阿巴拉契亞·賓州—新澤西段</text>
<text x="1090" y="567" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 姑兒之山</tspan>　→ 漆桑柘（暖溫帶生業）｜⛰阿巴拉契亞·馬里蘭—波托馬克段</text>
<text x="1090" y="588" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 高氏之山</tspan>　→ 玉＋箴石；諸繩之水注澤｜⛰阿巴拉契亞·弗吉尼亞段</text>
<text x="1090" y="609" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 嶽山</tspan>　→ 桑樗；濼水注澤｜⛰阿巴拉契亞·弗吉尼亞西南段</text>
<text x="1090" y="631" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 犲山</tspan>　→ 下多水；夸父形彘毛獸（大水兆）｜⛰阿巴拉契亞·北卡段（藍嶺方向）</text>
<text x="1090" y="652" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 獨山</tspan>　→ 𧌁䗤（黃蛇魚翼有光·大旱兆）｜⛰阿巴拉契亞·北卡—南卡段</text>
<text x="1090" y="673" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 泰山</tspan>　→ 狪狪（豚形有珠）；環水注江（泰山/江＝借名標記）｜⛰阿巴拉契亞·佐治亞—南卡段</text>
<text x="1090" y="694" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 竹山</tspan>　→ 錞于江；瑤碧；茈羸（終點）｜⛰阿巴拉契亞·南段（佐治亞—阿拉巴馬）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自樕𧑤之山（阿迪朗達克—魁北克南緣，乾昧＝聖勞倫斯水系、食水＝聖勞倫斯河）沿阿巴拉契亞主脊南行——紐約州段（藟山·湖水＝五大湖—安大略湖出流注食水）→哈德遜高地</text>
<text x="60" y="702" font-size="11" fill="#666">—卡茨基爾（栒狀·掛水注湖水·箴魚頜針魚）→賓州東部裸岩段（勃亝）→賓州—新澤西多沙段（番條）→馬里蘭—波托馬克（姑兒·漆桑柘）→弗吉尼亞（高氏/嶽山·入澤溪）→北卡藍嶺（犲</text>
<text x="60" y="718" font-size="11" fill="#666">山·大水兆獸）→北卡—南卡（獨山·𧌁䗤旱兆）→佐治亞—南卡（泰山·狪狪）→竹山（錞于江·南端終點）。</text>
<text x="60" y="740" font-size="11" fill="#666">腿程 3,500 里≈1,348 km（0.385）vs 自記 3,600 里（+2.9% variant）；阿巴拉契亞主脊阿迪朗達克—佐治亞實距約 1,800 km——原始腿程與脊線長度同量級（層累約 1.3×＋走向簡</text>
<text x="60" y="756" font-size="11" fill="#666">化，記 variant）。所有對應為競爭假說，時代窗口 4000–1000 BCE；後世同名（泰山/江/沔）不作反證。v3＝2026-10-27 方案（R9 消解版）。</text>
