<text x="1124" y="232" font-size="11" fill="#444">現代地點參照點</text>
<text x="1090" y="258" font-size="10" fill="#666">錨定方式（F-0020 已裁決 2026-10-27；名稱污染回退 2026-10-28，methodology-spec §3.9）：終點拓撲</text>
<text x="1090" y="272" font-size="10" fill="#666">錨＝陽虛之山臨玄扈之水（河洛之間區域級——『陽虛在河洛之間』由良餘之山分注河/洛獨立成立；T-RT05 洛</text>
<text x="1090" y="287" font-size="10" fill="#666">寧點位係傳世地名＋倉頡傳說附著，反哺嫌疑最高，今名不作定位證據——撤回降 rival；黃河三門峽—孟津讀</text>
<text x="1090" y="302" font-size="10" fill="#666">法恢復並列 rival；中四/中五共享水體、兩鏈夾河洛東西對列結構不變）；起點苟牀之山＝秦嶺東段主脊（小秦</text>
<text x="1090" y="316" font-size="10" fill="#666">嶺—華山方向），pending_anchor 解除；全鏈置信度上限 medium（陽虛/玄扈確指層 low_medium）。</text>
<text x="1090" y="334" font-size="10" fill="#666">里程代價如實記：腿程 2,990 里 vs 起訖實距約 150–300 km——超帶（約 4–8×），記「核心區層累放大</text>
<text x="1090" y="349" font-size="10" fill="#666">」variant 待裁（同一文化核心區反覆踏查、接力轉寫造成局部注水）；里程層不作證據。</text>
<text x="1090" y="368" font-size="10" fill="#666">名稱不作錨：朝歌/歷山/首山/苟林均為借名標記；證據順序＝水系拓扑→山勢走向→人文風物。</text>
<text x="1090" y="386" font-size="10" fill="#666">「凡十六山」vs 15 站：「十六」疑訛，卷末 197 山核算支持 15 站（紅隊處置 D3）；苟林/苟牀異文。</text>
<text x="1090" y="420.5" font-size="14" font-weight="bold" fill="#333">15 站 → 現實候選（審核中）</text>
<text x="1090" y="442" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 苟牀之山</tspan>　→ 秦嶺東段主脊（起點·F-0020）｜⛰小秦嶺主脊—華山方向</text>
<text x="1090" y="464" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 首山</tspan>　→ 䰠級聖山｜⛰小秦嶺東段—崤山西段</text>
<text x="1090" y="485" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 縣劚之山</tspan>　→ 文石裸山｜⛰崤山·西段</text>
<text x="1090" y="506" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 蔥聾之山</tspan>　→ 𢈦石裸山（與中一同名異實）｜⛰崤山·西段</text>
<text x="1090" y="527" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 條谷之山</tspan>　→ 芍藥虋冬藥草（東北折）｜⛰崤山南麓—熊耳山北麓</text>
<text x="1090" y="548" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 超山</tspan>　→ 季節泉井（冬水夏竭）｜⛰熊耳山—崤山</text>
<text x="1090" y="570" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 成侯之山</tspan>　→ 櫄木芃草（借名）｜⛰崤山山嶺</text>
<text x="1090" y="591" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 朝歌之山</tspan>　→ 美堊（借名）｜⛰崤山—澠池山嶺</text>
<text x="1090" y="612" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 槐山</tspan>　→ 金錫（小秦嶺—崤山成礦帶）｜⛰崤山北麓·黃河南岸</text>
<text x="1090" y="633" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 歷山</tspan>　→ 槐玉（借名）｜⛰崤山山嶺</text>
<text x="1090" y="655" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 尸山</tspan>　→ 尸水合天祭｜⛰崤山·中段</text>
<text x="1090" y="676" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 良餘之山</tspan>　→ 雙源分水（河/洛）｜⛰崤山·主脊</text>
<text x="1090" y="697" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 蠱尾之山</tspan>　→ 礪石赤銅｜⛰崤山·中段</text>
<text x="1090" y="718" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 升山</tspan>　→ 冢級·黃酸之水北注河｜⛰崤山·北段黃河南岸</text>
<text x="1090" y="739" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 陽虛之山</tspan>　→ 臨玄扈之水（終點錨·區域級；洛寧撤回）｜⛰黃河南岸區域位</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自苟牀之山（秦嶺東段主脊·小秦嶺—華山方向，無草木多怪石）東行——崤山—熊耳山（條谷藥草帶·超山季節井）→崤山北麓—黃河南岸（槐山金錫）→崤山集群（尸山合天祭·良</text>
<text x="60" y="702" font-size="11" fill="#666">餘雙源分水·升山冢）→陽虛之山臨玄扈之水（河洛之間區域級，終點；洛寧點位撤回——名稱污染回退 2026-10-28）。算術鏈西段（站1–8）為超帶偽影，不作地理證據。</text>
