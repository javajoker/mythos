<text x="1090" y="258" font-size="10" fill="#666">起始座標錨：西三昆侖之丘＝吉薩（開羅）——自此向東反推西二/西一、向西展開西四（發起人裁定推理主軸）</text>
<text x="1090" y="272" font-size="10" fill="#666">。</text>
<text x="1090" y="291" font-size="10" fill="#666">里程與方位以水系拓扑→山勢走向→人文風物為序；後世同名（陰山/天山等）借名標記不作反證。</text>
<text x="1090" y="310" font-size="10" fill="#666">西二與西三之間的兩河空檔（72.5°E→38.5°E）由框架書承擔（F-0007）。</text>
<text x="1090" y="344.0" font-size="14" font-weight="bold" fill="#333">子經鏈 → 現實區域（審核中）</text>
<text x="1090" y="366" font-size="11" fill="#8e44ad"><tspan font-weight="bold">西一·錢來鏈</tspan>（19 站）→ 橫斷山北段—藏東（昌都方向；卡若文化同域；天帝—翠山段納木錯終點）</text>
<text x="1090" y="387" font-size="11" fill="#9b59b6"><tspan font-weight="bold">西二·鈐山鏈</tspan>（17 站）→ 喜馬拉雅東段南麓→印度河中游（古印度·哈拉帕方向；犀牛西界鎖定）</text>
<text x="1090" y="408" font-size="11" fill="#6c3483"><tspan font-weight="bold">西三·崇吾鏈</tspan>（23 站）→ 希斯馬高原→吉薩（昆侖之丘＝開羅·座標錨）→錫瓦綠洲—利比亞（西王母·三危）</text>
<text x="1090" y="430" font-size="11" fill="#af7ac5"><tspan font-weight="bold">西四·陰山鏈</tspan>（19 站）→ 紹拉河谷→阿特拉斯主脊（鳥鼠同穴集水嶺）→蘇斯河口（崦嵫日落）入大西洋</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：《西山經》四鏈自東而西——西一（錢來之山→騩山：橫斷山北段—藏東，昌都/卡若方向，天帝—翠山段臨納木錯）→西二（鈐山→萊山：喜馬拉雅東段南麓—特萊帶→印度河中游</text>
<text x="60" y="702" font-size="11" fill="#666">，犀牛西界止於印度河＝物種鎖定）→西三（崇吾之山→翼望之山：希斯馬高原→昆侖之丘＝吉薩·金字塔台地與陵寢格局＋人面獸身造像→錫瓦綠洲玉山·西王母→哈魯傑火山原三危→利比亞段</text>
<text x="60" y="718" font-size="11" fill="#666">）→西四（陰山→崦嵫之山：紹拉河谷→阿特拉斯集水嶺（鳥鼠同穴）→蘇斯河口日落入大西洋）。</text>
<text x="60" y="740" font-size="11" fill="#666">概要圖站位＝各子經算術網格（層累已記於各經 variant）；比例尺 0.35/0.385/0.42 帶。所有對應為競爭假說，時代窗口 4000–1000 BCE；靜態形狀優先、禁止因果倒置、詞義通用、文</text>
<text x="60" y="756" font-size="11" fill="#666">化斷層四原則適用全圖。</text>
</svg>