<text x="1090" y="258" font-size="10" fill="#666">框架：海外自東南陬至東北陬——區域調查無里程鏈，以「在其北」相對方位組織；整體走向為方向性假設。</text>
<text x="1090" y="276" font-size="10" fill="#666">復用：東海＝南一箕尾尾踆之東海（南海方向）；青丘國＝南一青丘之山（同名＋九尾狐）；九尾狐同節點。</text>
<text x="1090" y="295" font-size="10" fill="#666">conflict：青丘國 H2（東方青丘國候選——朝鮮半島—九州方向）；湯谷與西三溫泉湯谷同名異實（不合併）</text>
<text x="1090" y="310" font-size="10" fill="#666">；黑齒國雲貴對立候選。</text>
<text x="1090" y="328" font-size="10" fill="#666">借名警示：堯葬（帝系層累）、扶桑（後世指日本）——後世記錄不作時代證；十日/句芒/豎亥＝神話層。</text>
<text x="1090" y="362.5" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="384" font-size="11" fill="#8e44ad">𨲠丘（嗟丘） → 南海島嶼方向（西沙—海南東）·兩山夾丘·百果</text>
<text x="1090" y="406" font-size="11" fill="#8e44ad">大人國 → 台灣—呂宋方向·坐而削船</text>
<text x="1090" y="427" font-size="11" fill="#d35400">奢比之尸 → 琉球南段方向·珥蛇神像（神話層）</text>
<text x="1090" y="448" font-size="11" fill="#8e44ad">君子國 → 琉球北段—奄美方向·衣冠帶劍好讓</text>
<text x="1090" y="469" font-size="11" fill="#8e44ad">𧈫𧈫（雙首） → 九州南方向·雙首記錄</text>
<text x="1090" y="490" font-size="11" fill="#8e44ad">朝陽之谷 → 九州東岸—日向灘·水伯天吳</text>
<text x="1090" y="512" font-size="11" fill="#c0392b">青丘國 → 復用南一青丘之山（老撾—長山北段）·方位存疑</text>
<text x="1090" y="533" font-size="11" fill="#8e44ad">黑齒國 → 九州—對馬方向·黑齒習俗＋稻作＋使蛇</text>
<text x="1090" y="554" font-size="11" fill="#d35400">湯谷·扶桑 → 太平洋日出方向·十日所浴（神話層）</text>
<text x="1090" y="575" font-size="11" fill="#8e44ad">雨師妾國 → 本州東岸—關東方向·操蛇珥蛇</text>
<text x="1090" y="597" font-size="11" fill="#8e44ad">玄股之國 → 本州東北—三陸沿岸·衣魚食䳼使鳥</text>
<text x="1090" y="618" font-size="11" fill="#8e44ad">毛民之國 → 北海道—北日本方向·身生毛</text>
<text x="1090" y="639" font-size="11" fill="#8e44ad">勞民國 → 千島—堪察加方向·東北陬終端</text>
<text x="1090" y="660" font-size="11" fill="#d35400">東方句芒 → 東方方位神（神話層）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：𨲠丘（一曰嗟丘：南海島嶼·兩山夾丘·百果）→大人國（台灣—呂宋·坐而削船）→奢比之尸（琉球南·珥蛇神像）→君子國（琉球北·衣冠帶劍好讓）→𧈫𧈫（雙首蟲）→朝陽之谷（</text>
<text x="60" y="702" font-size="11" fill="#666">九州東岸·水伯天吳）→青丘國（復用南一青丘之山：老撾—長山北段，同名＋九尾狐；方位存疑 H2 待裁）→黑齒國（九州—對馬·黑齒習俗＋稻作＋使蛇）→湯谷扶桑（太平洋日出方向·十日</text>
<text x="60" y="718" font-size="11" fill="#666">所浴——神話層）→雨師妾（本州東岸·操蛇珥蛇）→玄股（三陸沿岸·衣魚食䳼使鳥）→毛民（北海道方向·身生毛）→勞民（千島—堪察加方向·東北陬終端）→東方句芒（方位神·神話層）。</text>
<text x="60" y="740" font-size="11" fill="#666">本卷為區域調查（無里程鏈）：復用 3（東海/青丘國/九尾狐）＋pending_anchor 13＋新增 17。所有對應為競爭假說（proposed_pending_review），時代窗口 4000–1000 BCE；堯葬/</text>
<text x="60" y="756" font-size="11" fill="#666">扶桑借名警示，湯谷與西三湯谷同名異實（F-0003 衝突對側登記），pending_anchor 僅方向性候選不編造坐標。</text>
</svg>