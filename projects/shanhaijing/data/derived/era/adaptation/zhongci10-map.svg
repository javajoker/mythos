<text x="1090" y="258" font-size="10" fill="#666">弱錨：無水系——僅憑位置候選與鄰接校準；首陽山為借名標記（多處同名）。</text>
<text x="1090" y="276" font-size="10" fill="#666">總結段堵山（冢）/騩山（帝）不見於9站——疑竄文 variant，交 textual-critic。</text>
<text x="1090" y="295" font-size="10" fill="#666">腿程310里≈120km——中山經最短鏈；龍身人面神群。</text>
<text x="1090" y="314" font-size="10" fill="#666">窗口放大至 2.3° 經度跨度（比例尺自適應為 10 km 段）；鏈條實長僅約 120 km。</text>
<text x="1090" y="348.0" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="370" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 首陽之山</tspan>　→ 渭源—臨洮方向候選（弱錨起點·借名）｜⛰西秦嶺·渭源段</text>
<text x="1090" y="391" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 虎尾之山</tspan>　→ 臨洮西方向·赤金/鐵分帶｜⛰太子山·北段</text>
<text x="1090" y="412" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 繁繢之山</tspan>　→ 臨洮西南方向（西南折點）｜⛰太子山·中段</text>
<text x="1090" y="434" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 勇石之山</tspan>　→ 甘南東·白金多水｜⛰太子山·南段</text>
<text x="1090" y="455" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 復州之山</tspan>　→ 甘南東·跂踵疫鳥｜⛰太子山·南段—甘南東山嶺</text>
<text x="1090" y="476" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 楮山</tspan>　→ 甘南東·寓木椒椐柘堊｜⛰甘南高原東緣山嶺</text>
<text x="1090" y="497" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 又原之山</tspan>　→ 甘南方向·青雘鐵鸜鵒｜⛰甘南高原·合作北山嶺</text>
<text x="1090" y="518" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 涿山</tspan>　→ 甘南方向·㻬琈之玉｜⛰甘南高原·合作段</text>
<text x="1090" y="540" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 丙山</tspan>　→ 甘南—合作方向（終點）｜⛰甘南高原·合作西段</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自首陽之山（渭源—臨洮方向候選，金玉無草木——弱錨起點、借名標記）沿西—西南短腿下行：臨洮西（虎尾）→臨洮西南（繁繢）→甘南東（勇石·復州·楮）→甘南（又原·涿）</text>
<text x="60" y="702" font-size="11" fill="#666">→丙山（甘南—合作方向，終點）。全鏈無水系記錄（本身即特徵）；勇石之山「多水」為唯一水文詞。</text>
<text x="60" y="724" font-size="11" fill="#666">腿程 310 里≈109–130 km（0.35–0.42）；自記 267 里——層累 +16%；鏈形迂迴度≈1.06（層累極輕）。總結段堵山（冢）/騩山（帝）不見於 9 站——疑竄文 variant。所有對應為競</text>
<text x="60" y="740" font-size="11" fill="#666">爭假說，時代窗口 4000–1000 BCE。</text>
</svg>