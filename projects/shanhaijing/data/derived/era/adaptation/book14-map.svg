<text x="1090" y="236" font-size="10" fill="#666">大荒東＝區域調查框架（非里程鏈）：東海＝太平洋方向框架海；日月所出諸山（大言/合虛/明星/鞠陵于天·東</text>
<text x="1090" y="250" font-size="10" fill="#666">極·離瞀/猗天蘇門/壑明俊疾）＝東方地平線觀測山標，方向性候選＝北美西部山地。</text>
<text x="1090" y="269" font-size="10" fill="#666">復用 2 項：青丘之國→南一青丘之山（九尾狐屬性逐字互證）；招搖山→南一招搖之山（融水 vs 麗𪃨之水異文</text>
<text x="1090" y="284" font-size="10" fill="#666">記 conflict 待裁）。二者位中南半島方向，與東卷框架的方位張力已記衝突留審。</text>
<text x="1090" y="302" font-size="10" fill="#666">借名警示：少昊/顓頊/帝俊/帝舜/王亥/有易/夏州/嬴土等後世定位不反證本文；王亥—有易敘事與《天問》《竹</text>
<text x="1090" y="316" font-size="10" fill="#666">書》僅作類型學互證（associative 層）。</text>
<text x="1090" y="335" font-size="10" fill="#666">流波山入海七千里≈2,450–2,940 km（0.35–0.42 km/里敏感度區間，不作單值）——西北太平洋海山方向；</text>
<text x="1090" y="350" font-size="10" fill="#666">夔＝風暴雷電神獸化，與中九夔牛同名待裁。</text>
<text x="1090" y="368" font-size="10" fill="#666">女丑·大蟹（026，「海內」定位不明）與帝下兩壇（029，依附祭儀記錄）不上圖；湯谷與西三湯谷同名異地雙假</text>
