<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：和山＝九水合流北注大河的五曲港山（河之九都）。</text>
<text x="1090" y="276" font-size="10" fill="#666">里程自記440 vs 腿程80——5.5×為全書最大層累 variant 之一（F-0008）。</text>
<text x="1090" y="295" font-size="10" fill="#666">武羅＝人面豹文細腰白齒穿耳戴鐲——紋身人物風物記錄（人文風物證據類）。</text>
<text x="1090" y="329.5" font-size="14" font-weight="bold" fill="#333">5 站 → 現實候選（審核中）</text>
<text x="1090" y="352" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 敖岸之山</tspan>　→ 洛陽北·北望河林·夫諸｜⛰邙山·西段</text>
<text x="1090" y="373" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 青要之山</tspan>　→ 帝之密都·鯀化墠渚·武羅｜⛰邙山·青要山段</text>
<text x="1090" y="394" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 騩山</tspan>　→ 孟津方向·美棗·飛魚（同名標記）｜⛰邙山·孟津段</text>
<text x="1090" y="415" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 宜蘇之山</tspan>　→ 孟津—鞏義·金玉·黃貝｜⛰邙山·孟津—鞏義段</text>
<text x="1090" y="436" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 和山</tspan>　→ 河之九都·五曲九水北注河（終點錨）｜⛰邙山·東段鞏義</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：全鏈四腿皆東向（10/10/40/20 里），四水皆北注河（黃河）——黃河南岸微型鏈；自和山（河之九都，九水合流北注河）反向展開：宜蘇（黃貝）→騩山（美棗·飛魚）→青要（帝</text>
<text x="60" y="702" font-size="11" fill="#666">之密都·鯀化墠渚·武羅紋身人像）→敖岸（北望河林·夫諸洪水兆獸）。</text>
<text x="60" y="724" font-size="11" fill="#666">腿程 80 里≈31 km（0.385）；自記 440 里＝5.5× 層累 variant（F-0008，全書最大之一）。名稱不作錨（騩山與西一/西三同名異地）。所有對應為競爭假說，時代窗口 4000–1000 B</text>
<text x="60" y="740" font-size="11" fill="#666">CE。</text>
