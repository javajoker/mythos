<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：煇諸之山＋全鏈單受水（伊水→洛）扇形——不依昆吾等同名。</text>
<text x="1090" y="276" font-size="10" fill="#666">里程層累 4×——範圍以水系拓扑為主。</text>
<text x="1090" y="295" font-size="10" fill="#666">神皆人面鳥身（神群記錄）。</text>
<text x="1090" y="329.5" font-size="14" font-weight="bold" fill="#333">9 站 → 現實候選（審核中）</text>
<text x="1090" y="352" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 煇諸之山</tspan>　→ 洛陽南—伊洛盆地南緣（起點錨；桑·麂·褐馬雞）</text>
<text x="1090" y="373" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 發視之山</tspan>　→ 嵩縣方向（金玉·砥礪；即魚之水西注伊）</text>
<text x="1090" y="394" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 豪山</tspan>　→ 嵩縣—欒川方向（金玉裸岩）</text>
<text x="1090" y="415" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 鮮山</tspan>　→ 欒川方向（鮮水北注伊；鳴蛇→大旱）</text>
<text x="1090" y="436" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 陽山</tspan>　→ 欒川西方向（陽水北注伊；化蛇→大水）</text>
<text x="1090" y="457" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 昆吾之山</tspan>　→ 伏牛山方向（赤銅；蠪蛭；借名）</text>
<text x="1090" y="479" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 葌山</tspan>　→ 伏牛山方向（葌水北注伊；青雄黃·芒草毒魚）</text>
<text x="1090" y="500" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 獨蘇之山</tspan>　→ 伏牛山西方向（無草木多水）</text>
<text x="1090" y="521" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 蔓渠之山</tspan>　→ 伏牛山西緣·伊水源（東注洛；馬腹）</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自煇諸之山（洛陽南，桑＋麂＋褐馬雞）西南行入伊河上游南向支流帶——發視（金玉砥礪）→豪山→鮮山（鳴蛇→大旱）→陽山（化蛇→大水）→昆吾（赤銅，借名）→葌山（青雄</text>
<text x="60" y="702" font-size="11" fill="#666">黃·芒草毒魚）→獨蘇（多水）→蔓渠（伊水之源，東注洛；馬腹食人）。</text>
<text x="60" y="724" font-size="11" fill="#666">腿程 1,690 里≈650 km（0.385）vs 洛陽—欒川實距約 150 km——層累≈4×（F-0008 上限）；總結 1,670 里異文（+20 里）。所有對應為競爭假說，時代窗口 4000–1000 BCE。</text>
