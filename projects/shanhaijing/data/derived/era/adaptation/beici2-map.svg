<text x="1090" y="258" font-size="10" fill="#666">終點拓撲錨：敦題之山「是錞于北海」＝貝加爾湖南岸；北冰洋讀法（里程過遠且無雙證）降為對立候選。</text>
<text x="1090" y="276" font-size="10" fill="#666">起點弱錨：管涔之山「在河之東，其首枕汾」＝晉北呂梁；汾水西注河＋支流東注扇＝晉中盆地拓扑（借名警示，</text>
<text x="1090" y="291" font-size="10" fill="#666">不作為錨證）。</text>
<text x="1090" y="310" font-size="10" fill="#666">里程：自記 5,690 vs 腿程 5,590（-1.8%）；晉北→貝加爾實距約 1,600 km vs 腿程≈2,152 km——層累</text>
<text x="1090" y="324" font-size="10" fill="#666">約 1.34×（F-0008 帶內）；網格起點 34°N 為算術後置差異。</text>
<text x="1090" y="342" font-size="10" fill="#666">冬夏有雪三見（狂山/姑灌/小咸）＝高寒氣候錨群；𩣡馬一角與北一䑏疏同型獨角獸母題。</text>
<text x="1090" y="361" font-size="10" fill="#666">神群皆蛇身人面；祠：雄雞彘瘞＋投璧珪不糈（北方祀制差異）。</text>
<text x="1090" y="395.5" font-size="14" font-weight="bold" fill="#333">16 站 → 現實候選（審核中）</text>
<text x="1090" y="418" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 管涔之山</tspan>　→ 晉北呂梁（起點弱錨；河之東＋枕汾）｜⛰呂梁山·北段</text>
<text x="1090" y="439" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 少陽之山</tspan>　→ 呂梁—臨汾（酸水東注汾水；美赭）｜⛰呂梁山·南段</text>
<text x="1090" y="460" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 縣雍之山</tspan>　→ 晉中—忻州（晋水東南注汾水 ✓ 支流扇）｜⛰晉中—忻州山嶺</text>
<text x="1090" y="481" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 狐岐之山</tspan>　→ 忻州—原平（勝水東北注汾水；青碧蒼玉）｜⛰忻州—原平山嶺</text>
<text x="1090" y="502" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 白沙山</tspan>　→ 大同盆地—陽高（廣員三百里盡沙也；鮪水伏流）｜⛰大同盆地—陽高沙地</text>
<text x="1090" y="524" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 爾是之山</tspan>　→ 大同—豐鎮（無草木無水）｜⛰大同—豐鎮山嶺</text>
<text x="1090" y="545" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 狂山</tspan>　→ 豐鎮—興和（冬夏有雪；狂水西注浮水）｜⛰豐鎮—興和山嶺</text>
<text x="1090" y="566" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 諸餘之山</tspan>　→ 興和—商都（銅玉松柏；諸餘之水東注旄水）｜⛰興和—商都山嶺</text>
<text x="1090" y="587" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 敦頭之山</tspan>　→ 商都—化德（旄水東注印澤；𩣡馬一角）｜⛰商都—化德山嶺</text>
<text x="1090" y="608" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 鈎吾之山</tspan>　→ 化德—康保（狍鴞目在腋下食人）｜⛰化德—康保山嶺</text>
<text x="1090" y="630" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 北嚻之山</tspan>　→ 康保—張北（獨𤞞；𪄀𪃑夜行鴞）｜⛰康保—張北山嶺</text>
<text x="1090" y="651" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 梁渠之山</tspan>　→ 張北—沽源（脩水東注鴈門；居暨；嚻止腹痛）｜⛰張北—沽源山嶺</text>
<text x="1090" y="672" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 姑灌之山</tspan>　→ 沽源—多倫（冬夏有雪第三處）｜⛰沽源—多倫高寒山嶺</text>
<text x="1090" y="693" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 湖灌之山</tspan>　→ 多倫—正藍旗（湖灌之水東注海；多馬）｜⛰多倫—正藍旗山嶺</text>
<text x="1090" y="714" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 洹山</tspan>　→ 錫林浩特—阿巴嘎（三桑無枝巨木百仞；怪蛇）｜⛰錫林浩特—阿巴嘎山嶺</text>
<text x="1090" y="736" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 敦題之山</tspan>　→ 貝加爾湖南岸（錞于北海＝終點錨）｜⛰貝加爾湖南岸—伊爾庫茨克方向</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自管涔之山（晉北呂梁，河之東＋枕汾——汾水西注黃河中游）北行——呂梁南（少陽·酸水東注汾水）→晉中—忻州（縣雍·晋水東南注汾水 ✓ 支流扇）→忻州—原平（狐岐·勝水</text>
<text x="60" y="702" font-size="11" fill="#666">東北注汾水）→大同盆地（白沙山·廣員三百里盡沙也＋鮪水伏流多白玉）→豐鎮（爾是）→興和（狂山·冬夏有雪）→商都（諸餘）→化德（敦頭·旄水東注印澤＋𩣡馬一角）→康保（鈎吾·狍鴞</text>
<text x="60" y="718" font-size="11" fill="#666">食人）→張北（北嚻·獨𤞞＋𪄀𪃑夜行鴞）→沽源（梁渠·脩水東注鴈門）→多倫（姑灌·冬夏有雪）→正藍旗（湖灌之水東注海＝岱海候選）→錫林浩特（洹山·三桑無枝巨木百仞）→敦題之山（</text>
<text x="60" y="734" font-size="11" fill="#666">貝加爾湖南岸終點：錞于北海）。</text>
<text x="60" y="756" font-size="11" fill="#666">腿程 5,590 里≈2,152 km（0.385）vs 自記 5,690 里（-1.8% variant）；晉北→貝加爾實距約 1,600 km——層累約 1.34×（帶內）；網格起點為算術後置差異。所有對應為競爭假說，</text>
<text x="60" y="772" font-size="11" fill="#666">時代窗口 4000–1000 BCE；後世同名（管涔/汾/晋水等）不作反證；北海與北一泰澤同指待裁。</text>
