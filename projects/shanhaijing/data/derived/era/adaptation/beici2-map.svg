<text x="1090" y="258" font-size="10" fill="#666">終點拓撲錨：敦題之山「是錞于北海」＝貝加爾湖南岸；北冰洋讀法（里程過遠且無雙證）降為對立候選。</text>
<text x="1090" y="276" font-size="10" fill="#666">起點弱錨：管涔之山「在河之東，其首枕汾」＝晉北呂梁；汾水西注河＋支流東注扇＝晉中盆地拓扑（借名警示，</text>
<text x="1090" y="291" font-size="10" fill="#666">不作為錨證）。</text>
<text x="1090" y="310" font-size="10" fill="#666">里程：自記 5,690 vs 逐腿原文重加 5,240（-7.9%）；舊值 5,590（幻影 +350）撤回（RT-B01）；晉北→貝</text>
<text x="1090" y="324" font-size="10" fill="#666">加爾實距 ≈1,600 km vs 腿程 ≈2,017 km（0.385）≈1.26×；分段病理：前 14 腿 ≈4.8× 膨脹、末兩腿</text>
<text x="1090" y="338" font-size="10" fill="#666"> ≈0.4× 壓縮（G-4 不許對沖）。</text>
<text x="1090" y="357" font-size="10" fill="#666">冬夏有雪四站（RT-B08 結案 2026-10-27）：狂山→大青山·東段高海拔段（狂水→大黑河方向 ✓）；姑灌→小</text>
<text x="1090" y="372" font-size="10" fill="#666">五台山·東台（2,882 m）；小咸→陰山—大青山（北一）；空桑→五台山北台 3,061 m ✓（北三）；舊候選（</text>
<text x="1090" y="386" font-size="10" fill="#666">豐鎮—興和／沽源—多倫等）降 rejected_rival。</text>
<text x="1090" y="404" font-size="10" fill="#666">神群皆蛇身人面；祠：雄雞彘瘞＋投璧珪不糈（北方祀制差異）。</text>
<text x="1090" y="439.0" font-size="14" font-weight="bold" fill="#333">16 站 → 現實候選（審核中）</text>
<text x="1090" y="461" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 管涔之山</tspan>　→ 晉北呂梁（起點弱錨；河之東＋枕汾）｜⛰呂梁山·北段</text>
<text x="1090" y="482" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 少陽之山</tspan>　→ 呂梁—臨汾（酸水東注汾水；美赭）｜⛰呂梁山·南段</text>
<text x="1090" y="503" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 縣雍之山</tspan>　→ 晉中—忻州（晋水東南注汾水 ✓ 支流扇）｜⛰晉中—忻州山嶺</text>
<text x="1090" y="525" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 狐岐之山</tspan>　→ 忻州—原平（勝水東北注汾水；青碧蒼玉）｜⛰忻州—原平山嶺</text>
<text x="1090" y="546" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 白沙山</tspan>　→ 大同盆地—陽高（廣員三百里盡沙也；鮪水伏流）｜⛰大同盆地—陽高沙地</text>
<text x="1090" y="567" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 爾是之山</tspan>　→ 大同—豐鎮（無草木無水）｜⛰大同—豐鎮山嶺</text>
<text x="1090" y="588" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 狂山</tspan>　→ 大青山·東段（冬夏有雪·RT-B08 結案；狂水→大黑河方向）｜⛰大青山·東段高海拔段</text>
<text x="1090" y="609" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 諸餘之山</tspan>　→ 興和—商都（銅玉松柏；諸餘之水東注旄水）｜⛰興和—商都山嶺</text>
<text x="1090" y="631" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 敦頭之山</tspan>　→ 商都—化德（旄水東注印澤；𩣡馬一角）｜⛰商都—化德山嶺</text>
<text x="1090" y="652" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 鈎吾之山</tspan>　→ 化德—康保（狍鴞目在腋下食人）｜⛰化德—康保山嶺</text>
<text x="1090" y="673" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 北嚻之山</tspan>　→ 康保—張北（獨𤞞；𪄀𪃑夜行鴞）｜⛰康保—張北山嶺</text>
<text x="1090" y="694" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 梁渠之山</tspan>　→ 張北—沽源（脩水東注鴈門；居暨；嚻止腹痛）｜⛰張北—沽源山嶺</text>
<text x="1090" y="715" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 姑灌之山</tspan>　→ 小五台山（冬夏有雪第三處·RT-B08 結案）｜⛰小五台山·東台 2,882 m</text>
<text x="1090" y="737" font-size="11" fill="#7b241c"><tspan font-weight="bold">14 湖灌之山</tspan>　→ 多倫—正藍旗（湖灌之水東注海；多馬）｜⛰多倫—正藍旗山嶺</text>
<text x="1090" y="758" font-size="11" fill="#7b241c"><tspan font-weight="bold">15 洹山</tspan>　→ 錫林浩特—阿巴嘎（三桑無枝巨木百仞；怪蛇）｜⛰錫林浩特—阿巴嘎山嶺</text>
<text x="1090" y="779" font-size="11" fill="#7b241c"><tspan font-weight="bold">16 敦題之山</tspan>　→ 貝加爾湖南岸（錞于北海＝終點錨）｜⛰貝加爾湖南岸—伊爾庫茨克方向</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自管涔之山（晉北呂梁，河之東＋枕汾——汾水西注黃河中游）北行——呂梁南（少陽·酸水東注汾水）→晉中—忻州（縣雍·晋水東南注汾水 ✓ 支流扇）→忻州—原平（狐岐·勝水</text>
<text x="60" y="702" font-size="11" fill="#666">東北注汾水）→大同盆地（白沙山·廣員三百里盡沙也＋鮪水伏流多白玉）→豐鎮（爾是）→大青山東段（狂山·冬夏有雪——RT-B08 結案）→商都（諸餘）→化德（敦頭·旄水東注印澤＋𩣡馬</text>
<text x="60" y="718" font-size="11" fill="#666">一角）→康保（鈎吾·狍鴞食人）→張北（北嚻·獨𤞞＋𪄀𪃑夜行鴞）→沽源（梁渠·脩水東注鴈門）→小五台山（姑灌·冬夏有雪——RT-B08 結案）→正藍旗（湖灌之水東注海＝岱海候選）→錫</text>
<text x="60" y="734" font-size="11" fill="#666">林浩特（洹山·三桑無枝巨木百仞）→敦題之山（貝加爾湖南岸終點：錞于北海）。</text>
