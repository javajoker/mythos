<text x="1124" y="166" font-size="11" fill="#444">海岸山地（海水南入）</text>
<line x1="1090" y1="184" x2="1116" y2="184" stroke="#16a085" stroke-width="2.5"/>
<text x="1124" y="188" font-size="11" fill="#444">藥草—長生母題</text>
