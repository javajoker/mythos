<text x="1090" y="96" font-size="14" font-weight="bold" fill="#333">圖例</text>
<circle cx="1103" cy="118" r="8" fill="#c0392b"/>
<text x="1124" y="122" font-size="11" fill="#444">復用錨（山經節點）</text>
<line x1="1090" y1="140" x2="1116" y2="140" stroke="#8e44ad" stroke-width="2.5"/>
<text x="1124" y="144" font-size="11" fill="#444">新增族群/神格（待錨或區域）</text>
