<text x="1090" y="258" font-size="10" fill="#666">復用錨：軒轅之丘＝西三 MTN:SHJ-02-3-012#1（大沙海—卡蘭西奧沙海北緣丘台）；本卷三次錨用——軒轅國</text>
<text x="1090" y="272" font-size="10" fill="#666">鄰接、窮山「不敢西射」、諸夭「在四蛇北」。</text>
<text x="1090" y="291" font-size="10" fill="#666">走向假設（假設級別：方向性）：南段＝努比亞—利比亞沙漠綠洲帶北行線；北段＝昔蘭尼加—中地中海西北岸；</text>
<text x="1090" y="306" font-size="10" fill="#666">起點結匈國待 book06 錨定。</text>
<text x="1090" y="324" font-size="10" fill="#666">借名警示：夏后啟（傳說帝王，不作年代錨）／肅慎（後世東北亞族名）／巫咸（巫名東西兩見）／軒轅（北三軒</text>
<text x="1090" y="338" font-size="10" fill="#666">轅之山同名異實）——雙假說並存，本層不裁。</text>
<text x="1090" y="357" font-size="10" fill="#666">神話層：刑天與帝爭神／女丑十日炙殺／夏后啟儛九代／西方蓐收（四方神框架）——不作族群遷徙或年代實錄。</text>
<text x="1090" y="391.5" font-size="14" font-weight="bold" fill="#333">本卷地點/區域 → 現實候選（審核中）</text>
<text x="1090" y="414" font-size="9.5" fill="#2f9e8f">結匈國 → book06 西端錨（待裁）</text>
<text x="1090" y="431" font-size="9.5" fill="#2f9e8f">滅蒙鳥 → 結匈北；青身赤尾</text>
<text x="1090" y="448" font-size="9.5" fill="#2f9e8f">大運山 → 撒哈拉孤高地方向</text>
<text x="1090" y="466" font-size="9.5" fill="#2f9e8f">大樂之野 → 庫夫拉綠洲方向·神話層</text>
<text x="1090" y="484" font-size="9.5" fill="#8e44ad">三身國 → 綠洲帶族群</text>
<text x="1090" y="501" font-size="9.5" fill="#8e44ad">一臂國 → 體貌圖騰記錄</text>
<text x="1090" y="518" font-size="9.5" fill="#8e44ad">奇肱國 → 機巧族群傳說</text>
<text x="1090" y="536" font-size="9.5" fill="#2f9e8f">常羊之山 → 刑天葬地（神話層）</text>
<text x="1090" y="554" font-size="9.5" fill="#8e44ad">女祭女戚 → 兩水閒祭司群</text>
<text x="1090" y="571" font-size="9.5" fill="#2f9e8f">維鳥居山 → 人面鳥禁忌（一曰維鳥）</text>
<text x="1090" y="588" font-size="9.5" fill="#8e44ad">丈夫國 → 衣冠帶劍族群</text>
<text x="1090" y="606" font-size="9.5" fill="#2f9e8f">女丑之屍 → 十日炙殺（神話層）</text>
<text x="1362" y="414" font-size="9.5" fill="#8e44ad">巫咸國·登葆山 → 群巫聖山（登葆山）</text>
<text x="1362" y="431" font-size="9.5" fill="#8e44ad">并封 → 雙首彘（巫咸東）</text>
<text x="1362" y="448" font-size="9.5" fill="#8e44ad">女子國 → 環水聚落</text>
<text x="1362" y="466" font-size="9.5" fill="#c0392b">軒轅之國 → 復用西三軒轅之丘</text>
<text x="1362" y="484" font-size="9.5" fill="#c0392b">軒轅之丘 → 西三復用錨（硬錨）</text>
<text x="1362" y="501" font-size="9.5" fill="#2f9e8f">窮山 → 軒轅國北邊界山</text>
<text x="1362" y="518" font-size="9.5" fill="#2f9e8f">諸夭之野 → 昔蘭尼加綠帶方向</text>
<text x="1362" y="536" font-size="9.5" fill="#8e44ad">龍魚 → 海岸兩棲大魚</text>
<text x="1362" y="554" font-size="9.5" fill="#8e44ad">白民國 → 白身披髮族群</text>
<text x="1362" y="571" font-size="9.5" fill="#8e44ad">肅慎國 → 西北陬（借名警示）</text>
<text x="1362" y="588" font-size="9.5" fill="#8e44ad">長股國 → 西北陬終點族群</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：海外自西南陬至西北陬——起於結匈國（book06 西端跨界錨，待裁）北之滅蒙鳥，經大運山（撒哈拉孤高地方向）→大樂之野（庫夫拉綠洲方向；夏后啟儛九代＝神話層）→體貌型</text>
<text x="60" y="702" font-size="11" fill="#666">國群（三身→一臂→奇肱——機巧傳說族群）→刑天葬常羊之山（神話插段）→巫儀主題帶（女祭女戚居兩水閒→䳐𪆻人面鳥→丈夫國衣冠帶劍→女丑十日炙殺→巫咸國登葆山群巫上下；并封在</text>
<text x="60" y="718" font-size="11" fill="#666">巫咸東）→女子國（水周之）→軒轅之國／軒轅之丘（本卷硬錨，復用西三——人面蛇身、其丘方四蛇相繞、不敢西射）→北段：窮山→諸夭之野（鸞歌鳳舞、鳳卵甘露——昔蘭尼加綠帶方向）</text>
<text x="60" y="734" font-size="11" fill="#666">→龍魚陵居（海岸兩棲）→白民國→肅慎國（雒棠取衣；後世東北亞族名借名警示）→長股國（西北陬終點）→西方蓐收收束（四方神框架）。</text>
<text x="60" y="756" font-size="11" fill="#666">方法：框架書區域調查——復用錨定＋方向性指向取代里程算術；全卷唯一硬錨＝軒轅之丘（西三復用，被本卷三次錨用）；pending_anchor 點僅示方向不編坐標；所有對應為競爭假說，時代</text>
<text x="60" y="772" font-size="11" fill="#666">窗口 4000–1000 BCE；後世同名（肅慎、巫咸、軒轅北三層）不反證時代記錄（借名警示）；神話層（刑天/女丑/啟/蓐收）不作實錄。</text>
</svg>