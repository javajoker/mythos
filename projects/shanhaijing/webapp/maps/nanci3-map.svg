<text x="1090" y="258" font-size="10" fill="#666">起點弱錨：天虞之山（其下多水不可以上）＝桂西喀斯特窪地水鄉；可信度 low。</text>
<text x="1090" y="276" font-size="10" fill="#666">生物錨級：禱過之山犀兕象三連＝熱帶動物群（4000–1000 BCE 嶺南—滇南有犀象；後世南退不作否決）。</text>
<text x="1090" y="295" font-size="10" fill="#666">里程：自記 6,530 vs 腿程 5,730（-12%）；凡十四山 vs 13 站（旄山之首佚失 variant）。</text>
<text x="1090" y="314" font-size="10" fill="#666">神群皆龍身人面；祠：白狗祈＋稌米（犬牲——與東一犬祈同型）。鳳皇五德文（德義禮仁信）＝祥瑞源頭記錄。</text>
<text x="1090" y="348.0" font-size="14" font-weight="bold" fill="#333">13 站 → 現實候選（審核中）</text>
<text x="1090" y="370" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 1 天虞之山</tspan>　→ 桂西—滇東南（起點弱錨；多水不可上）｜⛰雲貴高原·滇東南—桂西</text>
<text x="1090" y="391" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 2 禱過之山</tspan>　→ 桂西—滇東南（★犀兕象三連）｜⛰桂西—滇東南（熱帶動物群帶）</text>
<text x="1090" y="412" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 3 丹穴之山</tspan>　→ 桂西—桂中（★鳳皇首出·五德文）｜⛰桂西—桂中（丹砂帶方向）</text>
<text x="1090" y="434" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 4 發爽之山</tspan>　→ 桂中—桂東（白猿；汎水南注）｜⛰桂中—桂東山嶺</text>
<text x="1090" y="455" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 5 旄山之尾</tspan>　→ 桂東—粵西（育遺谷＝凱風風口）｜⛰桂東—粵西山嶺</text>
<text x="1090" y="476" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 6 非山之首</tspan>　→ 粵西—粵中（蝮虫；脈首站性）｜⛰粵西—粵中山地</text>
<text x="1090" y="497" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 7 陽夾之山</tspan>　→ 粵中（無草木多水）｜⛰粵中山地</text>
<text x="1090" y="518" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 8 灌湘之山</tspan>　→ 粵中—粵東北（怪鳥無獸；借名）｜⛰粵中—粵東北山嶺</text>
<text x="1090" y="540" font-size="11" fill="#7b241c"><tspan font-weight="bold"> 9 雞山</tspan>　→ 粵東（黑水南注海✓；鱄魚旱兆）｜⛰粵東山嶺</text>
<text x="1090" y="561" font-size="11" fill="#7b241c"><tspan font-weight="bold">10 令丘之山</tspan>　→ 粵東—雷州（多火＝火山候選；條風）｜⛰粵東—雷州方向</text>
<text x="1090" y="582" font-size="11" fill="#7b241c"><tspan font-weight="bold">11 侖者之山</tspan>　→ 粵東（白䓘·血玉工藝）｜⛰粵東山嶺</text>
<text x="1090" y="603" font-size="11" fill="#7b241c"><tspan font-weight="bold">12 禺槀之山</tspan>　→ 粵東—閩南（怪獸大蛇）｜⛰粵東—閩南山嶺</text>
<text x="1090" y="624" font-size="11" fill="#7b241c"><tspan font-weight="bold">13 南禺之山</tspan>　→ 閩南—粵東沿海（季節湧水穴；鳳皇鵷鶵·終點）｜⛰閩南—粵東沿海丘陵</text>
<text x="60" y="686" font-size="11" fill="#666">推理說明：自天虞之山（桂西—滇東南，喀斯特水鄉）東行——禱過之山（犀兕象熱帶動物群三連＋虎蛟）→丹穴之山（鳳皇首出·五德文；丹水南注渤海＝借名北部灣）→發爽（白猿）→旄山</text>
<text x="60" y="702" font-size="11" fill="#666">之尾（育遺谷·凱風南風風口；旄山之首佚失）→非山之首（蝮虫）→陽夾→灌湘（多木無草·怪鳥無獸）→雞山（黑水南注海＋鱄魚旱兆）→令丘（多火＝火山候選＋條風東北風口＋顒）→侖者</text>
<text x="60" y="718" font-size="11" fill="#666">（白䓘血玉工藝）→禺槀（大蛇）→南禺之山（季節湧水穴「夏出冬閉」＋佐水東南注海＋鳳皇鵷鶵群棲——終點）。</text>
<text x="60" y="740" font-size="11" fill="#666">腿程 5,730 里≈2,206 km（0.385）vs 自記 6,530 里（-12% variant）；桂西—粵閩實距約 1,200 km——層累約 1.8×（帶內）；令丘以東網格入海記 variant。所有對應為競爭假說</text>
<text x="60" y="756" font-size="11" fill="#666">，時代窗口 4000–1000 BCE；渤海/丹水借名、黑水共名（F-0011 規則）不作反證。</text>
</svg>