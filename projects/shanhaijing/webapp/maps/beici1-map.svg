<text x="1090" y="258" font-size="10" fill="#666">拓撲錨：敦薨之山「河原」＋西注泑澤＋赤鮭旄牛＝杭愛山北麓（色楞格/鄂爾渾河源）；「昆侖東北隅」＝跨卷</text>
<text x="1090" y="272" font-size="10" fill="#666">引用不作錨。</text>
<text x="1090" y="291" font-size="10" fill="#666">生業錨：隄山「其山北人皆生食不火之物」＋小咸之山「冬夏有雪」＝亞寒帶生業與氣候雙錨；北三-048「此皆</text>
<text x="1090" y="306" font-size="10" fill="#666">不火食」互證。</text>
